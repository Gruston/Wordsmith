      margin: 0;
      padding: 0;

      overflow: hidden;
      height: 100%;
      width: 100%;
      -webkit-overflow-scrolling: touch;

      height: 100%;

      position: fixed;
      inset: 0;
      background: #08080c;
      display: flex;

      justify-content: center;

  <script>
// tier-service.js
// WordSmith Tier Unlock Service
//
// Pure functions — no React, no I/O, no side effects.
// Safe to call inside useMemo. Never call inside render directly.
//
// TIER STRUCTURE:
//   Tier 1 (Foundational)  — always unlocked
//   Tier 2 (Intermediate)  — unlocks after mastering 50% of Tier 1, capped at 50 words
//   Tier 3 (Advanced)      — unlocks after mastering 50% of Tier 2, capped at 50 words
//   Tier 4 (Expert)        — unlocks after mastering 50% of Tier 3, capped at 50 words
//
// "Mastered" = status === "familiar" OR status === "mastered"
// (Both count — "familiar" is the intermediate SM-2 state before full mastery)

"use strict";

/**
 * Returns the number of mastered words in a tier required to unlock the next tier.
 * Formula: min(50, floor(tierWordCount * 0.5))
 * Tier 1 always unlocked — this function is only used for tiers 2–4.
 *
 * @param {number} tierWordCount - number of words in the current tier
 * @returns {number} mastery threshold
 */
function getTierUnlockThreshold(tierWordCount) {
  if (typeof tierWordCount !== "number" || tierWordCount <= 0) return 0;
  return Math.min(50, Math.floor(tierWordCount * 0.5));
}

/**
 * Returns true if a given tier is unlocked for the user.
 * Tier 1 is always unlocked.
 * Tiers 2–4 require sufficient mastery of the previous tier.
 *
 * @param {number} tier - tier number to check (1–4)
 * @param {Array<{id:number,status:string}>} words - the full merged word array (with current status)
 * @returns {boolean}
 */
function isTierUnlocked(tier, words) {
  if (!Array.isArray(words)) return tier === 1;
  if (tier <= 1) return true;

  const prevTier = tier - 1;
  const prevTierWords = words.filter(function(w) { return w.tier === prevTier; });
  const threshold = getTierUnlockThreshold(prevTierWords.length);

  // No words in previous tier = treat as unlocked (graceful fallback)
  if (prevTierWords.length === 0) return true;

  const masteredCount = prevTierWords.filter(function(w) {
    return w.status === "familiar" || w.status === "mastered";
  }).length;

  return masteredCount >= threshold;
}

/**
 * Returns the set of currently unlocked tier numbers for a user.
 * Computed once after load — never inside render.
 *
 * @param {Array} words - full merged word array with current status
 * @returns {Set<number>}
 */
function getUnlockedTiers(words) {
  var unlocked = new Set();
  for (var t = 1; t <= 4; t++) {
    if (isTierUnlocked(t, words)) {
      unlocked.add(t);
    } else {
      // Tiers are sequential — if tier N is locked, N+1 and N+2 are also locked
      break;
    }
  }
  return unlocked;
}

/**
 * Filters a word array to only include words from unlocked tiers.
 * Words without a `tier` field (legacy words from INITIAL_WORDS_DB) are always included.
 *
 * @param {Array} words - full merged word array
 * @returns {Array} filtered word array
 */
function getUnlockedWords(words) {
  if (!Array.isArray(words) || words.length === 0) return [];
  var unlockedTiers = getUnlockedTiers(words);
  return words.filter(function(w) {
    // Legacy words without tier field are always accessible
    if (w.tier === undefined || w.tier === null) return true;
    return unlockedTiers.has(w.tier);
  });
}

/**
 * Returns a human-readable progress summary for a given tier.
 * Useful for UI display — "12 / 30 mastered to unlock Tier 3"
 *
 * @param {number} tier - the NEXT tier (the one you want to unlock), 2–4
 * @param {Array} words - full merged word array with current status
 * @returns {{ mastered: number, threshold: number, total: number, unlocked: boolean }}
 */
function getTierProgress(tier, words) {
  if (tier <= 1) return { mastered: 0, threshold: 0, total: 0, unlocked: true };
  if (!Array.isArray(words)) return { mastered: 0, threshold: 0, total: 0, unlocked: false };

  var prevTier = tier - 1;
  var prevTierWords = words.filter(function(w) { return w.tier === prevTier; });
  var threshold = getTierUnlockThreshold(prevTierWords.length);
  var mastered = prevTierWords.filter(function(w) {
    return w.status === "familiar" || w.status === "mastered";
  }).length;

  return {
    mastered: mastered,
    threshold: threshold,
    total: prevTierWords.length,
    unlocked: mastered >= threshold,
  };
}

/**
 * Merges the extended word database with INITIAL_WORDS_DB.
 * - Extended words default tier-unlocking: tier 1 words visible immediately,
 *   higher tiers follow tier unlock rules.
 * - Words from extendedWords are appended after existing words.
 * - No duplicate IDs allowed (extendedWords must use IDs >= 1000).
 *
 * Safe to call at app initialisation. Returns a new array (no mutation).
 *
 * @param {Array} initialWords - INITIAL_WORDS_DB from index.html
 * @param {Array} extendedWords - EXTENDED_WORDS_DB from words.js (may be empty if script failed)
 * @returns {Array}
 */
function mergeWordDBs(initialWords, extendedWords) {
  if (!Array.isArray(initialWords)) {
    console.error("[tier-service] mergeWordDBs: initialWords is not an array");
    return [];
  }
  if (!Array.isArray(extendedWords) || extendedWords.length === 0) {
    // words.js failed to load or is empty — fall back gracefully
    return initialWords.slice();
  }

  // Defensive: check for ID collisions (should never happen if IDs are correct)
  var existingIds = new Set(initialWords.map(function(w) { return w.id; }));
  var safeExtended = extendedWords.filter(function(w) {
    if (existingIds.has(w.id)) {
      console.warn("[tier-service] mergeWordDBs: skipping duplicate ID " + w.id + " (" + w.word + ")");
      return false;
    }
    return true;
  });

  return initialWords.concat(safeExtended);
}

// ── Export to window ──
// Available to index.html which loads this file as a plain script before Babel
if (typeof window !== "undefined") {
  window.TierService = {
    getTierUnlockThreshold: getTierUnlockThreshold,
    isTierUnlocked: isTierUnlocked,
    getUnlockedTiers: getUnlockedTiers,
    getUnlockedWords: getUnlockedWords,
    getTierProgress: getTierProgress,
    mergeWordDBs: mergeWordDBs,
  };
}

  for (const word of EXTENDED_WORDS_DB) {
    let ok = true;
    for (const field of REQUIRED_FIELDS) {
      if (word[field] === undefined || word[field] === null) {
        console.warn(`[words.js] Word "${word.word}" (id:${word.id}) missing field: ${field} — skipped`);
        ok = false; break;
      }
    }
    if (!ok) continue;
    if (ids.has(word.id)) {
      console.warn(`[words.js] Duplicate ID ${word.id} (${word.word}) — skipped`);
      continue;
    }
    if (!VALID_CATEGORIES.has(word.category)) {
      console.warn(`[words.js] Invalid category "${word.category}" for "${word.word}" — skipped`);
      continue;
    }
    if (!VALID_LISTS.has(word.list)) {
      console.warn(`[words.js] Invalid list "${word.list}" for "${word.word}" — skipped`);
      continue;
    }
    if (!VALID_TIERS.has(word.tier)) {
      console.warn(`[words.js] Invalid tier ${word.tier} for "${word.word}" — skipped`);
      continue;
    }
    if (word.id < 1000) {
      console.warn(`[words.js] ID ${word.id} in reserved range for "${word.word}" — skipped`);
      continue;
    }
    ids.add(word.id);
    validated.push(word);

    console.warn(`[words.js] ${EXTENDED_WORDS_DB.length - validated.length} word(s) failed validation and were excluded.`);

/* Pronunciation helper — Web Speech API with Australian/British English preference */
/* Preload voices on module init */
let cachedVoice = null;
try {
  const synth = window.speechSynthesis;
  if (synth) {
    const loadVoices = () => {
      const voices = synth.getVoices();
      cachedVoice = voices.find(v => v.lang === "en-AU")
        || voices.find(v => v.lang === "en-GB")
        || voices.find(v => v.lang.startsWith("en"));
    };
    loadVoices();
    if (synth.onvoiceschanged !== undefined) synth.onvoiceschanged = loadVoices;
  }
} catch(e) { /* silent */ }

const speak = (word) => {
  try {
    const synth = window.speechSynthesis;
    if (!synth) return;
    /* Cancel any in-progress speech */
    synth.cancel();
    const u = new SpeechSynthesisUtterance(word);
    u.rate = 0.85;
    u.pitch = 1.0;
    u.volume = 1.0;
    /* Use cached voice or find one fresh */
    if (cachedVoice) {
      u.voice = cachedVoice;
      u.lang = cachedVoice.lang;
    } else {
      const voices = synth.getVoices();
      const preferred = voices.find(v => v.lang === "en-AU")
        || voices.find(v => v.lang === "en-GB")
        || voices.find(v => v.lang.startsWith("en"));
      if (preferred) { u.voice = preferred; u.lang = preferred.lang; }
      else { u.lang = "en-AU"; }
    }
    synth.speak(u);
  } catch (e) { /* silent fail */ }
};

/* Shuffle helper — Fisher-Yates */
const shuffle = (arr) => {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];

  return a;
};

/* Returns today's local date as "YYYY-MM-DD" */
const todayISO = () => new Date().toLocaleDateString("en-CA");

/* Add N days to an ISO date string */
const addDays = (isoDate, n) => {
  const d = new Date(isoDate + "T00:00:00");
  d.setDate(d.getDate() + n);
  return d.toLocaleDateString("en-CA");
};

/* SM-2 algorithm — pure function
   rating: 0=Again  1=Hard  2=Good  3=Easy
   Returns updated word fields (does NOT mutate the word)
*/
const applySM2 = (word, rating, today) => {
  const qualityMap = { 0: 1, 1: 2, 2: 4, 3: 5 };
  const q = qualityMap[rating] ?? 4;
  let { interval = 1, easeFactor = 2.5, repetitions = 0 } = word;

  if (q < 3) {
    repetitions = 0;
    interval = 1;
  } else {
    if (repetitions === 0)      interval = 1;
    else if (repetitions === 1) interval = 3;
    else                        interval = Math.round(interval * easeFactor);
    repetitions += 1;
  }

  easeFactor = Math.max(1.3,
    easeFactor + 0.1 - (5 - q) * (0.08 + (5 - q) * 0.02)
  );

  const nextReview = addDays(today, interval);
  const strength = Math.min(5, repetitions === 0 ? 0 : Math.min(5, Math.ceil(interval / 7) + 1));
  const status =
    repetitions === 0 ? "new"
    : interval <= 1   ? "learning"
    : interval <= 7   ? "familiar"
    : "mastered";

  return { interval, easeFactor, repetitions, nextReview, lastReviewed: today, status, strength };
};

const getLevelData = (totalXP) => {
  let current = LEVELS[0];
  for (const l of LEVELS) { if (totalXP >= l.xpReq) current = l; else break; }
  const next = LEVELS.find(l => l.xpReq > totalXP);
  const xpInLevel = totalXP - current.xpReq;
  const xpToNext = next ? next.xpReq - current.xpReq : 1;
  return { ...current, xpInLevel, xpToNext, next };
};

*/
const calcStreak = (lastPracticeDate, currentStreak, today) => {
  if (!lastPracticeDate) return currentStreak; // haven't done first session yet

  const yesterday = addDays(today, -1);
  if (lastPracticeDate === yesterday) return currentStreak; // kept alive, will +1 on completion

};

/* Badge check — returns array of newly unlocked badge IDs */
const checkBadges = (state) => {
  const unlocked = state.unlockedBadges || [];
  return BADGES
    .filter(b => !unlocked.includes(b.id) && b.check(state))
    .map(b => b.id);
};

/* ════════════════════════════════════════════
   PERSISTENCE — localStorage wrapper
   Keys:
     wordsmith_user  → user prefs + gamification state
     wordsmith_words → word progress array
     wordsmith_journal → journal entries
   ════════════════════════════════════════════ */
const STORAGE_KEYS = {
  USER:    "wordsmith_user",
  WORDS:   "wordsmith_words",
  JOURNAL: "wordsmith_journal",
};

const Storage = {
  get(key) {
    try {
      const raw = localStorage.getItem(key);
      return raw ? JSON.parse(raw) : null;
    } catch { return null; }
  },
  set(key, value) {
    try { localStorage.setItem(key, JSON.stringify(value)); } catch {}
  },
  clear() {
    try {
      Object.values(STORAGE_KEYS).forEach(k => localStorage.removeItem(k));
    } catch {}
  },
};

  { id:4, word:"Opulence", pronunciation:"OP-yoo-lence", definition:"Great wealth or luxuriousness.", synonyms:["lavishness","richness","affluence","splendour"], textContext:"The opulence of Gatsby's mansion masks a profound spiritual emptiness.", examples:[{source:"Text",text:"Gatsby's parties overflow with opulence — champagne, orchestras, and excess."},{source:"Essay",text:"Fitzgerald equates opulence with moral decay throughout the novel."},{source:"Everyday",text:"The hotel lobby was decorated with breathtaking opulence."}], tags:["Gatsby","Text-Specific"], category:"text-specific", list:"gatsby", difficulty:1, strength:2, status:"learning" },
  { id:5, word:"Disillusionment", pronunciation:"dis-ih-LOO-zhun-ment", definition:"The feeling of disappointment when something is not as good as expected.", synonyms:["disappointment","disenchantment","cynicism"], textContext:"Nick's disillusionment with the East drives him back to the Midwest.", examples:[{source:"Text",text:"Nick grows disillusioned with the carelessness of Tom and Daisy."},{source:"Essay",text:"The novel charts a journey from aspiration to disillusionment."},{source:"Everyday",text:"Her disillusionment with university came in the second semester."}], tags:["Gatsby","Character & Theme"], category:"analytical", list:"gatsby", difficulty:1, strength:3, status:"learning" },
  { id:6, word:"Facade", pronunciation:"fuh-SAHD", definition:"A false or misleading outward appearance.", synonyms:["front","mask","pretence","veneer"], textContext:"Gatsby constructs an elaborate facade to conceal his humble origins.", examples:[{source:"Text",text:"Behind the facade of wealth lies Jay Gatz, the son of poor farmers."},{source:"Essay",text:"The facade motif underscores the novel's critique of the American Dream."},{source:"Everyday",text:"Her cheerful facade hid deep anxiety."}], tags:["Gatsby","Character & Theme"], category:"analytical", list:"gatsby", difficulty:1, strength:0, status:"new" },
  { id:7, word:"Decadence", pronunciation:"DEK-uh-dense", definition:"Moral or cultural decline, especially through excessive indulgence.", synonyms:["debauchery","excess","degeneracy","self-indulgence"], textContext:"The decadence of the Jazz Age parties symbolises a society losing its moral compass.", examples:[{source:"Text",text:"Gatsby's world is one of decadence disguised as the pursuit of a dream."},{source:"Essay",text:"Fitzgerald portrays decadence as both alluring and destructive."},{source:"Everyday",text:"The Roman Empire's fall is often attributed to decadence."}], tags:["Gatsby","Character & Theme"], category:"text-specific", list:"gatsby", difficulty:2, strength:0, status:"new" },
  { id:8, word:"Illusory", pronunciation:"ih-LOO-suh-ree", definition:"Based on illusion; not real.", synonyms:["deceptive","imaginary","false","unreal"], textContext:"The green light represents an illusory dream — always visible, never reachable.", examples:[{source:"Text",text:"Gatsby's wealth creates an illusory world that masks his true self."},{source:"Essay",text:"Fitzgerald reveals the American Dream as fundamentally illusory."},{source:"Everyday",text:"The oasis on the horizon turned out to be illusory — just a mirage."}], tags:["Gatsby","Character & Theme"], category:"analytical", list:"gatsby", difficulty:2, strength:0, status:"new" },
  { id:9, word:"Extravagance", pronunciation:"ek-STRAV-uh-gunce", definition:"Excessive spending or lack of restraint in spending money or resources.", synonyms:["excess","lavishness","profligacy","wastefulness"], textContext:"Gatsby's extravagance is driven by a desperate desire to impress Daisy.", examples:[{source:"Text",text:"The extravagance of the parties stands in stark contrast to the Valley of Ashes."},{source:"Essay",text:"Fitzgerald uses extravagance to expose the hollowness at the heart of wealth."},{source:"Everyday",text:"The wedding was criticised for its unnecessary extravagance."}], tags:["Gatsby","Text-Specific"], category:"text-specific", list:"gatsby", difficulty:1, strength:0, status:"new" },
  { id:10, word:"Insouciant", pronunciation:"in-SOO-see-unt", definition:"Showing a casual lack of concern; carefree in a way that suggests indifference.", synonyms:["nonchalant","carefree","unconcerned","breezy"], textContext:"Tom and Daisy's insouciant destruction of others' lives epitomises their class privilege.", examples:[{source:"Text",text:"They smashed up things and creatures and then retreated back into their vast carelessness."},{source:"Essay",text:"The insouciant attitude of the wealthy class reveals their moral bankruptcy."},{source:"Everyday",text:"She gave an insouciant shrug, as if the whole thing didn't matter."}], tags:["Gatsby","Character & Theme"], category:"text-specific", list:"gatsby", difficulty:3, strength:0, status:"new" },

  // === MACBETH ===
  { id:20, word:"Hubris", pronunciation:"HYOO-bris", definition:"Excessive pride or self-confidence, often leading to downfall.", synonyms:["arrogance","overconfidence","conceit","presumption"], textContext:"Macbeth's hubris blinds him to the consequences of regicide, sealing his tragic fate.", examples:[{source:"Text",text:"I have no spur to prick the sides of my intent, but only vaulting ambition."},{source:"Essay",text:"Shakespeare presents Macbeth's hubris as the catalyst for Scotland's descent into chaos."},{source:"Everyday",text:"His hubris in ignoring all advice led to spectacular failure."}], tags:["Macbeth","Character & Theme"], category:"analytical", list:"macbeth", difficulty:1, strength:1, status:"learning" },
  { id:21, word:"Regicide", pronunciation:"REJ-ih-syde", definition:"The killing of a king or queen, especially by a subject.", synonyms:["king-slaying","assassination of a monarch"], textContext:"Macbeth's act of regicide sets the entire tragedy in motion.", examples:[{source:"Text",text:"The murder of Duncan is the pivotal act of regicide in the play."},{source:"Essay",text:"Shakespeare frames regicide as an act against the natural order itself."},{source:"Everyday",text:"Regicide was considered the most heinous of crimes in medieval Europe."}], tags:["Macbeth","Text-Specific"], category:"text-specific", list:"macbeth", difficulty:2, strength:0, status:"new" },
  { id:22, word:"Tyranny", pronunciation:"TEER-uh-nee", definition:"Cruel and oppressive rule by a single authority.", synonyms:["despotism","oppression","autocracy","dictatorship"], textContext:"Macbeth's reign devolves from ambition into outright tyranny.", examples:[{source:"Text",text:"Macbeth's tyranny drives the Scottish nobles to seek help from England."},{source:"Essay",text:"Shakespeare contrasts Duncan's benevolent rule with Macbeth's tyranny."},{source:"Everyday",text:"The citizens protested against the government's tyranny."}], tags:["Macbeth","Character & Theme"], category:"analytical", list:"macbeth", difficulty:1, strength:2, status:"learning" },
  { id:23, word:"Equivocation", pronunciation:"ih-kwiv-oh-KAY-shun", definition:"The use of ambiguous language to conceal truth or avoid commitment.", synonyms:["ambiguity","evasion","prevarication"], textContext:"The witches' prophecies are masterpieces of equivocation — true and misleading at once.", examples:[{source:"Text",text:"None of woman born shall harm Macbeth — an equivocation that conceals the truth."},{source:"Essay",text:"Equivocation pervades the play, blurring the boundary between truth and deception."},{source:"Everyday",text:"The politician's equivocation frustrated journalists seeking clear answers."}], tags:["Macbeth","Literary Technique"], category:"analytical", list:"macbeth", difficulty:3, strength:0, status:"new" },
  { id:24, word:"Malevolence", pronunciation:"muh-LEV-uh-lence", definition:"The quality of wishing to do evil; deep-seated ill will.", synonyms:["malice","spite","hostility","wickedness"], textContext:"Lady Macbeth's malevolence drives her to orchestrate Duncan's murder.", examples:[{source:"Text",text:"Come, you spirits that tend on mortal thoughts, unsex me here."},{source:"Essay",text:"Shakespeare attributes malevolence not to supernatural forces alone but to human ambition."},{source:"Everyday",text:"The villain's malevolence was clear from the start."}], tags:["Macbeth","Character & Theme"], category:"analytical", list:"macbeth", difficulty:2, strength:0, status:"new" },
  { id:25, word:"Valour", pronunciation:"VAL-er", definition:"Great courage in the face of danger, especially in battle.", synonyms:["bravery","heroism","gallantry","fortitude"], textContext:"In Act 1, Macbeth is celebrated for his valour on the battlefield.", examples:[{source:"Text",text:"For brave Macbeth — well he deserves that name — carved out his passage."},{source:"Essay",text:"Shakespeare initially establishes Macbeth's valour to heighten the tragedy of his fall."},{source:"Everyday",text:"The firefighters showed extraordinary valour during the rescue."}], tags:["Macbeth","Character & Theme"], category:"analytical", list:"macbeth", difficulty:1, strength:3, status:"learning" },
  { id:26, word:"Treachery", pronunciation:"TRETCH-uh-ree", definition:"Betrayal of trust; treasonous action.", synonyms:["betrayal","duplicity","perfidy","treason"], textContext:"The play is structured around layers of treachery — from Cawdor's to Macbeth's own.", examples:[{source:"Text",text:"The original Thane of Cawdor is executed for treachery against the king."},{source:"Essay",text:"Treachery becomes cyclical — Macbeth inherits a traitor's title and becomes one himself."},{source:"Everyday",text:"The spy's treachery was only uncovered decades later."}], tags:["Macbeth","Character & Theme"], category:"analytical", list:"macbeth", difficulty:1, strength:0, status:"new" },
  { id:27, word:"Apparition", pronunciation:"ap-uh-RISH-un", definition:"A ghost or ghostlike image of a person; a supernatural appearance.", synonyms:["ghost","phantom","spectre","vision"], textContext:"The apparitions summoned by the witches deliver cryptic prophecies to Macbeth.", examples:[{source:"Text",text:"The apparitions — an armed head, a bloody child, a crowned child — speak in riddles."},{source:"Essay",text:"Shakespeare uses apparitions to externalise Macbeth's deteriorating mental state."},{source:"Everyday",text:"She thought she saw an apparition in the old hallway."}], tags:["Macbeth","Text-Specific"], category:"text-specific", list:"macbeth", difficulty:2, strength:0, status:"new" },
  { id:28, word:"Duplicity", pronunciation:"dyoo-PLIS-ih-tee", definition:"Deceitfulness; double-dealing.", synonyms:["deceit","deception","dishonesty","two-facedness"], textContext:"Lady Macbeth counsels duplicity: 'look like the innocent flower, but be the serpent under it.'", examples:[{source:"Text",text:"Fair is foul and foul is fair — the play opens with a declaration of duplicity."},{source:"Essay",text:"Duplicity is woven into the fabric of the play, from the witches to the Macbeths."},{source:"Everyday",text:"His duplicity was exposed when the emails became public."}], tags:["Macbeth","Character & Theme"], category:"analytical", list:"macbeth", difficulty:2, strength:0, status:"new" },

  // === WAR POETRY ===
  { id:40, word:"Melancholic", pronunciation:"mel-un-KOL-ik", definition:"Feeling or expressing a deep, reflective sadness.", synonyms:["wistful","sorrowful","pensive","plaintive"], textContext:"The melancholic tone of war poetry reflects soldiers' grief for lost innocence.", examples:[{source:"Text",text:"Owen's verse carries an unmistakably melancholic undercurrent."},{source:"Essay",text:"The poet's melancholic imagery conveys the futility of conflict."},{source:"Everyday",text:"Rainy Sunday afternoons always put her in a melancholic mood."}], tags:["Tone & Mood","War Poetry"], category:"analytical", list:"war", difficulty:1, strength:2, status:"learning" },
  { id:41, word:"Cacophony", pronunciation:"kuh-KOF-uh-nee", definition:"A harsh, discordant mixture of sounds.", synonyms:["dissonance","din","racket","clamour"], textContext:"War poets use cacophony — harsh consonants and broken rhythm — to evoke the chaos of battle.", examples:[{source:"Text",text:"Owen's plosive sounds create a verbal cacophony mirroring shellfire."},{source:"Essay",text:"The cacophony of the verse forces the reader to experience the sensory assault of warfare."},{source:"Everyday",text:"The cacophony of car horns and jackhammers made the city feel overwhelming."}], tags:["War Poetry","Sensory — Sound"], category:"creative", list:"war", difficulty:2, strength:0, status:"new" },
  { id:42, word:"Futility", pronunciation:"fyoo-TIL-ih-tee", definition:"Pointlessness; the quality of having no useful result.", synonyms:["uselessness","hopelessness","fruitlessness"], textContext:"Owen's poem 'Futility' questions the purpose of life created only to be destroyed by war.", examples:[{source:"Text",text:"Was it for this the clay grew tall? — Owen asks if creation itself was futile."},{source:"Essay",text:"The poet underscores the futility of war through nature imagery."},{source:"Everyday",text:"She felt the futility of arguing with someone who wouldn't listen."}], tags:["War Poetry","Character & Theme"], category:"analytical", list:"war", difficulty:1, strength:0, status:"new" },
  { id:43, word:"Poignant", pronunciation:"POYN-yunt", definition:"Evoking a keen sense of sadness or regret.", synonyms:["moving","touching","affecting","heartfelt"], textContext:"The most poignant war poems capture private moments of grief amidst vast destruction.", examples:[{source:"Text",text:"Sassoon's poetry is poignant in its restraint — saying much with very few words."},{source:"Essay",text:"The juxtaposition of past innocence with present horror creates a poignant effect."},{source:"Everyday",text:"The grandmother's letter was deeply poignant."}], tags:["War Poetry","Tone & Mood"], category:"analytical", list:"war", difficulty:1, strength:1, status:"learning" },
  { id:44, word:"Harrowing", pronunciation:"HAIR-oh-wing", definition:"Extremely distressing; deeply traumatic.", synonyms:["traumatic","distressing","agonising","devastating"], textContext:"Owen's descriptions of gas attacks are among the most harrowing passages in English poetry.", examples:[{source:"Text",text:"The harrowing image of a soldier drowning in gas haunts the reader long after."},{source:"Essay",text:"Owen's harrowing imagery directly challenges glorified accounts of war."},{source:"Everyday",text:"Survivors shared harrowing accounts of the earthquake."}], tags:["War Poetry","Tone & Mood"], category:"analytical", list:"war", difficulty:1, strength:0, status:"new" },
  { id:45, word:"Elegiac", pronunciation:"el-uh-JY-ik", definition:"Relating to or characteristic of an elegy; mournful and reflective.", synonyms:["mournful","lamenting","plaintive","funereal"], textContext:"The elegiac tone of many war poems serves as a memorial to the fallen.", examples:[{source:"Text",text:"Sassoon's elegiac verse mourns not just the dead but the world they left behind."},{source:"Essay",text:"The poem adopts an elegiac register to honour sacrifice without glorifying war."},{source:"Everyday",text:"The film had an elegiac quality, mourning a vanished way of life."}], tags:["War Poetry","Tone & Mood"], category:"analytical", list:"war", difficulty:3, strength:0, status:"new" },
  { id:46, word:"Carnage", pronunciation:"KAR-nij", definition:"The killing of a large number of people; a massacre.", synonyms:["slaughter","bloodshed","massacre","butchery"], textContext:"War poets bear witness to the carnage of the trenches with unflinching honesty.", examples:[{source:"Text",text:"The carnage of the Somme is rendered in visceral, sensory detail."},{source:"Essay",text:"By documenting carnage, the poets challenge sanitised propaganda."},{source:"Everyday",text:"The storm left a scene of carnage across the countryside."}], tags:["War Poetry","Text-Specific"], category:"text-specific", list:"war", difficulty:1, strength:0, status:"new" },
  { id:47, word:"Propaganda", pronunciation:"prop-uh-GAN-duh", definition:"Information used to promote a political cause or point of view, often misleading.", synonyms:["misinformation","publicity","indoctrination"], textContext:"War poets wrote directly against the propaganda that glorified combat.", examples:[{source:"Text",text:"Owen's poetry dismantles the propaganda of 'Dulce et decorum est pro patria mori'."},{source:"Essay",text:"The poet exposes how propaganda manufactured consent for mass slaughter."},{source:"Everyday",text:"Social media has become a powerful tool for spreading propaganda."}], tags:["War Poetry","Character & Theme"], category:"analytical", list:"war", difficulty:1, strength:0, status:"new" },
  { id:48, word:"Comradeship", pronunciation:"KOM-rayd-ship", definition:"The friendship and mutual trust between companions who share an experience.", synonyms:["camaraderie","fellowship","solidarity","brotherhood"], textContext:"Amidst the horror, war poetry celebrates the comradeship forged in the trenches.", examples:[{source:"Text",text:"Sassoon's poems reveal comradeship as the one redeeming element of trench life."},{source:"Essay",text:"The poet conveys comradeship as both a source of strength and a deepened cause for grief."},{source:"Everyday",text:"The team's comradeship carried them through the toughest challenges."}], tags:["War Poetry","Character & Theme"], category:"analytical", list:"war", difficulty:1, strength:0, status:"new" },

  // === MODERNIST POETRY ===
  { id:60, word:"Fragmentation", pronunciation:"frag-men-TAY-shun", definition:"The process of breaking into small or separate parts.", synonyms:["disintegration","splintering","dissolution"], textContext:"Modernist poets use fragmentation to mirror the fractured experience of modern life.", examples:[{source:"Text",text:"Eliot's The Waste Land is built on fragmentation — voices, languages, and allusions collide."},{source:"Essay",text:"The poem's fragmentation reflects post-war disillusionment with coherent meaning."},{source:"Everyday",text:"The fragmentation of media has changed how we consume news."}], tags:["Modernist Poetry","Literary Technique"], category:"analytical", list:"modernist", difficulty:1, strength:0, status:"new" },
  { id:61, word:"Alienation", pronunciation:"ay-lee-uh-NAY-shun", definition:"The state of being isolated or estranged from a group or activity.", synonyms:["isolation","estrangement","detachment","disconnection"], textContext:"Modernist poetry frequently explores the alienation of the individual in industrial society.", examples:[{source:"Text",text:"Prufrock's alienation is captured in his inability to connect with others."},{source:"Essay",text:"The poet uses urban imagery to evoke a profound sense of alienation."},{source:"Everyday",text:"Moving to a new city brought feelings of alienation."}], tags:["Modernist Poetry","Character & Theme"], category:"analytical", list:"modernist", difficulty:1, strength:2, status:"learning" },
  { id:62, word:"Dissonance", pronunciation:"DIS-uh-nunce", definition:"Lack of harmony; a jarring combination of sounds or ideas.", synonyms:["discord","clash","cacophony","incongruity"], textContext:"Modernist poets deliberately create dissonance to unsettle the reader.", examples:[{source:"Text",text:"The dissonance between high culture and street slang in Eliot is deliberate."},{source:"Essay",text:"Through dissonance, the poet disrupts the reader's expectations of poetic beauty."},{source:"Everyday",text:"There was dissonance between her cheerful words and tearful eyes."}], tags:["Modernist Poetry","Literary Technique"], category:"creative", list:"modernist", difficulty:2, strength:0, status:"new" },
  { id:63, word:"Existential", pronunciation:"eg-zis-TEN-shul", definition:"Relating to existence and the human condition; concerned with purpose and meaning.", synonyms:["philosophical","metaphysical","fundamental"], textContext:"Modernist poetry grapples with existential questions about identity, meaning, and faith.", examples:[{source:"Text",text:"Prufrock's existential crisis is summed up: Do I dare disturb the universe?"},{source:"Essay",text:"The poem raises existential questions about whether individual action matters."},{source:"Everyday",text:"Turning 30 triggered an existential crisis about her career path."}], tags:["Modernist Poetry","Character & Theme"], category:"analytical", list:"modernist", difficulty:2, strength:0, status:"new" },
  { id:64, word:"Introspection", pronunciation:"in-truh-SPEK-shun", definition:"The examination of one's own thoughts and feelings.", synonyms:["self-reflection","contemplation","self-analysis"], textContext:"Modernist poetry is characterised by deep introspection and interior monologue.", examples:[{source:"Text",text:"Prufrock's introspection reveals paralysing self-doubt beneath a social mask."},{source:"Essay",text:"The poet's introspection shifts the focus from external events to inner experience."},{source:"Everyday",text:"Journaling encouraged her introspection and self-awareness."}], tags:["Modernist Poetry","Character & Theme"], category:"analytical", list:"modernist", difficulty:1, strength:1, status:"learning" },
  { id:65, word:"Nihilism", pronunciation:"NY-uh-liz-um", definition:"The belief that life is meaningless and that traditional values are unfounded.", synonyms:["pessimism","scepticism","negativism"], textContext:"Some modernist poets flirt with nihilism before finding alternative sources of meaning.", examples:[{source:"Text",text:"The Waste Land can be read as a response to post-war nihilism."},{source:"Essay",text:"While the poem borders on nihilism, it ultimately gestures toward renewal."},{source:"Everyday",text:"His teenage nihilism gave way to a more nuanced worldview."}], tags:["Modernist Poetry","Character & Theme"], category:"analytical", list:"modernist", difficulty:3, strength:0, status:"new" },
  { id:66, word:"Avant-garde", pronunciation:"AV-ont-GARD", definition:"New and experimental ideas and methods in art, music, or literature.", synonyms:["experimental","innovative","cutting-edge","radical"], textContext:"Modernist poetry was the avant-garde of its era, breaking every convention of traditional verse.", examples:[{source:"Text",text:"The avant-garde techniques of imagist poetry stripped language to its essence."},{source:"Essay",text:"The poet's avant-garde approach reflects a refusal to use inherited literary forms."},{source:"Everyday",text:"The gallery showcased avant-garde installations that challenged visitors' perceptions."}], tags:["Modernist Poetry","Literary Technique"], category:"analytical", list:"modernist", difficulty:2, strength:0, status:"new" },

  // === ANALYSIS VERBS ===
  { id:80, word:"Conveys", pronunciation:"kun-VAYZ", definition:"Communicates or expresses a meaning, idea, or feeling.", synonyms:["communicates","expresses","transmits","imparts"], textContext:"A strong analysis verb for describing what a text does.", examples:[{source:"Essay",text:"The metaphor conveys the speaker's growing desperation."},{source:"Essay",text:"Fitzgerald conveys moral decay through the Valley of Ashes."},{source:"Everyday",text:"Her tone conveyed disapproval without a word being said."}], tags:["Analysis Verbs"], category:"analytical", list:"analysis", difficulty:1, strength:3, status:"learning" },
  { id:81, word:"Juxtaposes", pronunciation:"juk-stuh-POH-zez", definition:"Places two things side by side to highlight their contrasts.", synonyms:["contrasts","compares","opposes"], textContext:"An essential analysis verb for discussing how writers create meaning through contrast.", examples:[{source:"Essay",text:"Shakespeare juxtaposes Lady Macbeth's ambition with her eventual madness."},{source:"Essay",text:"The poet juxtaposes images of nature with the machinery of war."},{source:"Everyday",text:"The gallery juxtaposes classical sculpture with modern digital art."}], tags:["Analysis Verbs","Literary Technique"], category:"analytical", list:"analysis", difficulty:2, strength:3, status:"learning" },
  { id:82, word:"Underscores", pronunciation:"un-der-SKORZ", definition:"Emphasises or draws attention to something.", synonyms:["emphasises","highlights","accentuates","reinforces"], textContext:"Use instead of 'shows' for more sophisticated essay writing.", examples:[{source:"Essay",text:"The recurring motif of blood underscores the theme of guilt in Macbeth."},{source:"Essay",text:"Owen underscores the horror of war through visceral sensory detail."},{source:"Everyday",text:"The report underscores the urgency of climate action."}], tags:["Analysis Verbs"], category:"analytical", list:"analysis", difficulty:1, strength:0, status:"new" },
  { id:83, word:"Subverts", pronunciation:"sub-VERTS", definition:"Undermines or overturns an established system, expectation, or convention.", synonyms:["undermines","overturns","challenges","disrupts"], textContext:"Strong verb for discussing how writers challenge expectations or conventions.", examples:[{source:"Essay",text:"Shakespeare subverts gender expectations through Lady Macbeth's dominance."},{source:"Essay",text:"The poem subverts the sonnet form to mirror fractured modern experience."},{source:"Everyday",text:"The film subverts the typical hero narrative."}], tags:["Analysis Verbs"], category:"analytical", list:"analysis", difficulty:2, strength:0, status:"new" },
  { id:84, word:"Elucidates", pronunciation:"ih-LOO-sih-dayts", definition:"Makes something clear; explains or clarifies.", synonyms:["clarifies","illuminates","explains","expounds"], textContext:"A scholar-level analysis verb — use sparingly but effectively.", examples:[{source:"Essay",text:"The soliloquy elucidates Macbeth's internal conflict."},{source:"Essay",text:"Close reading elucidates the layers of meaning in the imagery."},{source:"Everyday",text:"The professor's example elucidated the complex theory perfectly."}], tags:["Analysis Verbs"], category:"analytical", list:"analysis", difficulty:3, strength:0, status:"new" },
  { id:85, word:"Encapsulates", pronunciation:"en-KAP-syoo-layts", definition:"Expresses the essential features of something succinctly.", synonyms:["summarises","captures","embodies","epitomises"], textContext:"Great for thesis statements: 'This scene encapsulates the central tension of the play.'", examples:[{source:"Essay",text:"The green light encapsulates Gatsby's unrelenting aspiration."},{source:"Essay",text:"This single image encapsulates the poem's critique of modern life."},{source:"Everyday",text:"One photo encapsulated the spirit of the entire festival."}], tags:["Analysis Verbs"], category:"analytical", list:"analysis", difficulty:2, strength:0, status:"new" },
  { id:86, word:"Foreshadows", pronunciation:"for-SHAD-ohz", definition:"Serves as a warning or indication of a future event.", synonyms:["prefigures","portends","hints at","presages"], textContext:"Essential for discussing how writers build suspense and dramatic irony.", examples:[{source:"Essay",text:"The bleeding hands of the captain foreshadow Macbeth's own bloodguilt."},{source:"Essay",text:"The weather imagery foreshadows the storm of violence to come."},{source:"Everyday",text:"The first chapter foreshadows the betrayal that drives the plot."}], tags:["Analysis Verbs"], category:"analytical", list:"analysis", difficulty:1, strength:0, status:"new" },
  { id:87, word:"Epitomises", pronunciation:"ih-PIT-uh-myz-ez", definition:"Is a perfect example of a quality or type.", synonyms:["embodies","typifies","exemplifies","represents"], textContext:"Powerful analysis verb for discussing characters who represent broader themes.", examples:[{source:"Essay",text:"Gatsby epitomises the self-made man whose dream exceeds his grasp."},{source:"Essay",text:"Lady Macbeth epitomises the destructive power of unchecked ambition."},{source:"Everyday",text:"The building epitomises the brutalist architecture of the 1960s."}], tags:["Analysis Verbs"], category:"analytical", list:"analysis", difficulty:2, strength:0, status:"new" },

  // === TONE & MOOD ===
  { id:100, word:"Ominous", pronunciation:"OM-ih-nus", definition:"Giving the impression that something bad is about to happen.", synonyms:["threatening","menacing","foreboding","sinister"], textContext:"Shakespeare creates an ominous atmosphere through weather, darkness, and prophecy.", examples:[{source:"Text",text:"The ominous knocking at the gate follows immediately after Duncan's murder."},{source:"Essay",text:"The ominous tone foreshadows the violence that will engulf the kingdom."},{source:"Everyday",text:"Dark clouds gathered in an ominous sky."}], tags:["Tone & Mood"], category:"analytical", list:"tone", difficulty:1, strength:2, status:"learning" },
  { id:101, word:"Sardonic", pronunciation:"sar-DON-ik", definition:"Grimly mocking or cynical.", synonyms:["cynical","mocking","scornful","derisive"], textContext:"Nick Carraway's narration often adopts a sardonic tone toward the wealthy.", examples:[{source:"Essay",text:"The narrator's sardonic observations reveal his growing disillusionment."},{source:"Essay",text:"The sardonic wit of Sassoon's poetry masks deep anguish."},{source:"Everyday",text:"She gave a sardonic smile when asked if she enjoyed the meeting."}], tags:["Tone & Mood"], category:"analytical", list:"tone", difficulty:2, strength:0, status:"new" },
  { id:102, word:"Wistful", pronunciation:"WIST-ful", definition:"Having a feeling of vague or regretful longing.", synonyms:["yearning","longing","nostalgic","pensive"], textContext:"Gatsby gazes at the green light with a wistful intensity.", examples:[{source:"Essay",text:"The wistful tone reflects the speaker's nostalgia for a lost past."},{source:"Text",text:"He stretched out his arms toward the dark water in a curious way — wistful and trembling."},{source:"Everyday",text:"She had a wistful look as she flipped through old photos."}], tags:["Tone & Mood"], category:"analytical", list:"tone", difficulty:1, strength:0, status:"new" },
  { id:103, word:"Foreboding", pronunciation:"for-BOH-ding", definition:"A feeling that something bad will happen; ominous.", synonyms:["apprehension","dread","premonition","unease"], textContext:"Act 2 of Macbeth is saturated with foreboding before Duncan's murder.", examples:[{source:"Essay",text:"The sense of foreboding intensifies as the protagonist approaches the house."},{source:"Text",text:"An owl shrieked — nature itself registers foreboding."},{source:"Everyday",text:"He felt a sense of foreboding as the interview began."}], tags:["Tone & Mood"], category:"analytical", list:"tone", difficulty:1, strength:0, status:"new" },
  { id:104, word:"Pensive", pronunciation:"PEN-siv", definition:"Engaged in deep or serious thought.", synonyms:["thoughtful","reflective","contemplative","meditative"], textContext:"Modernist speakers are often pensive, caught between action and paralysis.", examples:[{source:"Essay",text:"The pensive tone of the poem invites the reader into the speaker's inner world."},{source:"Text",text:"Prufrock is perpetually pensive — thinking rather than acting."},{source:"Everyday",text:"She sat by the window in a pensive mood."}], tags:["Tone & Mood"], category:"analytical", list:"tone", difficulty:1, strength:1, status:"learning" },
  { id:105, word:"Ebullient", pronunciation:"ih-BULL-ee-unt", definition:"Cheerful and full of energy; enthusiastically excited.", synonyms:["exuberant","buoyant","effervescent","vivacious"], textContext:"Gatsby's parties have an ebullient surface energy that masks deeper emptiness.", examples:[{source:"Essay",text:"The ebullient atmosphere of the party contrasts sharply with the sombre ending."},{source:"Text",text:"The orchestra played on, and the crowd remained ebullient until dawn."},{source:"Everyday",text:"Her ebullient personality lit up every room she entered."}], tags:["Tone & Mood"], category:"analytical", list:"tone", difficulty:2, strength:0, status:"new" },

  // === SENSORY LANGUAGE ===
  { id:120, word:"Luminous", pronunciation:"LOO-mih-nus", definition:"Full of or shedding light; bright or shining.", synonyms:["radiant","glowing","incandescent","brilliant"], textContext:"Fitzgerald describes Daisy's voice as luminous — a word that captures both beauty and illusion.", examples:[{source:"Text",text:"Her face was sad and lovely with bright things in it, bright eyes and a bright passionate mouth — luminous."},{source:"Essay",text:"The luminous imagery of the green light contrasts with the darkness of moral decay."},{source:"Everyday",text:"The luminous sunset painted the sky in shades of gold and rose."}], tags:["Sensory — Sight","Gatsby"], category:"creative", list:"sensory", difficulty:1, strength:0, status:"new" },
  { id:121, word:"Staccato", pronunciation:"stuh-KAH-toh", definition:"With each sound sharply detached from the others; abrupt.", synonyms:["sharp","clipped","jerky","abrupt"], textContext:"War poets use staccato rhythms to mirror the sharp, relentless sounds of gunfire.", examples:[{source:"Text",text:"The staccato burst of consonants mimics machine-gun fire."},{source:"Essay",text:"The poet's staccato phrasing conveys the fragmented experience of battle."},{source:"Everyday",text:"He spoke in staccato sentences, barely pausing for breath."}], tags:["Sensory — Sound","War Poetry"], category:"creative", list:"sensory", difficulty:2, strength:0, status:"new" },
  { id:122, word:"Pungent", pronunciation:"PUN-jent", definition:"Having a sharply strong taste or smell.", synonyms:["acrid","sharp","biting","caustic"], textContext:"Sensory vocabulary for smell — useful in creative writing and descriptive passages.", examples:[{source:"Essay",text:"The pungent odour of the trenches is rendered in visceral detail."},{source:"Creative",text:"A pungent mix of smoke and wet earth filled the air."},{source:"Everyday",text:"The pungent smell of garlic wafted from the kitchen."}], tags:["Sensory — Smell"], category:"creative", list:"sensory", difficulty:1, strength:0, status:"new" },
  { id:123, word:"Gossamer", pronunciation:"GOS-uh-mer", definition:"Something very light, thin, and delicate.", synonyms:["delicate","filmy","diaphanous","wispy"], textContext:"Beautiful creative writing word for describing things that are almost too fine to see.", examples:[{source:"Creative",text:"Gossamer threads of mist hung between the trees at dawn."},{source:"Essay",text:"The gossamer quality of the imagery suggests fragility and impermanence."},{source:"Everyday",text:"She wore a gossamer veil that floated in the breeze."}], tags:["Sensory — Sight","Sensory — Touch"], category:"creative", list:"sensory", difficulty:2, strength:0, status:"new" },
  { id:124, word:"Reverberating", pronunciation:"reh-VER-buh-ray-ting", definition:"Echoing repeatedly; continuing to resound.", synonyms:["echoing","resounding","resonating","booming"], textContext:"Strong sound word — effective in both war poetry analysis and creative writing.", examples:[{source:"Text",text:"The reverberating boom of artillery defined the soundscape of the trenches."},{source:"Essay",text:"The reverberating rhythm of the final stanza amplifies the poem's emotional weight."},{source:"Everyday",text:"His words kept reverberating in her mind long after the conversation."}], tags:["Sensory — Sound"], category:"creative", list:"sensory", difficulty:2, strength:0, status:"new" },
  { id:125, word:"Iridescent", pronunciation:"ir-ih-DESS-unt", definition:"Showing luminous colours that seem to change when seen from different angles.", synonyms:["shimmering","opalescent","lustrous","pearlescent"], textContext:"Gorgeous visual word — perfect for descriptions of water, light, or anything that shifts and gleams.", examples:[{source:"Creative",text:"The soap bubble floated upward, its surface a swirl of iridescent colour."},{source:"Essay",text:"The iridescent imagery suggests beauty that is fleeting and unstable."},{source:"Everyday",text:"The beetle's wings had an iridescent, jewel-like quality."}], tags:["Sensory — Sight"], category:"creative", list:"sensory", difficulty:2, strength:0, status:"new" },

  // === MOVEMENT & ACTION ===
  { id:140, word:"Lurched", pronunciation:"LERCHD", definition:"Made an abrupt, unsteady movement.", synonyms:["stumbled","staggered","swayed","reeled"], textContext:"Vivid movement verb — shows instability and loss of control.", examples:[{source:"Creative",text:"The ship lurched violently as the wave struck."},{source:"Essay",text:"The character lurched between hope and despair."},{source:"Everyday",text:"The bus lurched forward, sending passengers grabbing for handrails."}], tags:["Movement & Action"], category:"creative", list:"movement", difficulty:1, strength:0, status:"new" },
  { id:141, word:"Sauntered", pronunciation:"SAWN-terd", definition:"Walked in a slow, relaxed way.", synonyms:["strolled","ambled","wandered","meandered"], textContext:"Shows confidence, ease, or carelessness — great for character description.", examples:[{source:"Creative",text:"He sauntered into the room as if he owned it."},{source:"Essay",text:"Tom Buchanan saunters through the novel with careless privilege."},{source:"Everyday",text:"She sauntered down the street, in no hurry at all."}], tags:["Movement & Action","Gatsby"], category:"creative", list:"movement", difficulty:1, strength:0, status:"new" },
  { id:142, word:"Cascaded", pronunciation:"kas-KAY-did", definition:"Poured or fell rapidly in large quantities.", synonyms:["poured","tumbled","flowed","streamed"], textContext:"Evocative movement word for water, light, hair, or emotions.", examples:[{source:"Creative",text:"Sunlight cascaded through the stained-glass windows."},{source:"Essay",text:"Grief cascaded through the final stanza in a torrent of imagery."},{source:"Everyday",text:"Her hair cascaded over her shoulders in loose waves."}], tags:["Movement & Action"], category:"creative", list:"movement", difficulty:1, strength:0, status:"new" },
  { id:143, word:"Recoiled", pronunciation:"rih-KOYLD", definition:"Suddenly drew back in fear, horror, or disgust.", synonyms:["flinched","shrank","winced","withdrew"], textContext:"Shows instinctive physical reaction to something disturbing.", examples:[{source:"Text",text:"Macbeth recoils at the sight of Banquo's ghost."},{source:"Essay",text:"The reader recoils from the graphic imagery of the trenches."},{source:"Everyday",text:"She recoiled when the spider dropped from the ceiling."}], tags:["Movement & Action","Macbeth"], category:"creative", list:"movement", difficulty:1, strength:0, status:"new" },
  { id:144, word:"Faltered", pronunciation:"FAWL-terd", definition:"Lost strength or momentum; became unsteady.", synonyms:["hesitated","wavered","stumbled","weakened"], textContext:"Shows a moment of doubt or physical weakness — powerful in both analysis and creative writing.", examples:[{source:"Text",text:"Macbeth's resolve faltered in the face of Banquo's ghost."},{source:"Essay",text:"The rhythm falters in line 8, mirroring the speaker's uncertainty."},{source:"Everyday",text:"Her voice faltered as she tried to explain what happened."}], tags:["Movement & Action"], category:"creative", list:"movement", difficulty:1, strength:0, status:"new" },
  { id:145, word:"Surged", pronunciation:"SERJD", definition:"Moved suddenly and powerfully forward or upward.", synonyms:["rushed","swept","swelled","flooded"], textContext:"Dynamic movement word showing sudden, powerful force.", examples:[{source:"Creative",text:"Adrenaline surged through her as the starting gun fired."},{source:"Essay",text:"Emotion surges through the final stanza, breaking the poem's restraint."},{source:"Everyday",text:"The crowd surged forward when the gates opened."}], tags:["Movement & Action"], category:"creative", list:"movement", difficulty:1, strength:0, status:"new" },

  // === GATSBY (additional) ===
  { id:11, word:"Gaudy", pronunciation:"GAW-dee", definition:"Extravagantly bright or showy, typically so as to be tasteless.", synonyms:["garish","flashy","vulgar","tacky"], textContext:"Gatsby's parties are described in gaudy, excessive terms reflecting hollow wealth.", examples:[{source:"Text",text:"The gaudy display of shirts reduces Daisy to tears — beauty masking emptiness."},{source:"Essay",text:"Fitzgerald's gaudy imagery critiques the superficiality of the Jazz Age."},{source:"Everyday",text:"The gaudy neon sign clashed with the quiet suburban street."}], tags:["Gatsby","Text-Specific"], category:"text-specific", list:"gatsby", difficulty:1, strength:0, status:"new" },
  { id:12, word:"Grotesque", pronunciation:"groh-TESK", definition:"Comically or repulsively ugly or distorted.", synonyms:["hideous","monstrous","deformed","bizarre"], textContext:"The Valley of Ashes and the eyes of Doctor T.J. Eckleburg create a grotesque landscape.", examples:[{source:"Text",text:"The grotesque figure of Myrtle's death reveals the violence beneath wealth."},{source:"Essay",text:"Fitzgerald employs grotesque imagery to expose the moral ugliness of privilege."},{source:"Everyday",text:"The grotesque mask terrified the younger children."}], tags:["Gatsby","Character & Theme"], category:"text-specific", list:"gatsby", difficulty:2, strength:0, status:"new" },
  { id:13, word:"Nouveau riche", pronunciation:"noo-VOH REESH", definition:"People who have recently acquired wealth, typically perceived as lacking good taste.", synonyms:["new money","upstart","parvenu"], textContext:"Gatsby is the quintessential nouveau riche figure, contrasted with old-money Tom Buchanan.", examples:[{source:"Essay",text:"The novel explores the tension between nouveau riche ambition and inherited privilege."},{source:"Text",text:"Gatsby's mansion, his car, his shirts — every choice reveals his nouveau riche anxiety."},{source:"Everyday",text:"The neighbourhood's nouveau riche residents were known for extravagant parties."}], tags:["Gatsby","Character & Theme"], category:"text-specific", list:"gatsby", difficulty:2, strength:0, status:"new" },
  { id:14, word:"Carelessness", pronunciation:"KAIR-less-ness", definition:"The quality of not giving sufficient attention or thought to avoiding harm.", synonyms:["negligence","thoughtlessness","recklessness","indifference"], textContext:"Nick identifies carelessness as the defining trait of Tom and Daisy — they destroy without consequence.", examples:[{source:"Text",text:"They were careless people — they smashed up things and retreated into their money."},{source:"Essay",text:"Fitzgerald critiques the carelessness of the privileged class as a form of moral bankruptcy."},{source:"Everyday",text:"Her carelessness with other people's feelings eventually left her isolated."}], tags:["Gatsby","Character & Theme"], category:"analytical", list:"gatsby", difficulty:1, strength:0, status:"new" },
  { id:15, word:"Aspiration", pronunciation:"as-pih-RAY-shun", definition:"A hope or ambition of achieving something.", synonyms:["ambition","dream","goal","desire"], textContext:"Gatsby's aspiration — to recapture the past and win Daisy — drives the entire novel.", examples:[{source:"Essay",text:"The green light symbolises aspiration at its most beautiful and most doomed."},{source:"Text",text:"Gatsby's aspirations are inseparable from the mythology of the American Dream."},{source:"Everyday",text:"Her aspiration to become a surgeon motivated years of study."}], tags:["Gatsby","Character & Theme"], category:"analytical", list:"gatsby", difficulty:1, strength:0, status:"new" },
  { id:16, word:"Materialism", pronunciation:"muh-TEER-ee-ul-iz-um", definition:"A tendency to consider material possessions and physical comfort as more important than spiritual values.", synonyms:["consumerism","acquisitiveness","greed"], textContext:"Gatsby critiques the materialism of the 1920s American upper class.", examples:[{source:"Essay",text:"Fitzgerald exposes how materialism corrodes genuine human connection."},{source:"Text",text:"The materialism of the era is embodied in Gatsby's lavish, purposeless parties."},{source:"Everyday",text:"The documentary explored how materialism affects mental health."}], tags:["Gatsby","Character & Theme"], category:"analytical", list:"gatsby", difficulty:1, strength:0, status:"new" },
  { id:17, word:"Corruption", pronunciation:"kuh-RUP-shun", definition:"Dishonest or immoral behaviour, especially by powerful people; the process of decay.", synonyms:["depravity","dishonesty","degradation","decay"], textContext:"Moral corruption lurks beneath the glittering surface of the Jazz Age.", examples:[{source:"Essay",text:"The novel reveals corruption as the inevitable companion of unchecked wealth."},{source:"Text",text:"Gatsby's fortune, built on bootlegging, is itself a product of corruption."},{source:"Everyday",text:"The corruption scandal brought down the entire government."}], tags:["Gatsby","Character & Theme"], category:"analytical", list:"gatsby", difficulty:1, strength:0, status:"new" },
  { id:18, word:"Complacent", pronunciation:"kum-PLAY-sunt", definition:"Showing smug or uncritical satisfaction with oneself or one's achievements.", synonyms:["self-satisfied","smug","contented","untroubled"], textContext:"The old-money characters are complacent in their privilege, indifferent to harm.", examples:[{source:"Essay",text:"Tom's complacent racism reveals the ugliest dimension of inherited wealth."},{source:"Text",text:"Daisy's complacent charm disguises a fundamental inability to care."},{source:"Everyday",text:"Success made him complacent, and his grades began to slip."}], tags:["Gatsby","Character & Theme"], category:"analytical", list:"gatsby", difficulty:2, strength:0, status:"new" },

  // === MACBETH (additional) ===
  { id:29, word:"Sovereignty", pronunciation:"SOV-rin-tee", definition:"Supreme power or authority; the authority of a state to govern itself.", synonyms:["supremacy","dominion","authority","kingship"], textContext:"Macbeth's seizure of sovereignty through murder violates the divine right of kings.", examples:[{source:"Essay",text:"Shakespeare presents sovereignty as a sacred trust, not a prize to be seized."},{source:"Text",text:"The question of legitimate sovereignty drives the political conflict of the play."},{source:"Everyday",text:"The nation fought to reclaim its sovereignty."}], tags:["Macbeth","Character & Theme"], category:"analytical", list:"macbeth", difficulty:2, strength:0, status:"new" },
  { id:30, word:"Harbinger", pronunciation:"HAR-bin-jer", definition:"A person or thing that announces or signals the approach of something.", synonyms:["forerunner","herald","precursor","omen"], textContext:"The witches serve as harbingers of the chaos and bloodshed to come.", examples:[{source:"Essay",text:"The unnatural events — the owl killing a falcon — are harbingers of moral disorder."},{source:"Text",text:"The bleeding captain is a harbinger of the violence that will engulf Scotland."},{source:"Everyday",text:"The first crocuses are harbingers of spring."}], tags:["Macbeth","Character & Theme"], category:"analytical", list:"macbeth", difficulty:2, strength:0, status:"new" },
  { id:31, word:"Sacrilegious", pronunciation:"sak-rih-LEE-jus", definition:"Violating or showing disrespect for something sacred.", synonyms:["blasphemous","profane","irreverent","impious"], textContext:"Macbeth's act of regicide is sacrilegious — a crime against God's anointed king.", examples:[{source:"Essay",text:"Shakespeare frames the murder as sacrilegious, disrupting the divine order."},{source:"Text",text:"The sacrilegious nature of Duncan's murder unleashes supernatural chaos."},{source:"Everyday",text:"Some considered the renovation of the historic church sacrilegious."}], tags:["Macbeth","Text-Specific"], category:"text-specific", list:"macbeth", difficulty:3, strength:0, status:"new" },
  { id:32, word:"Avarice", pronunciation:"AV-uh-ris", definition:"Extreme greed for wealth or material gain.", synonyms:["greed","cupidity","covetousness","rapacity"], textContext:"Lady Macbeth's avarice for power drives her manipulation of her husband.", examples:[{source:"Essay",text:"The play explores how avarice corrupts even the noblest of characters."},{source:"Text",text:"Macbeth's avarice grows from ambition to paranoid tyranny."},{source:"Everyday",text:"Corporate avarice was blamed for the financial crisis."}], tags:["Macbeth","Character & Theme"], category:"analytical", list:"macbeth", difficulty:2, strength:0, status:"new" },
  { id:33, word:"Prophetic", pronunciation:"pruh-FET-ik", definition:"Accurately describing or predicting what will happen in the future.", synonyms:["predictive","prescient","foretelling","visionary"], textContext:"The witches' prophetic words set the entire tragedy in motion.", examples:[{source:"Essay",text:"Shakespeare questions whether the prophetic utterances cause or merely foresee events."},{source:"Text",text:"The prophetic nature of the witches' words blurs the line between fate and free will."},{source:"Everyday",text:"Her warning about the project proved prophetic."}], tags:["Macbeth","Text-Specific"], category:"analytical", list:"macbeth", difficulty:1, strength:0, status:"new" },

  // === WAR POETRY (additional) ===
  { id:49, word:"Sacrifice", pronunciation:"SAK-rih-fys", definition:"An act of giving up something valued for the sake of something else.", synonyms:["offering","surrender","forfeit","immolation"], textContext:"War poetry grapples with the immense sacrifice demanded of ordinary soldiers.", examples:[{source:"Essay",text:"The poet honours the sacrifice of soldiers while questioning the cause."},{source:"Text",text:"The sacrifice is rendered more tragic by the soldiers' youth and innocence."},{source:"Everyday",text:"Her parents made enormous sacrifices to pay for her education."}], tags:["War Poetry","Character & Theme"], category:"analytical", list:"war", difficulty:1, strength:0, status:"new" },
  { id:50, word:"Lamentation", pronunciation:"lam-en-TAY-shun", definition:"The passionate expression of grief or sorrow.", synonyms:["wailing","mourning","keening","grief"], textContext:"War poetry is often a form of lamentation — a cry of grief for the dead.", examples:[{source:"Essay",text:"The poem functions as a lamentation, giving voice to unspeakable loss."},{source:"Text",text:"Owen's lamentation is directed not at the enemy but at the system that sent men to die."},{source:"Everyday",text:"Her lamentation could be heard throughout the house."}], tags:["War Poetry","Tone & Mood"], category:"analytical", list:"war", difficulty:2, strength:0, status:"new" },
  { id:51, word:"Decimation", pronunciation:"des-ih-MAY-shun", definition:"The killing or destruction of a large proportion of a group.", synonyms:["annihilation","destruction","devastation","massacre"], textContext:"The decimation of an entire generation is the central tragedy of the war poets.", examples:[{source:"Essay",text:"The poet confronts the decimation of youth with raw, unflinching honesty."},{source:"Text",text:"The decimation of his battalion haunts the speaker's every word."},{source:"Everyday",text:"The fire caused the decimation of the forest ecosystem."}], tags:["War Poetry","Text-Specific"], category:"text-specific", list:"war", difficulty:2, strength:0, status:"new" },
  { id:52, word:"Desolation", pronunciation:"des-uh-LAY-shun", definition:"A state of complete emptiness or destruction; great unhappiness or loneliness.", synonyms:["devastation","ruin","bleakness","despair"], textContext:"The desolation of no-man's-land mirrors the emotional desolation of the soldiers.", examples:[{source:"Essay",text:"The poet conveys desolation through the barren, lifeless landscape imagery."},{source:"Text",text:"A landscape of desolation stretches in every direction — mud, wire, and silence."},{source:"Everyday",text:"The town's desolation after the factory closed was heartbreaking."}], tags:["War Poetry","Emotion & Atmosphere"], category:"analytical", list:"war", difficulty:1, strength:0, status:"new" },
  { id:53, word:"Indictment", pronunciation:"in-DYT-ment", definition:"A formal charge or accusation of a serious crime; a thing that serves to illustrate that something is bad.", synonyms:["accusation","charge","condemnation","denunciation"], textContext:"Many war poems serve as an indictment of those who glorify combat from safety.", examples:[{source:"Essay",text:"The poem is a devastating indictment of the political leaders who sent men to die."},{source:"Text",text:"Owen's verse functions as an indictment of the civilian propaganda machine."},{source:"Everyday",text:"The documentary was a powerful indictment of the justice system."}], tags:["War Poetry","Character & Theme"], category:"analytical", list:"war", difficulty:2, strength:0, status:"new" },

  // === MODERNIST POETRY (additional) ===
  { id:67, word:"Stream-of-consciousness", pronunciation:"STREEM-ov-KON-shus-ness", definition:"A literary technique that presents thoughts and feelings as they occur in the mind.", synonyms:["interior monologue","free association","thought-flow"], textContext:"Modernist poets pioneered stream-of-consciousness to capture the fragmented inner life.", examples:[{source:"Essay",text:"The stream-of-consciousness technique mirrors the chaos of modern experience."},{source:"Text",text:"Eliot's juxtaposition of voices creates a stream-of-consciousness effect."},{source:"Everyday",text:"Her diary entries read like a stream-of-consciousness — raw and unfiltered."}], tags:["Modernist Poetry","Literary Technique"], category:"analytical", list:"modernist", difficulty:2, strength:0, status:"new" },
  { id:68, word:"Ephemerality", pronunciation:"eh-fem-er-AL-ih-tee", definition:"The quality of lasting for a very short time; transience.", synonyms:["transience","impermanence","fleetingness","brevity"], textContext:"Modernist poetry often meditates on the ephemerality of modern life and human experience.", examples:[{source:"Essay",text:"The imagery of flowers and seasons underscores the theme of ephemerality."},{source:"Text",text:"The poem captures the ephemerality of a single afternoon in stunning detail."},{source:"Everyday",text:"Social media stories embrace ephemerality — here today, gone tomorrow."}], tags:["Modernist Poetry","Character & Theme"], category:"analytical", list:"modernist", difficulty:3, strength:0, status:"new" },
  { id:69, word:"Subjective", pronunciation:"sub-JEK-tiv", definition:"Based on or influenced by personal feelings, tastes, or opinions rather than facts.", synonyms:["personal","individual","biased","interpretive"], textContext:"Modernist poetry is deeply subjective — reality filtered through individual consciousness.", examples:[{source:"Essay",text:"The poem's subjective perspective reflects the modernist rejection of objective truth."},{source:"Text",text:"Prufrock's subjective world is one of paralysis and self-doubt."},{source:"Everyday",text:"Film reviews are inherently subjective — one critic's masterpiece is another's bore."}], tags:["Modernist Poetry","Literary Technique"], category:"analytical", list:"modernist", difficulty:1, strength:0, status:"new" },

  // === EVALUATION & ARGUMENT LANGUAGE ===
  { id:200, word:"Compelling", pronunciation:"kum-PEL-ing", definition:"Evoking interest, attention, or admiration in a powerfully irresistible way.", synonyms:["convincing","persuasive","riveting","forceful"], textContext:"Use to describe a strong argument or vivid writing in your essays.", examples:[{source:"Essay",text:"Fitzgerald presents a compelling critique of the American Dream."},{source:"Essay",text:"The poet's use of imagery creates a compelling emotional landscape."},{source:"Everyday",text:"The documentary made a compelling case for reform."}], tags:["Evaluation & Argument"], category:"analytical", list:"analysis", difficulty:1, strength:0, status:"new" },
  { id:201, word:"Nuanced", pronunciation:"NYOO-ahnst", definition:"Characterised by subtle shades of meaning or expression.", synonyms:["subtle","refined","complex","sophisticated"], textContext:"Band 6 essays demonstrate nuanced understanding rather than black-and-white thinking.", examples:[{source:"Essay",text:"Shakespeare's nuanced portrayal of Macbeth resists simple moral judgement."},{source:"Essay",text:"The poem offers a nuanced exploration of grief — not just sadness, but anger and guilt too."},{source:"Everyday",text:"The debate required a more nuanced approach than simple yes or no."}], tags:["Evaluation & Argument"], category:"analytical", list:"analysis", difficulty:1, strength:0, status:"new" },
  { id:202, word:"Profound", pronunciation:"pruh-FOWND", definition:"Very great or intense; showing great knowledge or insight.", synonyms:["deep","significant","far-reaching","penetrating"], textContext:"Powerful evaluation word for describing the impact of a text or technique.", examples:[{source:"Essay",text:"The green light carries profound symbolic weight throughout the novel."},{source:"Essay",text:"Owen's poetry had a profound effect on public attitudes toward war."},{source:"Everyday",text:"The experience had a profound impact on her worldview."}], tags:["Evaluation & Argument"], category:"analytical", list:"analysis", difficulty:1, strength:0, status:"new" },
  { id:203, word:"Paradoxically", pronunciation:"pair-uh-DOK-sih-kul-ee", definition:"In a way that seems contradictory but may nonetheless be true.", synonyms:["contradictorily","ironically","incongruously"], textContext:"Excellent adverb for discussing contradictions and complexity in texts.", examples:[{source:"Essay",text:"Gatsby is paradoxically both the embodiment and the victim of the American Dream."},{source:"Essay",text:"Macbeth paradoxically becomes weaker as his political power grows."},{source:"Everyday",text:"Paradoxically, the more choices she had, the less satisfied she felt."}], tags:["Evaluation & Argument"], category:"analytical", list:"analysis", difficulty:2, strength:0, status:"new" },
  { id:204, word:"Ostensibly", pronunciation:"os-TEN-sih-blee", definition:"As appears or is stated to be true, though not necessarily so.", synonyms:["apparently","seemingly","supposedly","on the surface"], textContext:"Great for discussing the gap between surface meaning and deeper truth.", examples:[{source:"Essay",text:"The poem is ostensibly about nature, but beneath the surface lies a meditation on grief."},{source:"Essay",text:"Gatsby's parties are ostensibly celebrations, but they are really acts of desperation."},{source:"Everyday",text:"The meeting was ostensibly about budgets, but really about power."}], tags:["Evaluation & Argument"], category:"analytical", list:"analysis", difficulty:2, strength:0, status:"new" },
  { id:205, word:"Inextricably", pronunciation:"in-EKS-trih-kuh-blee", definition:"In a way that is impossible to disentangle or separate.", synonyms:["inseparably","indissolubly","irreversibly"], textContext:"Use to discuss themes or ideas that are deeply intertwined.", examples:[{source:"Essay",text:"In Gatsby, wealth and morality are inextricably linked — one corrupts the other."},{source:"Essay",text:"The personal and the political are inextricably woven through the war poetry."},{source:"Everyday",text:"Technology and daily life have become inextricably intertwined."}], tags:["Evaluation & Argument"], category:"analytical", list:"analysis", difficulty:3, strength:0, status:"new" },
  { id:206, word:"Superficial", pronunciation:"soo-per-FISH-ul", definition:"Existing or occurring at or on the surface; not thorough or deep.", synonyms:["shallow","surface-level","cursory","skin-deep"], textContext:"Use to critique a reading that lacks depth, or to describe a character's facade.", examples:[{source:"Essay",text:"A superficial reading sees Gatsby as merely a love story."},{source:"Essay",text:"Tom's superficial charm masks deep cruelty and racism."},{source:"Everyday",text:"The analysis was superficial and missed the real issues."}], tags:["Evaluation & Argument"], category:"analytical", list:"analysis", difficulty:1, strength:0, status:"new" },
  { id:207, word:"Implicit", pronunciation:"im-PLIS-it", definition:"Suggested though not directly expressed; implied.", synonyms:["implied","unspoken","tacit","underlying"], textContext:"Distinguishing implicit from explicit meaning is a key analytical skill.", examples:[{source:"Essay",text:"The poem's implicit critique of authority is more powerful than any direct statement."},{source:"Essay",text:"There is an implicit comparison between Gatsby's dream and the American frontier."},{source:"Everyday",text:"There was an implicit agreement that nobody would mention it."}], tags:["Evaluation & Argument"], category:"analytical", list:"analysis", difficulty:1, strength:0, status:"new" },

  // === LITERARY TECHNIQUE TERMS ===
  { id:250, word:"Motif", pronunciation:"moh-TEEF", definition:"A recurring element, image, or idea in a literary work that has symbolic significance.", synonyms:["theme","pattern","symbol","leitmotif"], textContext:"Identifying motifs — blood in Macbeth, the green light in Gatsby — shows sophisticated analysis.", examples:[{source:"Essay",text:"The blood motif in Macbeth traces the escalating consequences of guilt."},{source:"Essay",text:"Water functions as a motif throughout the poetry collection."},{source:"Everyday",text:"The film uses mirrors as a motif for self-reflection."}], tags:["Literary Technique"], category:"analytical", list:"analysis", difficulty:1, strength:0, status:"new" },
  { id:251, word:"Allegory", pronunciation:"AL-eh-gor-ee", definition:"A story, poem, or picture that can be interpreted to reveal a hidden meaning, typically a moral or political one.", synonyms:["parable","fable","metaphor","symbol"], textContext:"Understanding allegory helps analyse how texts work on multiple levels simultaneously.", examples:[{source:"Essay",text:"Gatsby can be read as an allegory for the corruption of the American Dream."},{source:"Essay",text:"The journey motif functions as an allegory for the human condition."},{source:"Everyday",text:"Animal Farm is an allegory for the Russian Revolution."}], tags:["Literary Technique"], category:"analytical", list:"analysis", difficulty:2, strength:0, status:"new" },
  { id:252, word:"Pathetic fallacy", pronunciation:"pah-THET-ik FAL-uh-see", definition:"The attribution of human emotions to nature or weather, especially in literature.", synonyms:["nature mirroring emotion","environmental mood"], textContext:"Shakespeare uses pathetic fallacy extensively — storms mirror inner turmoil.", examples:[{source:"Essay",text:"The storm on the night of Duncan's murder is a powerful instance of pathetic fallacy."},{source:"Essay",text:"The poet employs pathetic fallacy to externalise the speaker's grief."},{source:"Everyday",text:"The sun breaking through clouds at the end is classic pathetic fallacy."}], tags:["Literary Technique","Macbeth"], category:"analytical", list:"analysis", difficulty:2, strength:0, status:"new" },
  { id:253, word:"Dramatic irony", pronunciation:"druh-MAT-ik EYE-run-ee", definition:"When the audience knows something that the characters do not.", synonyms:["situational awareness gap","audience knowledge"], textContext:"Dramatic irony creates tension throughout Macbeth — we know what the characters don't.", examples:[{source:"Essay",text:"Dramatic irony intensifies as Duncan praises Macbeth's castle moments before his murder."},{source:"Essay",text:"The audience's awareness of the prophecy creates sustained dramatic irony."},{source:"Everyday",text:"The dramatic irony of the scene had the entire audience on edge."}], tags:["Literary Technique","Macbeth"], category:"analytical", list:"analysis", difficulty:1, strength:0, status:"new" },
  { id:254, word:"Soliloquy", pronunciation:"suh-LIL-uh-kwee", definition:"An act of speaking one's thoughts aloud when alone, especially in a play.", synonyms:["monologue","aside","inner speech"], textContext:"Macbeth's soliloquies reveal his inner conflict and moral disintegration.", examples:[{source:"Essay",text:"Through soliloquy, Shakespeare grants the audience access to Macbeth's tortured psyche."},{source:"Text",text:"The 'tomorrow and tomorrow' soliloquy expresses Macbeth's nihilistic despair."},{source:"Everyday",text:"The actor delivered the soliloquy with raw, haunting emotion."}], tags:["Literary Technique","Macbeth"], category:"analytical", list:"analysis", difficulty:1, strength:0, status:"new" },
  { id:255, word:"Symbolism", pronunciation:"SIM-buh-liz-um", definition:"The use of symbols to represent ideas or qualities.", synonyms:["representation","allegory","metaphor","imagery"], textContext:"Symbolism is central to every set text — the green light, blood, the wasteland.", examples:[{source:"Essay",text:"The green light's symbolism evolves from hope to futility across the novel."},{source:"Essay",text:"Blood symbolism in Macbeth tracks the spread of guilt from private to public."},{source:"Everyday",text:"The dove is a universal symbol of peace."}], tags:["Literary Technique"], category:"analytical", list:"analysis", difficulty:1, strength:0, status:"new" },
  { id:256, word:"Juxtaposition", pronunciation:"juk-stuh-puh-ZIH-shun", definition:"The fact of placing two things side by side to create contrast or comparison.", synonyms:["contrast","comparison","opposition","counterpoint"], textContext:"One of the most versatile analytical tools — use it for any text.", examples:[{source:"Essay",text:"The juxtaposition of East Egg and West Egg highlights class divisions."},{source:"Essay",text:"The poet's juxtaposition of beauty and violence creates a disturbing effect."},{source:"Everyday",text:"The juxtaposition of old and new architecture gave the city its unique character."}], tags:["Literary Technique"], category:"analytical", list:"analysis", difficulty:1, strength:0, status:"new" },

  // === EMOTION & ATMOSPHERE ===
  { id:300, word:"Apprehension", pronunciation:"ap-ree-HEN-shun", definition:"Anxiety or fear that something bad will happen.", synonyms:["anxiety","dread","unease","trepidation"], textContext:"Building apprehension is a key skill in both creative writing and text analysis.", examples:[{source:"Essay",text:"A mounting sense of apprehension pervades Act 2 of Macbeth."},{source:"Creative",text:"Apprehension coiled in her stomach as she approached the old house."},{source:"Everyday",text:"He felt apprehension about the results of the exam."}], tags:["Emotion & Atmosphere"], category:"creative", list:"tone", difficulty:1, strength:0, status:"new" },
  { id:301, word:"Trepidation", pronunciation:"trep-ih-DAY-shun", definition:"A feeling of fear or anxiety about something that may happen.", synonyms:["fear","apprehension","dread","nervousness"], textContext:"Stronger than 'nervousness' — use for moments of genuine fear or dread.", examples:[{source:"Essay",text:"The speaker approaches the battlefield with trepidation, knowing what awaits."},{source:"Creative",text:"She entered the room with visible trepidation."},{source:"Everyday",text:"He accepted the promotion with a mixture of excitement and trepidation."}], tags:["Emotion & Atmosphere"], category:"creative", list:"tone", difficulty:2, strength:0, status:"new" },
