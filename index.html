  { id:302, word:"Yearning", pronunciation:"YER-ning", definition:"A feeling of intense longing for something.", synonyms:["longing","craving","desire","pining"], textContext:"Gatsby's yearning for Daisy drives the entire novel.", examples:[{source:"Essay",text:"The green light embodies Gatsby's yearning for an idealised past."},{source:"Creative",text:"A deep yearning filled her chest as she watched the ship depart."},{source:"Everyday",text:"His yearning for home grew stronger with each passing month."}], tags:["Emotion & Atmosphere","Gatsby"], category:"creative", list:"tone", difficulty:1, strength:0, status:"new" },
  { id:303, word:"Bewilderment", pronunciation:"bih-WIL-der-ment", definition:"A feeling of being perplexed and confused.", synonyms:["confusion","perplexity","puzzlement","disorientation"], textContext:"Modernist characters often exist in a state of bewilderment, unable to make sense of the world.", examples:[{source:"Essay",text:"Prufrock's bewilderment reflects the modernist crisis of meaning."},{source:"Creative",text:"Bewilderment clouded his face as he read the letter."},{source:"Everyday",text:"The sudden change left everyone in a state of bewilderment."}], tags:["Emotion & Atmosphere"], category:"creative", list:"tone", difficulty:1, strength:0, status:"new" },
  { id:304, word:"Indignation", pronunciation:"in-dig-NAY-shun", definition:"Anger or annoyance provoked by what is perceived as unfair treatment.", synonyms:["outrage","resentment","fury","anger"], textContext:"War poets channel indignation at the political leaders who perpetuated the slaughter.", examples:[{source:"Essay",text:"Sassoon's indignation at the generals fuels his most biting satire."},{source:"Creative",text:"Indignation burned in her chest as she read the dismissive reply."},{source:"Everyday",text:"The community expressed indignation at the council's decision."}], tags:["Emotion & Atmosphere","War Poetry"], category:"creative", list:"tone", difficulty:2, strength:0, status:"new" },
  { id:305, word:"Tranquillity", pronunciation:"tran-KWIL-ih-tee", definition:"The quality or state of being calm and peaceful.", synonyms:["peace","serenity","calm","stillness"], textContext:"Contrast word — moments of tranquillity in war poetry make the violence more shocking.", examples:[{source:"Essay",text:"The brief tranquillity of dawn is shattered by the first shells."},{source:"Creative",text:"A sense of tranquillity settled over the lake at dusk."},{source:"Everyday",text:"She found tranquillity in her morning walks by the river."}], tags:["Emotion & Atmosphere"], category:"creative", list:"tone", difficulty:1, strength:0, status:"new" },
  { id:306, word:"Nostalgia", pronunciation:"nos-TAL-juh", definition:"A sentimental longing for the past, typically for a period with happy personal associations.", synonyms:["wistfulness","longing","sentimentality","homesickness"], textContext:"Nostalgia pervades Gatsby, war poetry, and modernist verse in different ways.", examples:[{source:"Essay",text:"The novel is suffused with nostalgia for an idealised past that never truly existed."},{source:"Creative",text:"Nostalgia washed over her as the old song played on the radio."},{source:"Everyday",text:"The vintage photographs stirred a deep sense of nostalgia."}], tags:["Emotion & Atmosphere","Gatsby"], category:"creative", list:"tone", difficulty:1, strength:0, status:"new" },

  // === SENSORY LANGUAGE (additional) ===
  { id:350, word:"Translucent", pronunciation:"trans-LOO-sent", definition:"Allowing light to pass through but not transparent; semi-clear.", synonyms:["semi-transparent","diaphanous","gauzy","sheer"], textContext:"Beautiful visual word for creative writing — things that are between visible and hidden.", examples:[{source:"Creative",text:"The translucent curtain softened the afternoon light into pale gold."},{source:"Essay",text:"The translucent imagery suggests something half-seen, half-imagined."},{source:"Everyday",text:"The jellyfish was almost translucent in the clear water."}], tags:["Sensory — Sight"], category:"creative", list:"sensory", difficulty:2, strength:0, status:"new" },
  { id:351, word:"Dappled", pronunciation:"DAP-uld", definition:"Marked with spots or rounded patches of colour or light.", synonyms:["mottled","spotted","speckled","flecked"], textContext:"Precise visual word — far more specific than just saying 'patterned' or 'spotted'.", examples:[{source:"Creative",text:"Dappled sunlight filtered through the canopy of leaves."},{source:"Essay",text:"The dappled imagery creates a sense of gentle, natural beauty."},{source:"Everyday",text:"The horse had a beautiful dappled grey coat."}], tags:["Sensory — Sight"], category:"creative", list:"sensory", difficulty:1, strength:0, status:"new" },
  { id:352, word:"Discordant", pronunciation:"dis-KOR-dunt", definition:"Disagreeable to the ear; harsh and jarring; lacking harmony.", synonyms:["harsh","jarring","clashing","dissonant"], textContext:"Sound word for both analysis (describing rhythm/tone) and creative writing.", examples:[{source:"Essay",text:"The discordant rhythm mirrors the breakdown of order in the play."},{source:"Creative",text:"A discordant clang echoed through the empty warehouse."},{source:"Everyday",text:"The orchestra's discordant warm-up filled the concert hall."}], tags:["Sensory — Sound"], category:"creative", list:"sensory", difficulty:2, strength:0, status:"new" },
  { id:353, word:"Melodious", pronunciation:"meh-LOH-dee-us", definition:"Pleasant-sounding; musical and tuneful.", synonyms:["tuneful","harmonious","dulcet","sweet-sounding"], textContext:"Use for describing pleasant sounds, rhythmic language, or lyrical verse.", examples:[{source:"Creative",text:"A melodious birdsong drifted through the open window."},{source:"Essay",text:"The poet shifts from a melodious tone to harsh, guttural sounds."},{source:"Everyday",text:"She spoke in a melodious voice that instantly put people at ease."}], tags:["Sensory — Sound"], category:"creative", list:"sensory", difficulty:1, strength:0, status:"new" },
  { id:354, word:"Acrid", pronunciation:"AK-rid", definition:"Having an irritatingly strong and unpleasant smell or taste.", synonyms:["pungent","bitter","caustic","sharp"], textContext:"Powerful smell/taste word — especially useful for war poetry and dark creative writing.", examples:[{source:"Text",text:"The acrid stench of gas hung over the trenches."},{source:"Creative",text:"Acrid smoke billowed from the ruins, stinging their eyes."},{source:"Everyday",text:"The acrid smell of burning rubber filled the air."}], tags:["Sensory — Smell"], category:"creative", list:"sensory", difficulty:2, strength:0, status:"new" },
  { id:355, word:"Velvety", pronunciation:"VEL-vuh-tee", definition:"Having a soft, smooth texture like velvet.", synonyms:["smooth","silky","soft","plush"], textContext:"Touch/texture word — also works metaphorically for voices, darkness, or sounds.", examples:[{source:"Creative",text:"The velvety petals were cool against her fingertips."},{source:"Essay",text:"The velvety darkness of the opening stanza creates an intimate atmosphere."},{source:"Everyday",text:"The cake had a velvety texture that melted on the tongue."}], tags:["Sensory — Touch"], category:"creative", list:"sensory", difficulty:1, strength:0, status:"new" },

  // === MOVEMENT & ACTION (additional) ===
  { id:360, word:"Meandered", pronunciation:"mee-AN-derd", definition:"Followed a winding course; wandered aimlessly.", synonyms:["wandered","drifted","roamed","strolled"], textContext:"Shows slow, purposeless movement — great for both physical and metaphorical wandering.", examples:[{source:"Creative",text:"The river meandered through the valley in lazy curves."},{source:"Essay",text:"The poem meandered through memories before arriving at its devastating conclusion."},{source:"Everyday",text:"We meandered through the markets, stopping wherever something caught our eye."}], tags:["Movement & Action"], category:"creative", list:"movement", difficulty:1, strength:0, status:"new" },
  { id:361, word:"Staggered", pronunciation:"STAG-erd", definition:"Walked or moved unsteadily, as if about to fall.", synonyms:["stumbled","lurched","tottered","reeled"], textContext:"Physical instability that mirrors emotional or moral collapse.", examples:[{source:"Text",text:"The soldier staggered under the weight of his wounded companion."},{source:"Essay",text:"The rhythm staggered in the final stanza, mirroring the speaker's collapse."},{source:"Everyday",text:"She staggered to the door, dizzy with exhaustion."}], tags:["Movement & Action","War Poetry"], category:"creative", list:"movement", difficulty:1, strength:0, status:"new" },
  { id:362, word:"Hurtled", pronunciation:"HER-tuld", definition:"Moved or caused to move at great speed, typically in an uncontrolled way.", synonyms:["raced","flew","charged","barrelled"], textContext:"Shows violent, uncontrolled speed — powerful in action descriptions.", examples:[{source:"Creative",text:"The car hurtled down the mountain road, brakes screaming."},{source:"Essay",text:"Events hurtled toward their catastrophic conclusion."},{source:"Everyday",text:"The football hurtled past the goalkeeper's outstretched hands."}], tags:["Movement & Action"], category:"creative", list:"movement", difficulty:1, strength:0, status:"new" },
  { id:363, word:"Crept", pronunciation:"KREPT", definition:"Moved slowly and carefully to avoid being noticed.", synonyms:["sneaked","tiptoed","slunk","inched"], textContext:"Stealth, fear, or gradual approach — versatile in both creative and analytical writing.", examples:[{source:"Text",text:"Macbeth crept through the castle toward Duncan's chamber."},{source:"Creative",text:"Doubt crept into her mind, quiet and persistent."},{source:"Everyday",text:"The cat crept silently through the long grass."}], tags:["Movement & Action","Macbeth"], category:"creative", list:"movement", difficulty:1, strength:0, status:"new" },
  { id:364, word:"Undulated", pronunciation:"UN-dyoo-lay-tid", definition:"Moved with a smooth wave-like motion.", synonyms:["rippled","swayed","flowed","oscillated"], textContext:"Elegant movement word — perfect for water, landscapes, fabric, or crowds.", examples:[{source:"Creative",text:"The wheat field undulated in the warm breeze like a golden ocean."},{source:"Essay",text:"The rhythm undulates through the stanza, creating a hypnotic effect."},{source:"Everyday",text:"The dancer's body undulated with the music."}], tags:["Movement & Action"], category:"creative", list:"movement", difficulty:2, strength:0, status:"new" },
  { id:365, word:"Writhed", pronunciation:"RYTHD", definition:"Made continual twisting, squirming movements.", synonyms:["squirmed","twisted","contorted","wriggled"], textContext:"Shows extreme physical discomfort or agony — vivid in war poetry analysis.", examples:[{source:"Text",text:"The gas victim writhed, choking, drowning in the poisoned air."},{source:"Creative",text:"The snake writhed free of her grasp and disappeared into the undergrowth."},{source:"Everyday",text:"He writhed with embarrassment at the old photos."}], tags:["Movement & Action","War Poetry"], category:"creative", list:"movement", difficulty:2, strength:0, status:"new" },

  // === METAPHOR & FIGURATIVE BUILDING BLOCKS ===
  { id:400, word:"Smouldering", pronunciation:"SMOHL-der-ing", definition:"Burning slowly with smoke but no flame; showing suppressed emotion.", synonyms:["burning","seething","simmering","glowing"], textContext:"Dual meaning makes it powerful — literal fire AND suppressed passion or anger.", examples:[{source:"Creative",text:"A smouldering resentment lay beneath his polite exterior."},{source:"Essay",text:"The smouldering tension between the characters erupts in the final act."},{source:"Everyday",text:"The campfire reduced to smouldering embers by morning."}], tags:["Metaphor & Figurative"], category:"creative", list:"sensory", difficulty:1, strength:0, status:"new" },
  { id:401, word:"Eroded", pronunciation:"ih-ROH-did", definition:"Gradually worn away; destroyed or diminished over time.", synonyms:["worn","corroded","degraded","diminished"], textContext:"Works literally (landscape) and figuratively (trust, hope, power eroding).", examples:[{source:"Essay",text:"Macbeth's sanity erodes steadily under the weight of guilt."},{source:"Creative",text:"Years of neglect had eroded the old stone wall."},{source:"Everyday",text:"Public trust in the institution had been eroded by scandal."}], tags:["Metaphor & Figurative"], category:"creative", list:"sensory", difficulty:1, strength:0, status:"new" },
  { id:402, word:"Eclipsed", pronunciation:"ih-KLIPST", definition:"Obscured or blocked from view; surpassed in importance.", synonyms:["overshadowed","surpassed","outshone","obscured"], textContext:"Great figurative verb — one thing eclipsing another suggests dominance and loss.", examples:[{source:"Essay",text:"Macbeth's early valour is eclipsed by his descent into tyranny."},{source:"Creative",text:"The moon eclipsed the sun, plunging the landscape into eerie twilight."},{source:"Everyday",text:"Her achievement was eclipsed by the controversy that followed."}], tags:["Metaphor & Figurative"], category:"creative", list:"sensory", difficulty:1, strength:0, status:"new" },
  { id:403, word:"Suffocating", pronunciation:"SUF-uh-kay-ting", definition:"Making it difficult to breathe; overwhelmingly oppressive.", synonyms:["stifling","smothering","oppressive","choking"], textContext:"Physical and emotional — atmosphere, expectations, or guilt can all be suffocating.", examples:[{source:"Essay",text:"The suffocating atmosphere of the castle mirrors Macbeth's trapped conscience."},{source:"Creative",text:"The heat was suffocating, pressing down like a heavy blanket."},{source:"Everyday",text:"The silence in the room was suffocating."}], tags:["Metaphor & Figurative"], category:"creative", list:"sensory", difficulty:1, strength:0, status:"new" },
  { id:404, word:"Crystallised", pronunciation:"KRIS-tuh-lyzd", definition:"Formed into crystals; became definite and clear.", synonyms:["solidified","clarified","formed","materialised"], textContext:"Perfect figurative verb for the moment an idea or feeling becomes clear.", examples:[{source:"Essay",text:"The final stanza crystallises the poem's central argument."},{source:"Creative",text:"The plan crystallised in her mind as she stared at the map."},{source:"Everyday",text:"Months of vague anxiety crystallised into a specific fear."}], tags:["Metaphor & Figurative"], category:"creative", list:"sensory", difficulty:2, strength:0, status:"new" },
  { id:405, word:"Withering", pronunciation:"WITH-er-ing", definition:"Causing harm or damage; (of a look/remark) scornfully contemptuous.", synonyms:["scathing","devastating","scorching","contemptuous"], textContext:"Dual meaning — plants withering AND withering criticism or glances.", examples:[{source:"Essay",text:"Lady Macbeth delivers a withering attack on her husband's hesitation."},{source:"Creative",text:"She silenced him with a single withering look."},{source:"Everyday",text:"The review was withering in its criticism of the production."}], tags:["Metaphor & Figurative"], category:"creative", list:"sensory", difficulty:1, strength:0, status:"new" },

  // === PRECISION REPLACEMENTS ===
  { id:420, word:"Murmured", pronunciation:"MER-merd", definition:"Said something in a soft, quiet voice.", synonyms:["whispered","mumbled","muttered","breathed"], textContext:"Precision replacement for 'said' — shows intimacy, secrecy, or gentleness.", examples:[{source:"Creative",text:"'I'm sorry,' she murmured, barely audible above the rain."},{source:"Essay",text:"The speaker murmurs rather than declares, creating an intimate confessional tone."},{source:"Everyday",text:"He murmured the answer, unsure if it was correct."}], tags:["Precision Replacements"], category:"creative", list:"movement", difficulty:1, strength:0, status:"new" },
  { id:421, word:"Retorted", pronunciation:"rih-TOR-tid", definition:"Said something sharp or angry in response.", synonyms:["snapped","replied sharply","shot back","countered"], textContext:"Precision replacement for 'said' — shows anger, defensiveness, or wit.", examples:[{source:"Creative",text:"'That's not what I meant,' she retorted, her eyes flashing."},{source:"Essay",text:"The character retorted with a cutting remark that silenced the room."},{source:"Everyday",text:"'I didn't ask for your opinion,' he retorted."}], tags:["Precision Replacements"], category:"creative", list:"movement", difficulty:1, strength:0, status:"new" },
  { id:422, word:"Scrutinised", pronunciation:"SKROO-tin-yzd", definition:"Examined or inspected closely and thoroughly.", synonyms:["examined","inspected","studied","analysed"], textContext:"Precision replacement for 'looked at' — shows careful, critical observation.", examples:[{source:"Creative",text:"She scrutinised the old photograph, searching for clues."},{source:"Essay",text:"Nick scrutinises the wealthy with an outsider's penetrating gaze."},{source:"Everyday",text:"The teacher scrutinised the student's work for errors."}], tags:["Precision Replacements"], category:"creative", list:"movement", difficulty:1, strength:0, status:"new" },
  { id:423, word:"Trudged", pronunciation:"TRUJD", definition:"Walked slowly and with heavy steps, typically because of exhaustion or harsh conditions.", synonyms:["plodded","tramped","slogged","dragged"], textContext:"Precision replacement for 'walked' — shows exhaustion, reluctance, or misery.", examples:[{source:"Text",text:"The soldiers trudged through the mud, each step an effort."},{source:"Creative",text:"She trudged home through the rain, shoulders hunched."},{source:"Everyday",text:"We trudged up the hill in the blazing heat."}], tags:["Precision Replacements","War Poetry"], category:"creative", list:"movement", difficulty:1, strength:0, status:"new" },
  { id:424, word:"Despondent", pronunciation:"dih-SPON-dunt", definition:"In low spirits from loss of hope or courage.", synonyms:["dejected","disheartened","downcast","dispirited"], textContext:"Precision replacement for 'sad' — stronger, more specific, more analytical.", examples:[{source:"Essay",text:"The despondent tone of the final stanza mirrors the speaker's loss of faith."},{source:"Creative",text:"He sat despondent at the kitchen table, staring at nothing."},{source:"Everyday",text:"The team grew despondent after losing five games in a row."}], tags:["Precision Replacements","Emotion & Atmosphere"], category:"creative", list:"tone", difficulty:2, strength:0, status:"new" },
  { id:425, word:"Crestfallen", pronunciation:"KREST-faw-lun", definition:"Sad and disappointed.", synonyms:["dejected","downcast","disheartened","dispirited"], textContext:"Precision replacement for 'sad' — visual and specific, literally 'fallen crest'.", examples:[{source:"Creative",text:"His crestfallen expression told her everything before he spoke."},{source:"Essay",text:"The poem ends on a crestfallen note, all earlier hope extinguished."},{source:"Everyday",text:"She was crestfallen when she didn't make the team."}], tags:["Precision Replacements","Emotion & Atmosphere"], category:"creative", list:"tone", difficulty:1, strength:0, status:"new" },
  { id:426, word:"Jubilant", pronunciation:"JOO-bih-lunt", definition:"Feeling or expressing great happiness and triumph.", synonyms:["elated","exultant","triumphant","ecstatic"], textContext:"Precision replacement for 'happy' — stronger, more celebratory.", examples:[{source:"Creative",text:"The crowd was jubilant as the final whistle blew."},{source:"Essay",text:"The jubilant tone of the opening is deliberately misleading."},{source:"Everyday",text:"She was jubilant when she received the acceptance letter."}], tags:["Precision Replacements","Emotion & Atmosphere"], category:"creative", list:"tone", difficulty:1, strength:0, status:"new" },
  { id:427, word:"Pivotal", pronunciation:"PIV-uh-tul", definition:"Of crucial importance in relation to the development of something.", synonyms:["crucial","critical","decisive","central"], textContext:"Precision replacement for 'important' — implies a turning point.", examples:[{source:"Essay",text:"The banquet scene is pivotal — it marks Macbeth's complete psychological unravelling."},{source:"Essay",text:"This pivotal moment in the novel shifts the narrative from hope to despair."},{source:"Everyday",text:"That conversation proved pivotal in changing her career path."}], tags:["Precision Replacements","Evaluation & Argument"], category:"analytical", list:"analysis", difficulty:1, strength:0, status:"new" },
  { id:428, word:"Formidable", pronunciation:"FOR-mid-uh-bul", definition:"Inspiring fear or respect through being impressively large, powerful, or capable.", synonyms:["imposing","daunting","impressive","intimidating"], textContext:"Precision replacement for 'big/important' — implies both power and threat.", examples:[{source:"Essay",text:"Lady Macbeth is a formidable presence whose ambition exceeds her husband's."},{source:"Creative",text:"The fortress was a formidable sight, rising from the cliff face."},{source:"Everyday",text:"She faced a formidable opponent in the final round."}], tags:["Precision Replacements"], category:"creative", list:"tone", difficulty:1, strength:0, status:"new" },
  { id:429, word:"Monumental", pronunciation:"mon-yoo-MEN-tul", definition:"Great in importance, extent, or size.", synonyms:["enormous","colossal","historic","significant"], textContext:"Precision replacement for 'big/important' — implies lasting significance.", examples:[{source:"Essay",text:"Macbeth's monumental ambition proves to be his defining flaw."},{source:"Creative",text:"The monumental cliffs loomed above the tiny fishing village."},{source:"Everyday",text:"It was a monumental achievement for the young scientist."}], tags:["Precision Replacements"], category:"creative", list:"tone", difficulty:1, strength:0, status:"new" },

  // === EVALUATION & ARGUMENT LANGUAGE ===
  { id:500, word:"Compelling", pronunciation:"kum-PEL-ing", definition:"Evoking interest or admiration in a powerfully irresistible way.", synonyms:["convincing","persuasive","forceful","gripping"], textContext:"Use in essays to describe an argument or technique that strongly affects the reader.", examples:[{source:"Essay",text:"Fitzgerald presents a compelling critique of the American Dream through Gatsby's doomed aspiration."},{source:"Essay",text:"Owen's most compelling argument is made not through words but through brutal imagery."},{source:"Everyday",text:"The documentary made a compelling case for environmental action."}], tags:["Evaluation & Argument"], category:"analytical", list:"analysis", difficulty:1, strength:0, status:"new" },
  { id:501, word:"Nuanced", pronunciation:"NYOO-anst", definition:"Characterised by subtle shades of meaning or expression.", synonyms:["subtle","layered","complex","sophisticated"], textContext:"Band 6 essays show nuanced understanding — they see complexity rather than simple judgements.", examples:[{source:"Essay",text:"A nuanced reading reveals that Macbeth is as much a victim of circumstance as an agent of evil."},{source:"Essay",text:"The poem's meaning is deliberately nuanced, resisting simple interpretation."},{source:"Everyday",text:"Her response was nuanced, acknowledging both sides of the debate."}], tags:["Evaluation & Argument"], category:"analytical", list:"analysis", difficulty:1, strength:0, status:"new" },
  { id:502, word:"Profound", pronunciation:"pruh-FOUND", definition:"Very great or intense; having or showing great knowledge or insight.", synonyms:["deep","intense","significant","penetrating"], textContext:"Use to describe the deeper significance of a text's themes or techniques.", examples:[{source:"Essay",text:"The poem leaves a profound sense of loss that lingers long after the final line."},{source:"Essay",text:"Fitzgerald's most profound insight is that the American Dream corrupts those who pursue it."},{source:"Everyday",text:"The experience had a profound effect on her outlook."}], tags:["Evaluation & Argument"], category:"analytical", list:"analysis", difficulty:1, strength:0, status:"new" },
  { id:503, word:"Ostensibly", pronunciation:"os-TEN-sih-blee", definition:"Apparently or purportedly, but perhaps not actually.", synonyms:["apparently","seemingly","supposedly","outwardly"], textContext:"Perfect for analysis — signals that the surface meaning differs from the deeper one.", examples:[{source:"Essay",text:"The play is ostensibly about ambition, but at its core it is about the fragility of identity."},{source:"Essay",text:"Gatsby's parties are ostensibly celebrations, but they mask a profound loneliness."},{source:"Everyday",text:"She was ostensibly working, but her mind was elsewhere."}], tags:["Evaluation & Argument"], category:"analytical", list:"analysis", difficulty:2, strength:0, status:"new" },
  { id:504, word:"Paradoxically", pronunciation:"par-uh-DOK-sik-lee", definition:"In a way that seems self-contradictory but reveals a deeper truth.", synonyms:["contradictorily","ironically","counter-intuitively"], textContext:"Key essay word — shows you can see contradictions within a text.", examples:[{source:"Essay",text:"Paradoxically, Gatsby's immense wealth makes him feel more powerless, not less."},{source:"Essay",text:"The speaker is paradoxically liberated by loss in the final stanza."},{source:"Everyday",text:"Paradoxically, working fewer hours made her more productive."}], tags:["Evaluation & Argument"], category:"analytical", list:"analysis", difficulty:2, strength:0, status:"new" },
  { id:505, word:"Inextricably", pronunciation:"in-EK-strik-uh-blee", definition:"In a way that is impossible to separate or disentangle.", synonyms:["inseparably","indissolubly","irreversibly"], textContext:"Powerful essay word for connecting two ideas that cannot be separated.", examples:[{source:"Essay",text:"In Macbeth, ambition and destruction are inextricably linked."},{source:"Essay",text:"The personal and the political are inextricably woven throughout the war poets' verse."},{source:"Everyday",text:"Her success was inextricably tied to her willingness to take risks."}], tags:["Evaluation & Argument"], category:"analytical", list:"analysis", difficulty:3, strength:0, status:"new" },
  { id:506, word:"Unequivocally", pronunciation:"un-ih-KWIV-uh-klee", definition:"In a way that leaves no doubt; clearly and without qualification.", synonyms:["unambiguously","categorically","definitively","clearly"], textContext:"Strong evaluative word — for when you want to make an argument with certainty.", examples:[{source:"Essay",text:"The final image unequivocally establishes the poem's anti-war stance."},{source:"Essay",text:"Shakespeare unequivocally presents the witches as agents of disorder."},{source:"Everyday",text:"The evidence unequivocally pointed to human-caused climate change."}], tags:["Evaluation & Argument"], category:"analytical", list:"analysis", difficulty:3, strength:0, status:"new" },
  { id:507, word:"Inherently", pronunciation:"in-HAIR-ent-lee", definition:"In a permanent, essential, or characteristic way.", synonyms:["fundamentally","essentially","intrinsically","naturally"], textContext:"Use to argue that a quality belongs to the core of something, not just its surface.", examples:[{source:"Essay",text:"The novel suggests that the American Dream is inherently flawed."},{source:"Essay",text:"Shakespeare presents power as inherently corrupting."},{source:"Everyday",text:"The job was inherently risky, but she accepted the challenge."}], tags:["Evaluation & Argument"], category:"analytical", list:"analysis", difficulty:2, strength:0, status:"new" },
  { id:508, word:"Cogent", pronunciation:"KOH-jent", definition:"Clear, logical, and convincing.", synonyms:["persuasive","compelling","forceful","lucid"], textContext:"Use when describing an argument in an essay — or to describe your own essay structure!", examples:[{source:"Essay",text:"Sassoon constructs a cogent argument against the generals through controlled irony."},{source:"Essay",text:"To be cogent, an essay must connect each point clearly to its thesis."},{source:"Everyday",text:"She made a cogent case for changing the company's policy."}], tags:["Evaluation & Argument"], category:"analytical", list:"analysis", difficulty:2, strength:0, status:"new" },

  // === CHARACTER & THEME LANGUAGE ===
  { id:520, word:"Verisimilitude", pronunciation:"ver-ih-sih-MIL-ih-tood", definition:"The appearance of being true or real; lifelike quality.", synonyms:["realism","authenticity","plausibility","truthfulness"], textContext:"Use when analysing how a writer creates convincing characters or situations.", examples:[{source:"Essay",text:"The war poets achieve verisimilitude through visceral, specific sensory detail."},{source:"Essay",text:"Fitzgerald's verisimilitude comes from his precise observation of Jazz Age manners."},{source:"Everyday",text:"The film's verisimilitude made it deeply unsettling."}], tags:["Character & Theme","Literary Technique"], category:"analytical", list:"analysis", difficulty:3, strength:0, status:"new" },
  { id:521, word:"Duplicitous", pronunciation:"doo-PLIS-ih-tus", definition:"Deceitful; saying one thing while meaning another.", synonyms:["deceitful","two-faced","treacherous","dishonest"], textContext:"Perfect for characters who conceal their true intentions.", examples:[{source:"Essay",text:"Lady Macbeth is duplicitous — her warm welcome to Duncan masks her murderous intent."},{source:"Essay",text:"Tom Buchanan is duplicitous, presenting himself as honest while concealing his affair."},{source:"Everyday",text:"The duplicitous politician promised reform while accepting bribes."}], tags:["Character & Theme"], category:"analytical", list:"analysis", difficulty:2, strength:0, status:"new" },
  { id:522, word:"Magnanimous", pronunciation:"mag-NAN-ih-mus", definition:"Generous or forgiving, especially towards rivals or enemies.", synonyms:["generous","noble","benevolent","gracious"], textContext:"Contrast with characters who are petty, vindictive or corrupt.", examples:[{source:"Essay",text:"Duncan's magnanimous rule is juxtaposed with Macbeth's reign of terror."},{source:"Essay",text:"The magnanimous character of the dying soldier contrasts with the politicians' callousness."},{source:"Everyday",text:"She was magnanimous in victory, praising her opponent warmly."}], tags:["Character & Theme"], category:"analytical", list:"analysis", difficulty:2, strength:0, status:"new" },
  { id:523, word:"Catharsis", pronunciation:"kuh-THAR-sis", definition:"The process of releasing strong emotions through art; emotional purification.", synonyms:["purging","release","cleansing","resolution"], textContext:"Aristotle's term for the emotional release provided by tragedy — essential for Macbeth essays.", examples:[{source:"Essay",text:"The final battle provides catharsis — justice is restored and order returns to Scotland."},{source:"Essay",text:"Owen's poems offer catharsis by transforming private grief into shared public mourning."},{source:"Everyday",text:"Crying at the film provided a kind of catharsis after a difficult week."}], tags:["Character & Theme","Literary Technique"], category:"analytical", list:"analysis", difficulty:2, strength:0, status:"new" },
  { id:524, word:"Hubris", pronunciation:"HYOO-bris", definition:"Excessive pride or self-confidence, especially as a fatal flaw leading to downfall.", synonyms:["arrogance","overconfidence","pride","conceit"], textContext:"The defining tragic flaw — Macbeth's hubris in believing he can outmanoeuvre fate.", examples:[{source:"Essay",text:"Macbeth's hubris blinds him to the fact that prophecies can be fulfilled in unexpected ways."},{source:"Essay",text:"Gatsby's hubris lies in his belief that he can repeat the past."},{source:"Everyday",text:"The company's hubris led it to ignore warning signs of failure."}], tags:["Character & Theme"], category:"analytical", list:"analysis", difficulty:1, strength:0, status:"new" },
  { id:525, word:"Enigmatic", pronunciation:"en-ig-MAT-ik", definition:"Difficult to interpret or understand; mysterious.", synonyms:["mysterious","inscrutable","cryptic","baffling"], textContext:"Gatsby, the witches, and many modernist figures are enigmatic characters.", examples:[{source:"Essay",text:"Gatsby remains enigmatic throughout — the reader, like Nick, never fully understands him."},{source:"Essay",text:"The witches are deliberately enigmatic, blurring the line between prophecy and temptation."},{source:"Everyday",text:"She gave an enigmatic smile that revealed nothing."}], tags:["Character & Theme"], category:"analytical", list:"analysis", difficulty:2, strength:0, status:"new" },
  { id:526, word:"Archetype", pronunciation:"AR-kih-typ", definition:"A very typical example of a person or thing; an original model.", synonyms:["prototype","model","embodiment","classic example"], textContext:"Macbeth is the archetype of the tragic hero; Gatsby the archetype of the dreamer.", examples:[{source:"Essay",text:"Macbeth functions as an archetype of the man destroyed by ambition."},{source:"Essay",text:"Nick Carraway is the archetype of the honest observer — too honest to be comfortable."},{source:"Everyday",text:"She was the archetype of a dedicated teacher."}], tags:["Character & Theme","Literary Technique"], category:"analytical", list:"analysis", difficulty:2, strength:0, status:"new" },
  { id:527, word:"Metamorphosis", pronunciation:"met-uh-MOR-fuh-sis", definition:"A transformation, especially a dramatic change of character.", synonyms:["transformation","change","evolution","conversion"], textContext:"Macbeth undergoes a complete metamorphosis from noble soldier to tyrant.", examples:[{source:"Essay",text:"The play traces Macbeth's metamorphosis from loyal thane to isolated tyrant."},{source:"Essay",text:"Modernist poetry often depicts the metamorphosis of the self under modern pressures."},{source:"Everyday",text:"The city's metamorphosis over twenty years was remarkable."}], tags:["Character & Theme"], category:"analytical", list:"analysis", difficulty:2, strength:0, status:"new" },

  // === LITERARY TECHNIQUE TERMS ===
  { id:540, word:"Allegory", pronunciation:"AL-uh-gor-ee", definition:"A story, poem, or picture that can be interpreted to reveal a hidden meaning.", synonyms:["parable","fable","metaphor","symbol"], textContext:"Gatsby can be read as an allegory for the American Dream and its corruption.", examples:[{source:"Essay",text:"Fitzgerald's novel functions as an allegory for the moral bankruptcy of the American Dream."},{source:"Essay",text:"The witches' cauldron operates as an allegory for the corruption of Macbeth's mind."},{source:"Everyday",text:"Animal Farm is a political allegory about the Soviet Union."}], tags:["Literary Technique"], category:"analytical", list:"analysis", difficulty:2, strength:0, status:"new" },
  { id:541, word:"Motif", pronunciation:"moh-TEEF", definition:"A recurring element in a literary work that has symbolic significance.", synonyms:["theme","symbol","pattern","leitmotif"], textContext:"Blood as a motif in Macbeth reinforces guilt; the green light as a motif in Gatsby represents aspiration.", examples:[{source:"Essay",text:"The blood motif recurs throughout Macbeth, charting the spread of guilt and violence."},{source:"Essay",text:"Light and darkness operate as a central motif in both Macbeth and modernist poetry."},{source:"Everyday",text:"The film uses a recurring musical motif to signal the character's fear."}], tags:["Literary Technique"], category:"analytical", list:"analysis", difficulty:1, strength:0, status:"new" },
  { id:542, word:"Soliloquy", pronunciation:"suh-LIL-uh-kwee", definition:"A dramatic technique where a character speaks their thoughts aloud while alone on stage.", synonyms:["monologue","aside","interior speech"], textContext:"Macbeth's soliloquies reveal his private torment — they show us what no other character can see.", examples:[{source:"Essay",text:"The 'Is this a dagger' soliloquy reveals the extent of Macbeth's psychological disintegration."},{source:"Essay",text:"Shakespeare uses soliloquy to bridge the gap between action and inner life."},{source:"Everyday",text:"She delivered the soliloquy with such honesty that the audience went silent."}], tags:["Literary Technique","Macbeth"], category:"analytical", list:"macbeth", difficulty:1, strength:0, status:"new" },
  { id:543, word:"Enjambment", pronunciation:"en-JAM-ment", definition:"The continuation of a sentence across a line break in poetry without a pause.", synonyms:["run-on line","continuation","overflow"], textContext:"War poets use enjambment to create urgency and suggest experience that cannot be contained.", examples:[{source:"Essay",text:"Owen's enjambment creates breathless urgency, mimicking the pace of the charge."},{source:"Essay",text:"The enjambment refuses to let the reader pause — there is no rest, just as there was none in the trenches."},{source:"Everyday",text:"The poem's enjambment swept the reader forward without letting them breathe."}], tags:["Literary Technique","War Poetry"], category:"analytical", list:"war", difficulty:2, strength:0, status:"new" },
  { id:544, word:"Caesura", pronunciation:"sih-ZYOO-ruh", definition:"A pause in a line of poetry, usually in the middle, created by punctuation or natural speech rhythm.", synonyms:["pause","break","interruption"], textContext:"A caesura mid-line creates a sudden, jarring stop — war poets use it to simulate the shock of battle.", examples:[{source:"Essay",text:"The brutal caesura after 'guttering, choking, drowning' forces the reader to stop and absorb the horror."},{source:"Essay",text:"Shakespeare's caesuras in Macbeth's soliloquies mirror his fractured thinking."},{source:"Everyday",text:"The playwright marked a deliberate caesura at the climax of the speech."}], tags:["Literary Technique","War Poetry"], category:"analytical", list:"war", difficulty:3, strength:0, status:"new" },
  { id:545, word:"Volta", pronunciation:"VOL-tuh", definition:"A turn in a poem — a shift in tone, argument, or imagery, especially in a sonnet.", synonyms:["turn","shift","reversal","transition"], textContext:"The volta is the key structural moment in a poem — where everything changes.", examples:[{source:"Essay",text:"The volta arrives in line 9, shifting from celebration to elegy."},{source:"Essay",text:"Owen employs a devastating volta in the final stanza, turning hope to horror."},{source:"Everyday",text:"The poem's volta transformed its entire meaning with a single line."}], tags:["Literary Technique","War Poetry"], category:"analytical", list:"war", difficulty:2, strength:0, status:"new" },
  { id:546, word:"Pathetic fallacy", pronunciation:"puh-THET-ik FAL-uh-see", definition:"Attributing human emotions to nature or inanimate objects.", synonyms:["personification of nature","emotional landscape","mood setting"], textContext:"The storm in Macbeth reflects the chaos of the kingdom; the wasteland in Eliot mirrors inner desolation.", examples:[{source:"Essay",text:"The pathetic fallacy of the unnatural darkness after Duncan's murder signals moral catastrophe."},{source:"Essay",text:"Owen uses pathetic fallacy — nature itself seems to mourn the fallen soldiers."},{source:"Everyday",text:"The grey, drizzling day felt like pathetic fallacy for her mood."}], tags:["Literary Technique","Macbeth"], category:"analytical", list:"macbeth", difficulty:1, strength:0, status:"new" },
  { id:547, word:"Anagnorisis", pronunciation:"an-ag-NOR-ih-sis", definition:"The moment in a play when a character makes a critical discovery, especially about their own nature.", synonyms:["recognition","realisation","revelation","discovery"], textContext:"Macbeth's anagnorisis comes when he realises the witches have deceived him — it is already too late.", examples:[{source:"Essay",text:"Macbeth's anagnorisis — 'I have almost forgot the taste of fears' — marks his transformation into a hollow shell."},{source:"Essay",text:"The anagnorisis arrives too late to save Macbeth; self-knowledge comes only after self-destruction."},{source:"Everyday",text:"The novel's climax is a powerful anagnorisis for the protagonist."}], tags:["Literary Technique","Macbeth"], category:"analytical", list:"macbeth", difficulty:3, strength:0, status:"new" },

  // === TONE & MOOD (additional) ===
  { id:560, word:"Sardonic", pronunciation:"sar-DON-ik", definition:"Grimly mocking or cynical.", synonyms:["cynical","scornful","biting","wry"], textContext:"Sassoon's sardonic tone in war poetry mocks the generals and propagandists.", examples:[{source:"Essay",text:"Sassoon's sardonic verse exposes the gap between the propaganda and the reality."},{source:"Essay",text:"The narrator adopts a sardonic tone that distances us from the pompous characters."},{source:"Everyday",text:"His sardonic commentary made the meeting both bearable and uncomfortable."}], tags:["Tone & Mood"], category:"analytical", list:"tone", difficulty:2, strength:0, status:"new" },
  { id:561, word:"Elegiac", pronunciation:"el-uh-JY-ak", definition:"Having a mournful quality; relating to an elegy.", synonyms:["mournful","sorrowful","lamenting","plaintive"], textContext:"War poetry is predominantly elegiac — it mourns the young men lost to conflict.", examples:[{source:"Essay",text:"The elegiac tone of the closing stanza transforms protest into lamentation."},{source:"Essay",text:"Owen's most elegiac passages contrast sharply with his more angry, accusatory verse."},{source:"Everyday",text:"The film had an elegiac quality that lingered for days."}], tags:["Tone & Mood","War Poetry"], category:"analytical", list:"tone", difficulty:2, strength:0, status:"new" },
  { id:562, word:"Acerbic", pronunciation:"uh-SER-bik", definition:"Sharp and forthright; having a sharp, bitter quality.", synonyms:["sharp","cutting","biting","caustic"], textContext:"Use to describe writers like Sassoon who attack their targets with sharp wit.", examples:[{source:"Essay",text:"Sassoon's acerbic wit targets the complacency of those who sent soldiers to their deaths."},{source:"Essay",text:"The novel's acerbic social commentary strips away the glamour of wealth."},{source:"Everyday",text:"Her acerbic reviews made her both feared and respected."}], tags:["Tone & Mood"], category:"analytical", list:"tone", difficulty:2, strength:0, status:"new" },
  { id:563, word:"Ebullient", pronunciation:"ih-BUL-ee-unt", definition:"Cheerful and full of energy; exuberant.", synonyms:["exuberant","buoyant","vivacious","effervescent"], textContext:"Contrast word — an ebullient opening followed by despair makes the fall more devastating.", examples:[{source:"Essay",text:"The poem opens with an ebullient celebration of summer that makes its ending more devastating."},{source:"Creative",text:"She burst into the room in her usual ebullient way."},{source:"Everyday",text:"His ebullient personality made him the centre of every gathering."}], tags:["Tone & Mood"], category:"analytical", list:"tone", difficulty:2, strength:0, status:"new" },
  { id:564, word:"Foreboding", pronunciation:"for-BOH-ding", definition:"A feeling that something bad will happen; sinister or threatening.", synonyms:["ominous","menacing","threatening","portentous"], textContext:"Macbeth is saturated with foreboding from the witches' opening words.", examples:[{source:"Essay",text:"The foreboding atmosphere is established in the very first lines of the play."},{source:"Creative",text:"A foreboding silence settled over the village as the sky darkened."},{source:"Everyday",text:"She had a foreboding sense that something was about to go very wrong."}], tags:["Tone & Mood"], category:"analytical", list:"tone", difficulty:1, strength:0, status:"new" },
  { id:565, word:"Pensive", pronunciation:"PEN-siv", definition:"Engaged in deep or serious thought; thoughtful.", synonyms:["thoughtful","reflective","contemplative","meditative"], textContext:"Lyric poetry and modernist verse often adopt a pensive, introspective tone.", examples:[{source:"Essay",text:"The pensive tone of the opening lines creates space for quiet reflection before the violence."},{source:"Creative",text:"He sat in pensive silence, staring at the photograph."},{source:"Everyday",text:"She became pensive when the conversation turned to her childhood."}], tags:["Tone & Mood"], category:"analytical", list:"tone", difficulty:1, strength:0, status:"new" },
];

const Btn = ({ children, onClick, variant = "primary", style: s = {}, disabled }) => {
  const [hov, setHov] = useState(false);

    ? { background: gradient, color: "#fff", border: "none", boxShadow: hov ? "0 8px 30px rgba(255,107,53,0.4)" : "0 4px 15px rgba(255,107,53,0.2)" }
    : variant === "ghost"

    : { background: "transparent", color: T.muted, border: "none" };
  return (
    <button
      onClick={onClick} disabled={disabled}
      onMouseEnter={() => setHov(true)} onMouseLeave={() => setHov(false)}
      style={{
        ...base, padding: "14px 28px", borderRadius: 16, fontSize: 15, fontWeight: 600,
        fontFamily: T.sans, cursor: disabled ? "default" : "pointer", width: "100%",

        transform: hov && !disabled ? "translateY(-1px)" : "none", ...s,
      }}

};

function OnboardingScreen({ onComplete }) {
  const [step, setStep] = useState(0);
  const [name, setName] = useState("");
  const [year, setYear] = useState(null);
  const [texts, setTexts] = useState([]);
  const [goal, setGoal] = useState(null);

  const textOptions = [
    { id: "gatsby", name: "The Great Gatsby", icon: "📗", author: "F. Scott Fitzgerald" },
    { id: "macbeth", name: "Macbeth", icon: "🗡️", author: "William Shakespeare" },
    { id: "war", name: "War Poetry", icon: "🎖️", author: "Owen, Sassoon & others" },
    { id: "modernist", name: "Modernist Poetry", icon: "🖋️", author: "Eliot, Pound & others" },
  ];

  const goalOptions = [
    { id: 3, label: "3 words/day", subtitle: "Casual · ~5 min", icon: "🌱" },
    { id: 5, label: "5 words/day", subtitle: "Steady · ~8 min", icon: "🌿" },
    { id: 8, label: "8 words/day", subtitle: "Ambitious · ~12 min", icon: "🌳" },
  ];

  const toggleText = (id) => setTexts((t) => t.includes(id) ? t.filter((x) => x !== id) : [...t, id]);

  return (
    <PhoneFrame>
      <StatusBar />
      <div style={{ padding: "0 24px 40px", position: "relative", zIndex: 1 }}>
        <div style={{ display: "flex", justifyContent: "center", gap: 8, marginBottom: 40, marginTop: 8 }}>
          {[0, 1, 2].map((i) => (
            <div key={i} style={{
              width: i === step ? 28 : 8, height: 8, borderRadius: 4,
              background: i === step ? gradient : i < step ? T.accent1 : "rgba(255,255,255,0.1)",
              transition: "all 0.4s ease",
            }} />
          ))}
        </div>

        {step === 0 && (
          <div style={{ animation: "fadeSlideUp 0.5s ease both" }}>
            <div style={{ textAlign: "center", marginBottom: 48 }}>
              <div style={{ fontSize: 56, marginBottom: 16, animation: "breathe 3s ease-in-out infinite" }}>✨</div>
              <h1 style={{
                fontSize: 34, fontFamily: T.serif, fontWeight: 700, margin: 0,
                background: gradient, WebkitBackgroundClip: "text", WebkitTextFillColor: "transparent",
                lineHeight: 1.2,
              }}>WordSmith</h1>
              <p style={{ fontSize: 14, color: T.muted, marginTop: 10, lineHeight: 1.6 }}>
                Build the vocabulary that gets you noticed in essays and creative writing.
              </p>
            </div>

            <div style={{ background: T.card, border: `1px solid ${T.cardBorder}`, borderRadius: T.radius, padding: 20, marginBottom: 32 }}>
              <p style={{ fontSize: 16, color: "rgba(255,255,255,0.85)", fontFamily: T.serif, lineHeight: 1.6, margin: 0, textAlign: "center" }}>
                Hey! 👋<br />

                  Let's set up your vocabulary journey. It only takes a minute.
                </span>
              </p>
            </div>

            <SectionLabel>What's your name?</SectionLabel>
            <input
              type="text"
              placeholder="Enter your first name"
              value={name}
              onChange={(e) => setName(e.target.value)}
              maxLength={20}
              style={{
                width: "100%", padding: "14px 16px", borderRadius: 14, fontSize: 15,
                fontFamily: T.sans, fontWeight: 500, marginBottom: 28,
                background: T.card, border: `1px solid ${T.cardBorder}`,
                color: T.white, outline: "none", caretColor: T.accent1,
              }}
              onFocus={(e) => e.target.style.borderColor = T.accent1}
              onBlur={(e) => e.target.style.borderColor = T.cardBorder}
            />

            <SectionLabel>What year are you in?</SectionLabel>
            <div style={{ display: "flex", gap: 10, marginBottom: 32 }}>
              {["Year 10", "Year 11", "Year 12"].map((y) => (
                <button key={y} onClick={() => setYear(y)} style={{
                  flex: 1, padding: "16px 8px", borderRadius: 14, cursor: "pointer",
                  background: year === y ? "rgba(255,107,53,0.15)" : T.card,
                  border: year === y ? `2px solid ${T.accent1}` : `1px solid ${T.cardBorder}`,

                    display: "flex", alignItems: "center", gap: 14, padding: "16px 18px",
                    borderRadius: 16, cursor: "pointer", textAlign: "left",

                    <span style={{ fontSize: 28 }}>{t.icon}</span>
                    <div style={{ flex: 1 }}>
                      <div style={{ fontSize: 15, fontWeight: 600, color: sel ? T.white : "rgba(255,255,255,0.8)", fontFamily: T.sans }}>{t.name}</div>
                      <div style={{ fontSize: 12, color: T.muted }}>{t.author}</div>

                    <div style={{
                      width: 24, height: 24, borderRadius: "50%",
                      background: sel ? gradient : "rgba(255,255,255,0.08)",
                      border: sel ? "none" : `1px solid rgba(255,255,255,0.15)`,
                      display: "flex", alignItems: "center", justifyContent: "center",
                      fontSize: 14, color: "#fff", transition: "all 0.25s ease",

                  </button>

              })}
            </div>
            <Btn onClick={() => texts.length > 0 && setStep(2)} disabled={texts.length === 0}>Continue</Btn>
          </div>
        )}

        {step === 2 && (
          <div style={{ animation: "fadeSlideUp 0.5s ease both" }}>
            <BackBtn onClick={() => setStep(1)} />
            <h2 style={{ fontSize: 26, fontFamily: T.serif, fontWeight: 700, color: T.white, margin: "16px 0 6px" }}>Daily goal</h2>
            <p style={{ fontSize: 13, color: T.muted, marginBottom: 24, lineHeight: 1.5 }}>How many new words do you want to learn each day?</p>
            <div style={{ display: "flex", flexDirection: "column", gap: 10, marginBottom: 36 }}>
              {goalOptions.map((g) => {
                const sel = goal === g.id;
                return (
                  <button key={g.id} onClick={() => setGoal(g.id)} style={{
                    display: "flex", alignItems: "center", gap: 14, padding: "18px 18px",
                    borderRadius: 16, cursor: "pointer", textAlign: "left",
                    background: sel ? "rgba(255,107,53,0.1)" : T.card,
                    border: sel ? `2px solid ${T.accent1}` : `1px solid ${T.cardBorder}`,
                    transition: "all 0.25s ease",
                  }}>
                    <span style={{ fontSize: 28 }}>{g.icon}</span>
                    <div>
                      <div style={{ fontSize: 16, fontWeight: 600, color: sel ? T.white : "rgba(255,255,255,0.8)", fontFamily: T.sans }}>{g.label}</div>
                      <div style={{ fontSize: 12, color: T.muted }}>{g.subtitle}</div>
                    </div>
                  </button>
                );
              })}
            </div>
            <Btn onClick={() => goal && onComplete({ name: name.trim(), year, texts, goal })}>Start Learning ✨</Btn>
          </div>
        )}
      </div>
    </PhoneFrame>
  );
}

function HomeScreen({ onNav, userPrefs, wordsDB, gameState, badges }) {
  const levelData = getLevelData(gameState.totalXP || 0);
  const user = { name: userPrefs?.name || "Student" };
  const goal = userPrefs?.goal || 5;
  const reviewWords = Math.max(2, Math.ceil(goal * 1.2));
  const totalWords = goal + reviewWords;
  const done = gameState.wordsToday || 0;
  const remaining = Math.max(0, totalWords - done);
  // Only show words from unlocked tiers. Memoised — recomputes when wordsDB changes.
  const unlockedWords = useMemo(
    () => window.TierService ? window.TierService.getUnlockedWords(wordsDB) : wordsDB,
    [wordsDB]
  );
  // todayWord: date-stable daily pick from unlocked words only.
  const todayWord = useMemo(() => {
    if (!unlockedWords || unlockedWords.length === 0) return null;
    return unlockedWords[Math.floor(Date.now() / 86400000) % unlockedWords.length];
  }, [unlockedWords]);
  const today = todayISO();
  const dueWords = useMemo(() => unlockedWords.filter(w => {
    if (w.status === "new") return false;
    if (!w.nextReview) return w.status === "learning";
    return w.nextReview <= today;
  }).slice(0, 4);
  const learnedThisWeek = wordsDB.filter(w => w.status === "familiar" || w.status === "mastered").length;
  const accuracy = (gameState.quizAttempts || 0) > 0
    ? Math.round(((gameState.quizCorrect || 0) / gameState.quizAttempts) * 100)
    : 0;
  // Most recently unlocked badge
  const latestBadge = gameState.unlockedBadges?.length > 0
    ? badges.find(b => b.id === gameState.unlockedBadges[gameState.unlockedBadges.length - 1])
    : null;

  return (
    <>
      <StatusBar />
      <div style={{ padding: "0 20px", position: "relative", zIndex: 1 }}>
        {/* Header */}
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 24 }}>
          <div>
            <div style={{ fontSize: 13, color: T.muted, fontWeight: 500, letterSpacing: 1.5, textTransform: "uppercase", marginBottom: 4 }}>Good morning</div>
            <div style={{ fontSize: 28, fontWeight: 700, fontFamily: T.serif, background: `linear-gradient(135deg, #fff 30%, rgba(255,255,255,0.7))`, WebkitBackgroundClip: "text", WebkitTextFillColor: "transparent" }}>
              {user.name}
            </div>
          </div>
          <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
            <div style={{
              display: "flex", alignItems: "center", gap: 5,
              background: "rgba(255,107,53,0.12)", borderRadius: 20, padding: "6px 12px 6px 8px",
              border: "1px solid rgba(255,107,53,0.2)",
            }}>
              <div style={{ animation: "flameDance 2s ease-in-out infinite" }}><StreakFlame size={22} /></div>
              <span style={{ fontSize: 15, fontWeight: 700, color: T.accent1 }}>{gameState.streak || 0}</span>
            </div>
            <div onClick={() => onNav("settings")} style={{
              width: 42, height: 42, borderRadius: "50%", background: gradient,
              display: "flex", alignItems: "center", justifyContent: "center",
              fontSize: 17, fontWeight: 700, color: "#fff", cursor: "pointer", position: "relative",
            }}>
              {user.name[0]?.toUpperCase() || "A"}
              <div style={{
                position: "absolute", bottom: -1, right: -1, width: 14, height: 14,
                borderRadius: "50%", background: "#1c1c28", display: "flex", alignItems: "center", justifyContent: "center",
                border: `2px solid #1c1c28`,
              }}><span style={{ fontSize: 8 }}>⚙️</span></div>
            </div>
          </div>
        </div>

        {/* XP */}
        <div style={{ marginBottom: 24 }}>
          <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 8 }}>
            <span style={{ fontSize: 12, fontWeight: 600, color: T.muted, letterSpacing: 0.8, textTransform: "uppercase" }}>
              Level {levelData.level} · {levelData.title}
            </span>
            <span style={{ fontSize: 12, fontWeight: 600, color: T.dimmed }}>
              {levelData.xpInLevel} / {levelData.xpToNext} XP
            </span>
          </div>

/* ════════════════════════════════════════════
   SCREEN: WORD CARDS (Swipeable)
   ════════════════════════════════════════════ */
function WordCardsScreen({ onNav, startWordId, wordsDB, updateWord, rateWord }) {
  const [filter, setFilter] = useState("all");
  const filtered = filter === "all" ? wordsDB : wordsDB.filter((w) => w.category === filter);
  const startIdx = startWordId ? Math.max(0, filtered.findIndex((w) => w.id === startWordId)) : 0;
  const [idx, setIdx] = useState(startIdx);
  const [revealed, setRevealed] = useState(false);
  const [flipped, setFlipped] = useState(false);
  const [swipeDir, setSwipeDir] = useState(null);

  useEffect(() => {
    if (startWordId) {
      const i = filtered.findIndex((w) => w.id === startWordId);
      if (i >= 0) setIdx(i);
    }
    setRevealed(false);
    setFlipped(false);
  }, [startWordId]);

  const word = filtered[idx % filtered.length];
  const doFlip = useCallback(() => { if (revealed) setFlipped((f) => !f); }, [revealed]);
  const handleReveal = useCallback(() => setRevealed(true), []);

  const handleRate = (rating) => {
    // Map string rating to SM-2 numeric rating
    const ratingMap = { again: 0, hard: 1, good: 2, easy: 3 };
    const numericRating = ratingMap[rating] ?? 2;
    if (rateWord) {
      rateWord(word.id, numericRating);
    } else {
      // Fallback for contexts without rateWord
      const updates = {};
      if (rating === "again") { updates.strength = Math.max(0, word.strength - 1); updates.status = "learning"; }
      else if (rating === "hard") { updates.strength = Math.min(5, word.strength); updates.status = word.strength >= 3 ? "familiar" : "learning"; }
      else if (rating === "good") { updates.strength = Math.min(5, word.strength + 1); updates.status = word.strength >= 3 ? "familiar" : "learning"; }
      else if (rating === "easy") { updates.strength = Math.min(5, word.strength + 2); updates.status = word.strength >= 3 ? "mastered" : "familiar"; }
      updateWord(word.id, updates);
    }
    
    const dir = rating === "again" || rating === "hard" ? "left" : "right";
    setSwipeDir(dir);
    setTimeout(() => {
      setRevealed(false);
      setFlipped(false);
      setSwipeDir(null);
      setIdx((i) => (i + 1) % filtered.length);
    }, 300);
  };

  const filters = [
    { id: "all", label: "All" },
    { id: "analytical", label: "Analytical" },
    { id: "creative", label: "Creative" },
    { id: "text-specific", label: "Text-Specific" },
  ];

  const statusColors = { new: T.accent1, learning: T.yellow, familiar: T.green, mastered: T.cyan };

  return (
    <>
      <StatusBar />
      <div style={{ padding: "0 20px", position: "relative", zIndex: 1 }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 20 }}>
          <BackBtn onClick={() => onNav("home")} label="Home" />
          <span style={{ fontSize: 13, color: T.muted, fontWeight: 500 }}>{idx + 1} / {filtered.length}</span>
        </div>

        <div style={{ display: "flex", gap: 8, marginBottom: 20, overflowX: "auto" }}>
          {filters.map((f) => (
            <button key={f.id} onClick={() => { setFilter(f.id); setIdx(0); setRevealed(false); setFlipped(false); }} style={{
              padding: "8px 14px", borderRadius: 20, fontSize: 12, fontWeight: 600,
              fontFamily: T.sans, cursor: "pointer", whiteSpace: "nowrap",
              background: filter === f.id ? "rgba(255,107,53,0.15)" : "rgba(255,255,255,0.05)",
              color: filter === f.id ? T.accent1 : T.muted,
              border: filter === f.id ? `1px solid rgba(255,107,53,0.3)` : `1px solid ${T.cardBorder}`,
              transition: "all 0.2s ease",

          ))}
        </div>

        {/* Card with 3D flip */}
        <div style={{
          perspective: 1200, minHeight: 440, marginBottom: 8,
          transform: swipeDir === "left" ? "translateX(-120%) rotate(-8deg)" : swipeDir === "right" ? "translateX(120%) rotate(8deg)" : "none",
          opacity: swipeDir ? 0 : 1,
          transition: swipeDir ? "all 0.3s ease" : "none",
        }}>
          <div style={{
            position: "relative", width: "100%", minHeight: 440,

            transform: flipped ? "rotateY(180deg)" : "rotateY(0deg)",

            {/* FRONT */}
            <div style={{

/* ════════════════════════════════════════════
   SCREEN: DAILY PRACTICE SESSION
   — Fixed: quiz options are now memoised per word step so they don't reshuffle on re-render
   ════════════════════════════════════════════ */
function PracticeScreen({ onNav, userPrefs, wordsDB, updateWord, completePractice }) {
  const goal = userPrefs?.goal || 5;
  // Filter to unlocked tiers — Tier 4 words must not appear before prerequisites mastered.
  const unlockedWords = useMemo(
    () => window.TierService ? window.TierService.getUnlockedWords(wordsDB) : wordsDB,
    [wordsDB]
  );
  const sessionWords = useMemo(() => {
    const newWords = unlockedWords.filter(w => w.status === "new").slice(0, Math.ceil(goal * 0.4));
    const reviewWords = unlockedWords.filter(w => w.status === "learning" || w.status === "familiar").slice(0, goal - newWords.length);
    const combined = [...newWords, ...reviewWords];
    return combined.length > 0 ? combined : unlockedWords.slice(0, goal);
  }, [goal, unlockedWords]);
  
  const learnCount = Math.min(2, Math.ceil(goal * 0.4));
  const [step, setStep] = useState(0);
  const [phase, setPhase] = useState("learn");
  const [selected, setSelected] = useState(null);
  const [showResult, setShowResult] = useState(false);
  const [correctCount, setCorrectCount] = useState(0);
  const total = sessionWords.length;
  const word = sessionWords[step];

  // FIX: Memoise quiz options per step so they don't reshuffle
  const quizOptionsMap = useMemo(() => {
    return sessionWords.map(w => {
      const others = wordsDB.filter(ow => ow.id !== w.id);
      const wrongDefs = shuffle(others).slice(0, 3).map(ow => ow.definition);
      return shuffle([w.definition, ...wrongDefs]);
    });
  }, [sessionWords, wordsDB]);

  const quizOptions = quizOptionsMap[step] || [];

  const handleAnswer = (opt) => {
    setSelected(opt);
    setShowResult(true);
    const isCorrect = opt === word.definition;
    if (isCorrect) {
      setCorrectCount(c => c + 1);
      updateWord(word.id, { strength: Math.min(5, word.strength + 1), status: word.strength >= 2 ? "familiar" : "learning" });
    } else {
      updateWord(word.id, { strength: Math.max(0, word.strength - 1), status: "learning" });
    }
  };

  const nextWord = () => {
    setSelected(null);
    setShowResult(false);
    if (step < total - 1) {
      setStep(step + 1);
      setPhase(step + 1 < learnCount ? "learn" : "quiz");
    } else {
      setPhase("complete");
      const xp = correctCount * 10 + total * 5;
      completePractice(total, correctCount);
    }
  };

  if (phase === "complete") {
    const xpEarned = correctCount * 10 + total * 5;
    return (
      <>
        <StatusBar />
        <div style={{ padding: "0 24px", position: "relative", zIndex: 1, textAlign: "center", paddingTop: 60 }}>
          <div style={{ fontSize: 64, marginBottom: 16, animation: "breathe 2s ease-in-out infinite" }}>🎉</div>
          <h2 style={{ fontSize: 28, fontFamily: T.serif, fontWeight: 700, color: T.white, marginBottom: 8 }}>Session Complete!</h2>
          <p style={{ fontSize: 14, color: T.muted, marginBottom: 8 }}>Great work, {userPrefs?.name || "Student"}</p>
          <div style={{ display: "flex", justifyContent: "center", gap: 20, margin: "30px 0 40px" }}>
            {[
              { n: total, label: "Words", icon: "📖" },
              { n: `+${xpEarned}`, label: "XP Earned", icon: "⭐" },
              { n: `${correctCount}/${total}`, label: "Accuracy", icon: "🎯" },
            ].map((s) => (
              <div key={s.label} style={{ textAlign: "center" }}>
                <div style={{ fontSize: 28, marginBottom: 4 }}>{s.icon}</div>
                <div style={{ fontSize: 22, fontWeight: 700, color: T.white, fontFamily: T.serif }}>{s.n}</div>
                <div style={{ fontSize: 11, color: T.muted }}>{s.label}</div>
              </div>
            ))}
          </div>
          <Btn onClick={() => onNav("home")}>Back to Home</Btn>
          <div style={{ marginTop: 12 }}>
            <Btn variant="ghost" onClick={() => onNav("quiz")}>Take a Quiz →</Btn>
          </div>
        </div>
      </>
    );
  }

  return (
    <>
      <StatusBar />
      <div style={{ padding: "0 20px", position: "relative", zIndex: 1 }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 16 }}>
          <BackBtn onClick={() => onNav("home")} label="Exit" />
          <span style={{
            fontSize: 11, fontWeight: 600, color: T.accent1,
            background: "rgba(255,107,53,0.12)", padding: "4px 12px", borderRadius: 20,
          }}>{phase === "learn" ? "📖 Learn" : "🧩 Review"}</span>
        </div>
        <div style={{ height: 4, borderRadius: 2, background: "rgba(255,255,255,0.06)", marginBottom: 24, overflow: "hidden" }}>
          <div style={{ height: "100%", borderRadius: 2, width: `${((step + 1) / total) * 100}%`, background: gradient, transition: "width 0.5s ease" }} />
        </div>

        {phase === "learn" ? (
          <div key={`learn-${step}`} style={{ animation: "fadeSlideUp 0.4s ease both" }}>
            <div style={{ textAlign: "center", marginBottom: 20 }}>
              <span style={{ fontSize: 11, color: T.muted, fontWeight: 600, letterSpacing: 1.2, textTransform: "uppercase" }}>New Word</span>
            </div>
            <div style={{
              background: "linear-gradient(145deg, rgba(255,107,53,0.10), rgba(168,85,247,0.06))",
              border: `1px solid rgba(255,107,53,0.15)`, borderRadius: 24, padding: 28, textAlign: "center", marginBottom: 20,
            }}>
              <div style={{ fontSize: 38, fontWeight: 700, fontFamily: T.serif, color: T.white, marginBottom: 6 }}>{word.word}</div>
              <div style={{ display: "flex", alignItems: "center", justifyContent: "center", gap: 8, marginBottom: 16 }}>
                <span style={{ fontSize: 14, color: T.dimmed, fontStyle: "italic", fontFamily: T.serif }}>{word.pronunciation}</span>
                <button onClick={() => speak(word.word)} style={{
                  background: "rgba(168,85,247,0.15)", border: "1px solid rgba(168,85,247,0.2)",
                  borderRadius: 14, padding: "2px 8px", cursor: "pointer", fontSize: 10, color: "#C084FC", fontWeight: 500, fontFamily: T.sans,
                }}>🔊</button>
              </div>
              <div style={{ width: 40, height: 2, background: gradient, borderRadius: 1, margin: "0 auto 16px" }} />
              <div style={{ fontSize: 16, color: "rgba(255,255,255,0.8)", lineHeight: 1.65 }}>{word.definition}</div>
            </div>
            <div style={{ display: "flex", gap: 6, flexWrap: "wrap", justifyContent: "center", marginBottom: 20 }}>
              {word.synonyms.slice(0, 4).map((s, i) => (
                <span key={i} style={{ fontSize: 12, padding: "5px 12px", borderRadius: 20, background: "rgba(255,255,255,0.06)", color: "rgba(255,255,255,0.6)", border: `1px solid ${T.cardBorder}` }}>{s}</span>
              ))}
            </div>
            <div style={{ background: T.card, border: `1px solid ${T.cardBorder}`, borderRadius: 14, padding: 14, marginBottom: 24 }}>
              <div style={{ fontSize: 10, fontWeight: 600, color: T.accent1, letterSpacing: 1, textTransform: "uppercase", marginBottom: 6 }}>In Context</div>
              <div style={{ fontSize: 13, color: "rgba(255,255,255,0.65)", lineHeight: 1.55, fontStyle: "italic" }}>{word.textContext}</div>
            </div>
            <Btn onClick={nextWord}>Got It — Next →</Btn>
          </div>
        ) : (
          <div key={`quiz-${step}`} style={{ animation: "fadeSlideUp 0.4s ease both" }}>
            <div style={{ textAlign: "center", marginBottom: 24 }}>
              <div style={{ fontSize: 28, fontWeight: 700, fontFamily: T.serif, color: T.white, marginBottom: 8 }}>
                What does <span style={{ background: gradient, WebkitBackgroundClip: "text", WebkitTextFillColor: "transparent" }}>{word.word}</span> mean?
              </div>
            </div>
            <div style={{ display: "flex", flexDirection: "column", gap: 10, marginBottom: 24 }}>
              {quizOptions.map((opt, i) => {
                const isCorrect = opt === word.definition;
                const isSelected = selected === opt;
                let bg = T.card, border = T.cardBorder;
                if (showResult && isCorrect) { bg = "rgba(52,199,89,0.12)"; border = "rgba(52,199,89,0.4)"; }
                else if (showResult && isSelected && !isCorrect) { bg = "rgba(255,59,48,0.12)"; border = "rgba(255,59,48,0.4)"; }
                else if (isSelected) { bg = "rgba(255,107,53,0.1)"; border = "rgba(255,107,53,0.3)"; }
                return (
                  <button key={i} onClick={() => !showResult && handleAnswer(opt)} style={{
                    padding: "16px 18px", borderRadius: 14, textAlign: "left",
                    background: bg, border: `1px solid ${border}`, cursor: showResult ? "default" : "pointer",
                    fontSize: 14, color: "rgba(255,255,255,0.8)", fontFamily: T.sans, lineHeight: 1.5, transition: "all 0.2s ease",
                  }}>{opt}</button>
                );
              })}
            </div>
            {showResult && (
              <div style={{ animation: "fadeSlideUp 0.3s ease both" }}>
                <div style={{
                  padding: 16, borderRadius: 14, marginBottom: 16,
                  background: selected === word.definition ? "rgba(52,199,89,0.08)" : "rgba(255,59,48,0.08)",
                  border: `1px solid ${selected === word.definition ? "rgba(52,199,89,0.2)" : "rgba(255,59,48,0.2)"}`,
                }}>
                  <div style={{ fontSize: 14, fontWeight: 600, color: selected === word.definition ? T.green : "#FF3B30", marginBottom: 4 }}>
                    {selected === word.definition ? "Correct! 🎉" : "Not quite 🤔"}
                  </div>
                  <div style={{ fontSize: 13, color: T.muted, lineHeight: 1.5 }}>{word.textContext}</div>
                </div>
                <Btn onClick={nextWord}>{step < total - 1 ? "Next Word →" : "Finish Session 🎉"}</Btn>
              </div>
            )}
          </div>
        )}
      </div>
    </>
  );
}

/* ════════════════════════════════════════════
   SCREEN: QUIZ
   ════════════════════════════════════════════ */
function QuizScreen({ onNav, recordQuizComplete }) {
  const [qIdx, setQIdx] = useState(0);
  const [selected, setSelected] = useState(null);
  const [fillInput, setFillInput] = useState("");
  const [showResult, setShowResult] = useState(false);
  const [score, setScore] = useState(0);
  const [done, setDone] = useState(false);
  const total = QUIZ_QUESTIONS.length;
  const q = QUIZ_QUESTIONS[qIdx];

  const scoreRef = useRef(0);

  const checkAnswer = () => {
    setShowResult(true);
    let correct = false;
    if (q.type === "multiple_choice" && selected === q.correct) { setScore((s) => { scoreRef.current = s + 1; return s + 1; }); correct = true; }
    if (q.type === "fill_blank" && fillInput.trim().toLowerCase() === q.answer.toLowerCase()) { setScore((s) => { scoreRef.current = s + 1; return s + 1; }); correct = true; }
  };

  const next = () => {
    setSelected(null); setFillInput(""); setShowResult(false);
    if (qIdx < total - 1) setQIdx(qIdx + 1);
    else { setDone(true); recordQuizComplete(scoreRef.current, total); }
  };

  if (done) {
    const pct = Math.round((score / total) * 100);
    return (
      <>
        <StatusBar />
        <div style={{ padding: "0 24px", position: "relative", zIndex: 1, textAlign: "center", paddingTop: 60 }}>
          <div style={{ fontSize: 64, marginBottom: 16 }}>{pct >= 80 ? "🏆" : pct >= 50 ? "👏" : "💪"}</div>
          <h2 style={{ fontSize: 28, fontFamily: T.serif, fontWeight: 700, color: T.white, marginBottom: 8 }}>Quiz Complete!</h2>
          <div style={{ fontSize: 48, fontWeight: 700, fontFamily: T.serif, background: gradient, WebkitBackgroundClip: "text", WebkitTextFillColor: "transparent", margin: "20px 0" }}>
            {score}/{total}
          </div>
          <p style={{ fontSize: 14, color: T.muted, marginBottom: 30 }}>{pct}% accuracy · +{score * 15} XP earned</p>
          <Btn onClick={() => { setQIdx(0); setScore(0); setDone(false); }}>Try Again</Btn>
          <div style={{ marginTop: 12 }}><Btn variant="ghost" onClick={() => onNav("home")}>Back to Home</Btn></div>
        </div>
      </>
    );
  }

  return (
    <>
      <StatusBar />
      <div style={{ padding: "0 20px", position: "relative", zIndex: 1 }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 16 }}>
          <BackBtn onClick={() => onNav("home")} label="Exit" />
          <span style={{ fontSize: 13, color: T.muted }}>{qIdx + 1} / {total}</span>
        </div>
        <div style={{ height: 4, borderRadius: 2, background: "rgba(255,255,255,0.06)", marginBottom: 28, overflow: "hidden" }}>
          <div style={{ height: "100%", borderRadius: 2, width: `${((qIdx + 1) / total) * 100}%`, background: gradient, transition: "width 0.5s ease" }} />
        </div>
        <div style={{
          fontSize: 11, fontWeight: 600, color: T.accent3, letterSpacing: 1, textTransform: "uppercase",
          marginBottom: 12, background: "rgba(168,85,247,0.12)", display: "inline-block", padding: "4px 12px", borderRadius: 20,
        }}>
          {q.type === "multiple_choice" ? "Multiple Choice" : "Fill in the Blank"}
        </div>
        <div style={{ fontSize: 20, fontWeight: 700, fontFamily: T.serif, color: T.white, lineHeight: 1.4, marginBottom: 24 }}>{q.question}</div>

        {q.type === "multiple_choice" ? (
          <div style={{ display: "flex", flexDirection: "column", gap: 10, marginBottom: 20 }}>
            {q.options.map((opt, i) => {
              let bg = T.card, border = T.cardBorder, col = "rgba(255,255,255,0.8)";
              if (showResult && i === q.correct) { bg = "rgba(52,199,89,0.12)"; border = "rgba(52,199,89,0.4)"; col = T.green; }
              else if (showResult && selected === i && i !== q.correct) { bg = "rgba(255,59,48,0.12)"; border = "rgba(255,59,48,0.4)"; col = "#FF3B30"; }
              else if (selected === i) { bg = "rgba(255,107,53,0.1)"; border = "rgba(255,107,53,0.3)"; }
              return (
                <button key={i} onClick={() => !showResult && setSelected(i)} style={{
                  padding: "16px 18px", borderRadius: 14, textAlign: "left",
                  background: bg, border: `1px solid ${border}`, cursor: showResult ? "default" : "pointer",
                  fontSize: 14, color: col, fontFamily: T.sans, lineHeight: 1.4, transition: "all 0.2s ease",
                }}>
                  <span style={{ fontWeight: 600, marginRight: 10, color: T.dimmed }}>{String.fromCharCode(65 + i)}.</span>{opt}
                </button>
              );
            })}
          </div>
        ) : (
          <div style={{ marginBottom: 20 }}>
            <input
              type="text" value={fillInput} disabled={showResult}
              onChange={(e) => setFillInput(e.target.value)}
              onKeyDown={(e) => { if (e.key === "Enter" && fillInput.trim()) checkAnswer(); }}
              placeholder="Type your answer..."
              style={{
                width: "100%", padding: "16px 18px", borderRadius: 14,
                background: T.card, border: `1px solid ${showResult ? (fillInput.trim().toLowerCase() === q.answer.toLowerCase() ? "rgba(52,199,89,0.4)" : "rgba(255,59,48,0.4)") : T.cardBorder}`,
                color: T.white, fontSize: 16, fontFamily: T.sans, outline: "none", boxSizing: "border-box", transition: "border 0.2s ease",
              }}
            />
            {!showResult && q.hint && (
              <div style={{ fontSize: 12, color: T.dimmed, marginTop: 8, fontStyle: "italic" }}>💡 Hint: {q.hint}</div>
            )}
          </div>
        )}

        {showResult && (
          <div style={{ padding: 16, borderRadius: 14, marginBottom: 16, animation: "fadeSlideUp 0.3s ease both", background: "rgba(255,255,255,0.04)", border: `1px solid ${T.cardBorder}` }}>
            <div style={{ fontSize: 13, color: "rgba(255,255,255,0.7)", lineHeight: 1.55 }}>{q.explanation}</div>
          </div>
        )}

        {!showResult ? (
          <Btn onClick={checkAnswer} disabled={q.type === "multiple_choice" ? selected === null : !fillInput.trim()}>Check Answer</Btn>
        ) : (
          <Btn onClick={next}>{qIdx < total - 1 ? "Next Question →" : "See Results 🎉"}</Btn>
        )}
      </div>
    </>
  );
}

/* ════════════════════════════════════════════

function JournalScreen({ onNav, entries, setEntries }) {
  entries = entries || [];
  const [editing, setEditing] = useState(null);
  const [newNote, setNewNote] = useState("");
  const [adding, setAdding] = useState(false);
  const [addWord, setAddWord] = useState("");
  const [addNote, setAddNote] = useState("");

  const saveEdit = (idx) => { const updated = [...entries]; updated[idx].note = newNote; setEntries(updated); setEditing(null); };
  const deleteEntry = (idx) => { setEntries(entries.filter((_, i) => i !== idx)); };
  const addEntry = () => {
    if (addWord.trim() && addNote.trim()) {
      setEntries([{ wordId: Date.now(), word: addWord, note: addNote, date: new Date().toLocaleDateString("en-AU",{month:"short",day:"numeric"}) }, ...entries]);
      setAdding(false); setAddWord(""); setAddNote("");
