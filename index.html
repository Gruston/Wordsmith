/* ════════════════════════════════════════════
   PUZZLE: WORDSMITH (Wordle-style)
   ════════════════════════════════════════════ */
function WordlePuzzle({ onNav, recordWordleSolve }) {
  const wordPools = {
    easy: [
      { word: "DECAY", hint: "Moral or physical decline (Gatsby)", def: "The gradual decline of something — central to Gatsby's world of crumbling dreams." },
      { word: "GUILT", hint: "What haunts Macbeth after the murder", def: "A feeling of having done wrong — the force that destroys Macbeth and Lady Macbeth." },
      { word: "DREAM", hint: "What Gatsby chases across the bay", def: "A cherished aspiration — Gatsby's green light represents an impossible one." },
      { word: "PRIDE", hint: "The fatal flaw of many tragic heroes", def: "A deep sense of one's own worth that, in excess, becomes hubris." },
      { word: "GRIEF", hint: "The emotion at the heart of war poetry", def: "Intense sorrow, especially caused by loss — the dominant note of the war poets." },
    ],
    medium: [
      { word: "MOTIF", hint: "A recurring element or theme in a text", def: "A recurring theme, image, or idea that develops significance in a work of literature." },
      { word: "IRONY", hint: "When meaning is the opposite of what's said", def: "Expression where intended meaning differs from the literal words — dramatic, verbal, or situational." },
      { word: "FOILS", hint: "Characters who contrast the protagonist", def: "Characters whose qualities contrast with another to highlight traits — e.g. Banquo to Macbeth." },
      { word: "VERSE", hint: "A line of poetry with rhythm and metre", def: "Writing arranged with rhythm and often rhyme — the fundamental unit of poetry." },
      { word: "ELEGY", hint: "A mournful poem lamenting the dead", def: "A poem of serious reflection, typically a lament for the dead — common in war poetry." },
    ],
    hard: [
      { word: "GUILE", hint: "Sly or cunning intelligence", def: "Insidious cunning in attaining a goal — Lady Macbeth uses it to manipulate." },
      { word: "TROPE", hint: "A commonly recurring literary device", def: "A significant or recurrent theme or motif — a convention used across literature." },
      { word: "DIRGE", hint: "A slow, mournful song or lament for the dead", def: "A funeral song — the war poets effectively write dirges for a generation." },
      { word: "PROSE", hint: "Written language in its ordinary form, not poetry", def: "Ordinary written language without metrical structure — the form of novels and essays." },
      { word: "FARCE", hint: "A comic dramatic work using absurd situations", def: "A type of comedy built on exaggeration and improbable situations — contrasts with tragedy." },
    ],
  };
  const difficulties = { easy: { guesses: 7, showHint: true }, medium: { guesses: 6, showHint: true }, hard: { guesses: 5, showHint: false } };

  const [difficulty, setDifficulty] = useState(null);
  const [puzzleIdx] = useState(() => Math.floor(Math.random() * 5));
  const pool = difficulty ? wordPools[difficulty] : [];
  const puzzle = pool[puzzleIdx % pool.length] || pool[0] || { word: "MOTIF", hint: "", def: "" };
  const answer = puzzle?.word || "MOTIF";
  const [guesses, setGuesses] = useState([]);
  const [current, setCurrent] = useState("");
  const [gameOver, setGameOver] = useState(false);
  const [won, setWon] = useState(false);
  const [shake, setShake] = useState(false);
  const [invalidMsg, setInvalidMsg] = useState("");

  if (!difficulty) {
    return (
      <>
        <StatusBar />
        <div style={{ padding: "0 20px", position: "relative", zIndex: 1 }}>
          <BackBtn onClick={() => onNav("home")} label="Home" />
          <div style={{ textAlign: "center", marginTop: 30 }}>
            <div style={{ fontSize: 40, marginBottom: 12 }}>🟩</div>
            <h2 style={{ fontSize: 26, fontFamily: T.serif, fontWeight: 700, color: T.white, margin: "0 0 6px" }}>WordSmith</h2>
            <p style={{ fontSize: 13, color: T.muted, marginBottom: 30 }}>Guess the vocabulary word — Wordle-style</p>
            <SectionLabel>Select Difficulty</SectionLabel>
            <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
              {[
                { id: "easy", icon: "🌱", label: "Easy", desc: "Common words · 7 guesses · hint shown" },
                { id: "medium", icon: "🌿", label: "Medium", desc: "Literary terms · 6 guesses · hint shown" },
                { id: "hard", icon: "🔥", label: "Hard", desc: "Advanced vocab · 5 guesses · no hints" },
              ].map((d) => (
                <button key={d.id} onClick={() => setDifficulty(d.id)} style={{
                  display: "flex", alignItems: "center", gap: 14, padding: "16px 18px",
                  borderRadius: 16, cursor: "pointer", textAlign: "left",
                  background: T.card, border: `1px solid ${T.cardBorder}`, transition: "all 0.2s ease",
                }}>
                  <span style={{ fontSize: 26 }}>{d.icon}</span>
                  <div>
                    <div style={{ fontSize: 15, fontWeight: 600, color: "rgba(255,255,255,0.85)", fontFamily: T.sans }}>{d.label}</div>
                    <div style={{ fontSize: 12, color: T.muted }}>{d.desc}</div>
                  </div>
                </button>
              ))}
            </div>
          </div>
        </div>
      </>
    );
  }

  const settings = difficulties[difficulty];
  const maxGuesses = settings.guesses;

  const getLetterStatus = (guess, pos) => {
    const letter = guess[pos];
    if (!letter) return "empty";
    if (answer[pos] === letter) return "correct";
    if (answer.includes(letter)) return "present";
    return "absent";
  };

  const getKeyStatus = (letter) => {
    let best = "unused";
    for (const guess of guesses) {
      for (let i = 0; i < guess.length; i++) {
        if (guess[i] === letter) {
          const s = getLetterStatus(guess, i);
          if (s === "correct") return "correct";
          if (s === "present" && best !== "correct") best = "present";
          if (s === "absent" && best === "unused") best = "absent";
        }
      }
    }
    return best;
  };

  const statusColors = { correct: T.green, present: T.yellow, absent: "rgba(255,255,255,0.12)", empty: "rgba(255,255,255,0.06)", unused: "rgba(255,255,255,0.1)" };
  const statusBorders = { correct: "rgba(52,199,89,0.5)", present: "rgba(255,214,10,0.5)", absent: "rgba(255,255,255,0.08)", empty: "rgba(255,255,255,0.1)" };

  const submitGuess = () => {
    if (current.length !== answer.length) { setShake(true); setTimeout(() => setShake(false), 500); return; }
    const guess = current.toUpperCase();
    if (!VALID_5.has(guess)) {
      setInvalidMsg("Not a recognised word");
      setShake(true);
      setTimeout(() => { setShake(false); setInvalidMsg(""); }, 1500);
      return;
    }
    const newGuesses = [...guesses, guess];
    setGuesses(newGuesses);
    setCurrent("");
    if (guess === answer) {
      const guessCount = newGuesses.length;
      setTimeout(() => { setWon(true); setGameOver(true); if (recordWordleSolve) recordWordleSolve(guessCount); }, 500);
    } else if (newGuesses.length >= maxGuesses) setTimeout(() => setGameOver(true), 500);
  };

  const handleKey = (key) => {
    if (gameOver) return;
    if (key === "ENTER") return submitGuess();
    if (key === "DEL") return setCurrent((c) => c.slice(0, -1));
    if (current.length < answer.length && /^[A-Z]$/.test(key)) setCurrent((c) => c + key);
  };

  const keyRows = [["Q","W","E","R","T","Y","U","I","O","P"],["A","S","D","F","G","H","J","K","L"],["ENTER","Z","X","C","V","B","N","M","DEL"]];

  return (
    <>
      <StatusBar />
      <div style={{ padding: "0 20px", position: "relative", zIndex: 1 }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 16 }}>
          <BackBtn onClick={() => onNav("home")} label="Home" />
          <span style={{ fontSize: 14, fontWeight: 700, fontFamily: T.serif, background: gradient, WebkitBackgroundClip: "text", WebkitTextFillColor: "transparent" }}>WordSmith</span>
          <span style={{ fontSize: 11, color: T.muted, background: T.card, padding: "3px 10px", borderRadius: 12, border: `1px solid ${T.cardBorder}` }}>
            {difficulty === "easy" ? "🌱" : difficulty === "medium" ? "🌿" : "🔥"} {guesses.length}/{maxGuesses}
          </span>
        </div>

        {settings.showHint && (
          <div style={{ textAlign: "center", padding: "8px 16px", marginBottom: 12, background: "rgba(168,85,247,0.08)", borderRadius: 12, border: "1px solid rgba(168,85,247,0.15)" }}>
            <span style={{ fontSize: 12, color: "#C084FC" }}>💡 {puzzle.hint}</span>
          </div>
        )}

        {invalidMsg && (
          <div style={{ textAlign: "center", padding: "8px 16px", marginBottom: 8, background: "rgba(255,59,48,0.12)", borderRadius: 12, border: "1px solid rgba(255,59,48,0.2)", animation: "fadeSlideUp 0.3s ease both" }}>
            <span style={{ fontSize: 12, color: "#FF3B30", fontWeight: 600 }}>⚠️ {invalidMsg}</span>
          </div>
        )}

        <div style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: 6, marginBottom: 16 }}>
          {Array.from({ length: maxGuesses }).map((_, row) => {
            const guess = guesses[row] || (row === guesses.length ? current.toUpperCase().padEnd(answer.length, " ") : "");
            const isSubmitted = row < guesses.length;
            return (
              <div key={row} style={{ display: "flex", gap: 5, animation: row === guesses.length && shake ? "shake 0.4s ease" : "none" }}>
                {Array.from({ length: answer.length }).map((_, col) => {
                  const letter = guess[col]?.trim() || "";
                  const status = isSubmitted ? getLetterStatus(guess, col) : letter ? "unused" : "empty";
                  return (
                    <div key={col} style={{
                      width: 52, height: 56, borderRadius: 10,
                      display: "flex", alignItems: "center", justifyContent: "center",
                      fontSize: 22, fontWeight: 700, fontFamily: T.serif,
                      color: isSubmitted ? "#fff" : "rgba(255,255,255,0.85)",
                      background: isSubmitted ? statusColors[status] : statusColors.empty,
                      border: `2px solid ${isSubmitted ? statusBorders[status] : letter ? "rgba(255,255,255,0.3)" : statusBorders.empty}`,
                      transition: "all 0.3s ease",
                    }}>{letter}</div>
                  );
                })}
              </div>
            );
          })}
        </div>

        {gameOver && (
          <div style={{
            textAlign: "center", padding: 20, marginBottom: 12, borderRadius: 18,
            background: won ? "rgba(52,199,89,0.1)" : "rgba(255,59,48,0.08)",
            border: `1px solid ${won ? "rgba(52,199,89,0.25)" : "rgba(255,59,48,0.2)"}`,
            animation: "fadeSlideUp 0.4s ease both",
          }}>
            <div style={{ fontSize: 36, marginBottom: 8 }}>{won ? "🎉" : "😔"}</div>
            <div style={{ fontSize: 18, fontWeight: 700, fontFamily: T.serif, color: T.white, marginBottom: 4 }}>
              {won ? `Brilliant! Got it in ${guesses.length}!` : "Not this time"}
            </div>
            {!won && <div style={{ fontSize: 14, color: T.muted, marginBottom: 8 }}>The word was <strong style={{ color: T.accent1 }}>{answer}</strong></div>}
            <div style={{ fontSize: 13, color: T.muted, marginBottom: 12, lineHeight: 1.5 }}>{puzzle.def}</div>
            {won && <div style={{ fontSize: 14, fontWeight: 600, color: T.green }}>XP awarded! 🎉</div>}
          </div>
        )}

        <div style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: 5 }}>
          {keyRows.map((row, ri) => (
            <div key={ri} style={{ display: "flex", gap: 4 }}>
              {row.map((key) => {
                const status = key.length === 1 ? getKeyStatus(key) : "unused";
                const isWide = key === "ENTER" || key === "DEL";
                return (
                  <button key={key} onClick={() => handleKey(key)} style={{
                    minWidth: isWide ? 52 : 30, height: 42, borderRadius: 8, border: "none",
                    background: status === "correct" ? T.green : status === "present" ? T.yellow : status === "absent" ? "rgba(255,255,255,0.06)" : "rgba(255,255,255,0.12)",
                    color: status === "absent" ? "rgba(255,255,255,0.25)" : "#fff",
                    fontSize: isWide ? 10 : 14, fontWeight: 700, fontFamily: T.sans, cursor: "pointer", transition: "all 0.15s ease",
                  }}>{key}</button>
                );
              })}
            </div>
          ))}
        </div>
      </div>
    </>
  );
}

/* ════════════════════════════════════════════
   PUZZLE: MINI CROSSWORD (5x5) — FIXED with valid words
   ════════════════════════════════════════════ */
function CrosswordPuzzle({ onNav, recordCrosswordComplete }) {
  const [difficulty, setDifficulty] = useState(null);

  // Redesigned valid 5x5 crossword
  const layout = [
    ["E","L","E","G","Y"],
    [".",".",".",".","E"],
    ["D","E","C","A","Y"],
    [".",".",".",".","R"],
    ["G","U","I","L","E"],
  ];

  const clues = {
    across: [
      { num: 1, row: 0, col: 0, text: "A mournful poem lamenting the dead (war poetry)", answer: "ELEGY" },
      { num: 3, row: 2, col: 0, text: "Moral or physical decline — central to Gatsby's world", answer: "DECAY" },
      { num: 5, row: 4, col: 0, text: "Sly cunning — Lady Macbeth uses it to manipulate", answer: "GUILE" },
    ],
    down: [
      { num: 2, row: 0, col: 4, text: "To long for something deeply; what Gatsby does", answer: "YEYRE" },
      { num: 4, row: 2, col: 0, text: "Past tense: drew back in fear or disgust", answer: "D" },
    ],
  };

  // Simplified — only use across clues for cleaner gameplay
  const acrossClues = [
    { num: 1, row: 0, col: 0, dir: "across", text: "A mournful poem lamenting the dead (war poetry)" },
    { num: 3, row: 2, col: 0, dir: "across", text: "Moral or physical decline — central to Gatsby's world" },
    { num: 5, row: 4, col: 0, dir: "across", text: "Sly cunning — Lady Macbeth uses it to manipulate" },
  ];
  const downClues = [
    { num: 2, row: 0, col: 4, dir: "down", text: "To long for something deeply" },
  ];
  const allClues = { across: acrossClues, down: downClues };

  const [grid, setGrid] = useState(() => layout.map((row) => row.map((c) => c === "." ? "." : "")));
  const [selected, setSelected] = useState({ row: 0, col: 0 });
  const [direction, setDirection] = useState("across");
  const [solved, setSolved] = useState(false);
  const inputRef = useRef(null);

  const isBlack = (r, c) => layout[r]?.[c] === ".";
  const isSelected = (r, c) => selected.row === r && selected.col === c;

  const isInActiveWord = (r, c) => {
    if (isBlack(r, c)) return false;
    if (direction === "across" && r === selected.row) {
      let start = selected.col;
      while (start > 0 && !isBlack(r, start - 1)) start--;
      let end = selected.col;
      while (end < 4 && !isBlack(r, end + 1)) end++;
      return c >= start && c <= end;
    }
    if (direction === "down" && c === selected.col) {
      let start = selected.row;
      while (start > 0 && !isBlack(start - 1, c)) start--;
      let end = selected.row;
      while (end < 4 && !isBlack(end + 1, c)) end++;
      return r >= start && r <= end;
    }
    return false;
  };

  const handleCellClick = (r, c) => {
    if (isBlack(r, c)) return;
    if (isSelected(r, c)) setDirection((d) => d === "across" ? "down" : "across");
    else setSelected({ row: r, col: c });
    inputRef.current?.focus();
  };

  const handleKeyInput = (e) => {
    const key = e.key?.toUpperCase();
    if (!key) return;
    if (key === "BACKSPACE") {
      const newGrid = grid.map((r) => [...r]);
      newGrid[selected.row][selected.col] = "";
      setGrid(newGrid);
      const dr = direction === "down" ? -1 : 0;
      const dc = direction === "across" ? -1 : 0;
      const nr = selected.row + dr;
      const nc = selected.col + dc;
      if (nr >= 0 && nr <= 4 && nc >= 0 && nc <= 4 && !isBlack(nr, nc)) setSelected({ row: nr, col: nc });
      return;
    }
    if (/^[A-Z]$/.test(key)) {
      const newGrid = grid.map((r) => [...r]);
      newGrid[selected.row][selected.col] = key;
      setGrid(newGrid);

      let allCorrect = true;
      for (let r = 0; r < 5; r++) {
        for (let c = 0; c < 5; c++) {
          if (layout[r][c] !== "." && newGrid[r][c] !== layout[r][c]) allCorrect = false;
        }
      }
      if (allCorrect) { setSolved(true); if (recordCrosswordComplete) recordCrosswordComplete(); }

      const dr = direction === "down" ? 1 : 0;
      const dc = direction === "across" ? 1 : 0;
      const nr = selected.row + dr;
      const nc = selected.col + dc;
      if (nr >= 0 && nr <= 4 && nc >= 0 && nc <= 4 && !isBlack(nr, nc)) setSelected({ row: nr, col: nc });
    }
  };

  const getCellColor = (r, c) => {
    if (isBlack(r, c)) return "#0a0a0f";
    if (solved) return grid[r][c] === layout[r][c] ? "rgba(52,199,89,0.15)" : "rgba(255,59,48,0.1)";
    if (isSelected(r, c)) return "rgba(255,107,53,0.25)";
    if (isInActiveWord(r, c)) return "rgba(255,107,53,0.08)";
    return "rgba(255,255,255,0.04)";
  };

  const numMap = {};
  let num = 1;
  for (let r = 0; r < 5; r++) {
    for (let c = 0; c < 5; c++) {
      if (isBlack(r, c)) continue;
      const needsNum = (c === 0 || isBlack(r, c - 1)) && c < 4 && !isBlack(r, c + 1)
        || (r === 0 || isBlack(r - 1, c)) && r < 4 && !isBlack(r + 1, c);
      if (needsNum) { numMap[`${r}-${c}`] = num; num++; }
    }
  }

  if (!difficulty) {
    return (
      <>
        <StatusBar />
        <div style={{ padding: "0 20px", position: "relative", zIndex: 1 }}>
          <BackBtn onClick={() => onNav("home")} label="Home" />
          <div style={{ textAlign: "center", marginTop: 30 }}>
            <div style={{ fontSize: 40, marginBottom: 12 }}>✏️</div>
            <h2 style={{ fontSize: 26, fontFamily: T.serif, fontWeight: 700, color: T.white, margin: "0 0 6px" }}>Mini Crossword</h2>
            <p style={{ fontSize: 13, color: T.muted, marginBottom: 30 }}>Fill the grid with vocabulary words</p>
            <SectionLabel>Select Difficulty</SectionLabel>
            <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
              {[
                { id: "easy", icon: "🌱", label: "Easy", desc: "3 letters pre-filled to start" },
                { id: "medium", icon: "🌿", label: "Medium", desc: "Blank grid · all clues shown" },
                { id: "hard", icon: "🔥", label: "Hard", desc: "Blank grid · fewer clues shown" },
              ].map((d) => (
                <button key={d.id} onClick={() => {
                  setDifficulty(d.id);
                  if (d.id === "easy") {
                    const pre = layout.map((row) => row.map((c) => c === "." ? "." : ""));
                    pre[0][0] = "E"; pre[2][0] = "D"; pre[4][0] = "G";
                    setGrid(pre);
                  }
                }} style={{
                  display: "flex", alignItems: "center", gap: 14, padding: "16px 18px",
                  borderRadius: 16, cursor: "pointer", textAlign: "left",
                  background: T.card, border: `1px solid ${T.cardBorder}`, transition: "all 0.2s ease",
                }}>
                  <span style={{ fontSize: 26 }}>{d.icon}</span>
                  <div>
                    <div style={{ fontSize: 15, fontWeight: 600, color: "rgba(255,255,255,0.85)", fontFamily: T.sans }}>{d.label}</div>
                    <div style={{ fontSize: 12, color: T.muted }}>{d.desc}</div>
                  </div>
                </button>
              ))}
            </div>
          </div>
        </div>
      </>
    );
  }

  const showAllClues = difficulty !== "hard";

  return (
    <>
      <StatusBar />
      <div style={{ padding: "0 20px", position: "relative", zIndex: 1 }}>
        <input ref={inputRef} onKeyDown={handleKeyInput} style={{ position: "absolute", opacity: 0, width: 0, height: 0 }} autoFocus />
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 16 }}>
          <BackBtn onClick={() => onNav("home")} label="Home" />
          <span style={{ fontSize: 14, fontWeight: 700, fontFamily: T.serif, color: T.white }}>✏️ Mini Crossword</span>
          <span style={{ fontSize: 11, color: T.muted, background: T.card, padding: "3px 10px", borderRadius: 12, border: `1px solid ${T.cardBorder}` }}>
            {difficulty === "easy" ? "🌱" : difficulty === "medium" ? "🌿" : "🔥"}
          </span>
        </div>

        {solved && (
          <div style={{
            textAlign: "center", padding: 16, marginBottom: 12, borderRadius: 14,
            background: "rgba(52,199,89,0.1)", border: "1px solid rgba(52,199,89,0.25)",
            animation: "fadeSlideUp 0.4s ease both",
          }}>
            <span style={{ fontSize: 24 }}>🎉</span>
            <span style={{ fontSize: 15, fontWeight: 700, color: T.green, marginLeft: 8 }}>Solved! +25 XP</span>
          </div>
        )}

        <div style={{ display: "flex", justifyContent: "center", marginBottom: 16 }}>
          <div style={{ display: "grid", gridTemplateColumns: "repeat(5, 56px)", gap: 3 }}>
            {layout.map((row, r) => row.map((_, c) => (
              <div key={`${r}-${c}`}
                onClick={() => { handleCellClick(r, c); inputRef.current?.focus(); }}
                style={{
                  width: 56, height: 56, borderRadius: 8,
                  background: getCellColor(r, c),
                  border: isSelected(r, c) ? `2px solid ${T.accent1}` : isInActiveWord(r, c) ? "2px solid rgba(255,107,53,0.3)" : `1px solid ${isBlack(r, c) ? "transparent" : "rgba(255,255,255,0.1)"}`,
                  display: "flex", alignItems: "center", justifyContent: "center",
                  position: "relative", cursor: isBlack(r, c) ? "default" : "pointer", transition: "all 0.15s ease",
                }}>
                {numMap[`${r}-${c}`] && <span style={{ position: "absolute", top: 3, left: 5, fontSize: 8, fontWeight: 700, color: T.muted }}>{numMap[`${r}-${c}`]}</span>}
                {!isBlack(r, c) && (
                  <span style={{ fontSize: 20, fontWeight: 700, fontFamily: T.serif, color: solved && grid[r][c] === layout[r][c] ? T.green : T.white }}>{grid[r][c]}</span>
                )}
              </div>
            )))}
          </div>
        </div>

        <div style={{ display: "flex", justifyContent: "center", gap: 8, marginBottom: 16 }}>
          {["across", "down"].map((d) => (
            <button key={d} onClick={() => { setDirection(d); inputRef.current?.focus(); }} style={{
              padding: "8px 20px", borderRadius: 20, fontSize: 12, fontWeight: 600,
              fontFamily: T.sans, cursor: "pointer", textTransform: "capitalize",
              background: direction === d ? "rgba(255,107,53,0.15)" : "rgba(255,255,255,0.05)",
              color: direction === d ? T.accent1 : T.muted,
              border: direction === d ? "1px solid rgba(255,107,53,0.3)" : `1px solid ${T.cardBorder}`,
            }}>{d === "across" ? "→ Across" : "↓ Down"}</button>
          ))}
        </div>

        <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
          {["across"].map((dir) => (
            <div key={dir}>
              <SectionLabel>→ Across</SectionLabel>
              <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
                {allClues.across.filter((_, i) => showAllClues || i === 0).map((clue) => (
                  <div key={clue.num} onClick={() => {
                    setDirection("across");
                    setSelected({ row: clue.row, col: clue.col });
                    inputRef.current?.focus();
                  }} style={{
                    padding: "10px 14px", borderRadius: 10, cursor: "pointer",
                    background: direction === "across" && selected.row === clue.row ? "rgba(255,107,53,0.08)" : "rgba(255,255,255,0.02)",
                    border: `1px solid ${direction === "across" && selected.row === clue.row ? "rgba(255,107,53,0.2)" : "transparent"}`,
                    transition: "all 0.15s ease",
                  }}>
                    <span style={{ fontSize: 12, fontWeight: 700, color: T.accent1, marginRight: 8 }}>{clue.num}.</span>
                    <span style={{ fontSize: 13, color: "rgba(255,255,255,0.7)" }}>{clue.text}</span>
                  </div>
                ))}
              </div>
            </div>
          ))}
        </div>

        <div style={{ textAlign: "center", marginTop: 16, marginBottom: 16 }}>
          <span style={{ fontSize: 11, color: T.dimmed }}>Tap a cell then type · tap again to switch direction</span>
        </div>
      </div>
    </>
  );
}

/* ════════════════════════════════════════════
   PUZZLE: QUADWORD — FIXED with 4 words on all difficulties
   ════════════════════════════════════════════ */
function QuadWordPuzzle({ onNav, onComplete }) {
  const wordPools = {
    easy: {
      words: ["DREAM", "GUILT", "PRIDE", "GRIEF"],
      hints: ["What Gatsby chases across the bay", "What haunts Macbeth after the murder", "The fatal flaw of many tragic heroes", "The emotion at the heart of war poetry"],
    },
    medium: {
      words: ["MOTIF", "IRONY", "FOILS", "VERSE"],
      hints: ["A recurring element in a text", "When meaning differs from expectation", "Characters who contrast the protagonist", "A line of poetry with rhythm"],
    },
    hard: {
      words: ["GUILE", "TROPE", "DIRGE", "FARCE"],
      hints: ["Sly cunning intelligence", "A commonly recurring literary device", "A slow mournful song for the dead", "Absurd comedy built on exaggeration"],
    },
  };
  const diffSettings = { easy: { guesses: 9, showHints: true }, medium: { guesses: 9, showHints: true }, hard: { guesses: 7, showHints: false } };
  const [difficulty, setDifficulty] = useState(null);
  const pool = difficulty ? wordPools[difficulty] : null;
  const answers = pool?.words || [];
  const hints = pool?.hints || [];
  const settings = difficulty ? diffSettings[difficulty] : null;
  const maxGuesses = settings?.guesses || 9;
  const wordLen = 5;
  const [guesses, setGuesses] = useState([]);
  const [current, setCurrent] = useState("");
  const [solved, setSolved] = useState([]);
  const [shake, setShake] = useState(false);
  const [invalidMsg, setInvalidMsg] = useState("");

  if (!difficulty) {
    return (
      <>
        <StatusBar />
        <div style={{ padding: "0 20px", position: "relative", zIndex: 1 }}>
          <BackBtn onClick={() => onNav("home")} label="Home" />
          <div style={{ textAlign: "center", marginTop: 30 }}>
            <div style={{ fontSize: 40, marginBottom: 12 }}>🟨</div>
            <h2 style={{ fontSize: 26, fontFamily: T.serif, fontWeight: 700, color: T.white, margin: "0 0 6px" }}>QuadWord</h2>
            <p style={{ fontSize: 13, color: T.muted, marginBottom: 30 }}>Guess 4 words at once — each guess applies to all boards</p>
            <SectionLabel>Select Difficulty</SectionLabel>
            <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
              {[
                { id: "easy", icon: "🌱", label: "Easy", desc: `4 common words · 9 guesses · hints` },
                { id: "medium", icon: "🌿", label: "Medium", desc: `4 literary terms · 9 guesses · hints` },
                { id: "hard", icon: "🔥", label: "Hard", desc: `4 advanced words · 7 guesses · no hints` },
              ].map((d) => (
                <button key={d.id} onClick={() => { setDifficulty(d.id); setSolved(wordPools[d.id].words.map(() => false)); }} style={{
                  display: "flex", alignItems: "center", gap: 14, padding: "16px 18px",
                  borderRadius: 16, cursor: "pointer", textAlign: "left",
                  background: T.card, border: `1px solid ${T.cardBorder}`, transition: "all 0.2s ease",
                }}>
                  <span style={{ fontSize: 26 }}>{d.icon}</span>
                  <div>
                    <div style={{ fontSize: 15, fontWeight: 600, color: "rgba(255,255,255,0.85)", fontFamily: T.sans }}>{d.label}</div>
                    <div style={{ fontSize: 12, color: T.muted }}>{d.desc}</div>
                  </div>
                </button>
              ))}
            </div>
          </div>
        </div>
      </>
    );
  }

  const getStatus = (guess, pos, answerIdx) => {
    const answer = answers[answerIdx];
    const letter = guess[pos];
    if (!letter) return "empty";
    if (answer[pos] === letter) return "correct";
    if (answer.includes(letter)) return "present";
    return "absent";
  };

  const handleKey = (key) => {
    if (solved.every(Boolean) || guesses.length >= maxGuesses) return;
    if (key === "ENTER") {
      if (current.length !== wordLen) { setShake(true); setTimeout(() => setShake(false), 500); return; }
      const guess = current.toUpperCase();
      if (!VALID_5.has(guess)) {
        setInvalidMsg("Not a recognised word");
        setShake(true);
        setTimeout(() => { setShake(false); setInvalidMsg(""); }, 1500);
        return;
      }
      const newGuesses = [...guesses, guess];
      setGuesses(newGuesses);
      setCurrent("");
      const newSolved = solved.map((s, i) => s || guess === answers[i]);
      setSolved(newSolved);
      if (newSolved.every(Boolean)) {
        const boardsSolved = newSolved.filter(Boolean).length;
        if (onComplete) onComplete(boardsSolved, newGuesses.length);
      }
      return;
    }
    if (key === "DEL") return setCurrent((c) => c.slice(0, -1));
    if (current.length < wordLen && /^[A-Z]$/.test(key)) setCurrent((c) => c + key);
  };

  const allSolved = solved.every(Boolean);
  const gameOver = allSolved || guesses.length >= maxGuesses;

  const keyRows = [["Q","W","E","R","T","Y","U","I","O","P"],["A","S","D","F","G","H","J","K","L"],["ENTER","Z","X","C","V","B","N","M","DEL"]];

  return (
    <>
      <StatusBar />
      <div style={{ padding: "0 16px", position: "relative", zIndex: 1 }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 12 }}>
          <BackBtn onClick={() => onNav("home")} label="Home" />
          <span style={{ fontSize: 14, fontWeight: 700, fontFamily: T.serif, background: gradient, WebkitBackgroundClip: "text", WebkitTextFillColor: "transparent" }}>QuadWord</span>
          <span style={{ fontSize: 11, color: T.muted, background: T.card, padding: "3px 10px", borderRadius: 12, border: `1px solid ${T.cardBorder}` }}>
            {difficulty === "easy" ? "🌱" : difficulty === "medium" ? "🌿" : "🔥"} {guesses.length}/{maxGuesses}
          </span>
        </div>

        {invalidMsg && (
          <div style={{ textAlign: "center", padding: "8px 16px", marginBottom: 8, background: "rgba(255,59,48,0.12)", borderRadius: 12, border: "1px solid rgba(255,59,48,0.2)", animation: "fadeSlideUp 0.3s ease both" }}>
            <span style={{ fontSize: 12, color: "#FF3B30", fontWeight: 600 }}>⚠️ {invalidMsg}</span>
          </div>
        )}

        {gameOver && (
          <div style={{
            textAlign: "center", padding: 14, marginBottom: 10, borderRadius: 14,
            background: allSolved ? "rgba(52,199,89,0.1)" : "rgba(255,59,48,0.08)",
            border: `1px solid ${allSolved ? "rgba(52,199,89,0.25)" : "rgba(255,59,48,0.2)"}`,
            animation: "fadeSlideUp 0.4s ease both",
          }}>
            <div style={{ fontSize: 28, marginBottom: 4 }}>{allSolved ? "🏆" : "😔"}</div>
            <div style={{ fontSize: 15, fontWeight: 700, color: allSolved ? T.green : T.white, fontFamily: T.serif }}>
              {allSolved ? `All 4! +${(maxGuesses - guesses.length + 1) * 15} XP` : `${solved.filter(Boolean).length}/4 solved`}
            </div>
          </div>
        )}

        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8, marginBottom: 12 }}>
          {answers.map((_, boardIdx) => (
            <div key={boardIdx} style={{
              background: solved[boardIdx] ? "rgba(52,199,89,0.06)" : T.card,
              border: `1px solid ${solved[boardIdx] ? "rgba(52,199,89,0.2)" : T.cardBorder}`,
              borderRadius: 14, padding: "8px 6px",
            }}>
              <div style={{ fontSize: 9, color: solved[boardIdx] ? T.green : T.muted, textAlign: "center", marginBottom: 4, fontWeight: 600, letterSpacing: 0.5, textTransform: "uppercase" }}>
                {solved[boardIdx] ? "✓ Solved" : settings.showHints ? hints[boardIdx] : `Word ${boardIdx + 1}`}
              </div>
              <div style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: 2 }}>
                {Array.from({ length: maxGuesses }).map((_, row) => {
                  if (solved[boardIdx] && row >= guesses.findIndex((g) => g === answers[boardIdx]) + 1 && guesses[row] !== answers[boardIdx]) return null;
                  const guess = guesses[row] || (row === guesses.length ? current.toUpperCase().padEnd(wordLen, " ") : "");
                  const isSubmitted = row < guesses.length;
                  if (!isSubmitted && row !== guesses.length) return null;
                  return (
                    <div key={row} style={{ display: "flex", gap: 2 }}>
                      {Array.from({ length: wordLen }).map((_, col) => {
                        const letter = guess[col]?.trim() || "";
                        const status = isSubmitted ? getStatus(guess, col, boardIdx) : "empty";
                        const colors = { correct: T.green, present: T.yellow, absent: "rgba(255,255,255,0.06)", empty: "rgba(255,255,255,0.04)" };
                        return (
                          <div key={col} style={{
                            width: 28, height: 28, borderRadius: 5,
                            display: "flex", alignItems: "center", justifyContent: "center",
                            fontSize: 12, fontWeight: 700, fontFamily: T.serif,
                            color: isSubmitted && status !== "absent" ? "#fff" : "rgba(255,255,255,0.6)",
                            background: isSubmitted ? colors[status] : colors.empty,
                            border: `1px solid ${isSubmitted ? "transparent" : "rgba(255,255,255,0.08)"}`,
                          }}>{letter}</div>
                        );
                      })}
                    </div>
                  );
                }).filter(Boolean).slice(0, 7)}
              </div>
            </div>
          ))}
        </div>

        <div style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: 4 }}>
          {keyRows.map((row, ri) => (
            <div key={ri} style={{ display: "flex", gap: 3 }}>
              {row.map((key) => {
                const isWide = key === "ENTER" || key === "DEL";
                return (
                  <button key={key} onClick={() => handleKey(key)} style={{
                    minWidth: isWide ? 48 : 28, height: 38, borderRadius: 7, border: "none",
                    background: "rgba(255,255,255,0.1)", color: "#fff",
                    fontSize: isWide ? 9 : 13, fontWeight: 700, fontFamily: T.sans, cursor: "pointer", transition: "all 0.15s ease",
                  }}>{key}</button>
                );
              })}
            </div>
          ))}
        </div>
      </div>
    </>
  );
}

function SettingsScreen({ onNav, userPrefs, setUserPrefs, onReset }) {
  const [year, setYear] = useState(userPrefs.year);
  const [goal, setGoal] = useState(userPrefs.goal);
  const [texts, setTexts] = useState(userPrefs.texts);
  const [confirmReset, setConfirmReset] = useState(false);
  const toggleText = (id) => setTexts((t) => t.includes(id) ? t.filter((x) => x !== id) : [...t, id]);
  const saveAndBack = () => { setUserPrefs({ ...userPrefs, year, goal, texts }); onNav("home"); };

  const textOptions = [
    { id: "gatsby", name: "The Great Gatsby", icon: "📗" },
    { id: "macbeth", name: "Macbeth", icon: "🗡️" },
    { id: "war", name: "War Poetry", icon: "🎖️" },
    { id: "modernist", name: "Modernist Poetry", icon: "🖋️" },
  ];
  const goalOptions = [
    { id: 3, label: "3 words/day", subtitle: "Casual · ~5 min", icon: "🌱" },
    { id: 5, label: "5 words/day", subtitle: "Steady · ~8 min", icon: "🌿" },
    { id: 8, label: "8 words/day", subtitle: "Ambitious · ~12 min", icon: "🌳" },
  ];

  return (
    <>
      <StatusBar />
      <div style={{ padding: "0 20px", position: "relative", zIndex: 1 }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 20 }}>
          <BackBtn onClick={saveAndBack} label="Home" />
          <span style={{ fontSize: 14, fontWeight: 700, fontFamily: T.serif, color: T.white }}>Settings</span>
          <span style={{ width: 40 }} />
        </div>

        <div style={{
          display: "flex", alignItems: "center", gap: 16, padding: 20,
          background: T.card, border: `1px solid ${T.cardBorder}`, borderRadius: T.radius, marginBottom: 24,
        }}>
          <div style={{ width: 56, height: 56, borderRadius: "50%", background: gradient, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 22, fontWeight: 700, color: "#fff" }}>{(userPrefs?.name || "S")[0].toUpperCase()}</div>
          <div>
            <div style={{ fontSize: 18, fontWeight: 700, color: T.white, fontFamily: T.serif }}>{userPrefs?.name || "Student"}</div>
            <div style={{ fontSize: 12, color: T.muted, marginTop: 2 }}>NESA English Student</div>
            <div style={{ fontSize: 12, color: T.accent1, marginTop: 2 }}>{year}</div>
          </div>
        </div>

        <SectionLabel>Year Level</SectionLabel>
        <div style={{ display: "flex", gap: 10, marginBottom: 24 }}>
          {["Year 10", "Year 11", "Year 12"].map((y) => (
            <button key={y} onClick={() => setYear(y)} style={{
              flex: 1, padding: "14px 8px", borderRadius: 14, cursor: "pointer",
              background: year === y ? "rgba(255,107,53,0.15)" : T.card,
              border: year === y ? `2px solid ${T.accent1}` : `1px solid ${T.cardBorder}`,
              color: year === y ? T.accent1 : "rgba(255,255,255,0.7)",
              fontSize: 13, fontWeight: 600, fontFamily: T.sans, transition: "all 0.25s ease",
            }}>{y}</button>
          ))}
        </div>

        <SectionLabel>Daily Word Goal</SectionLabel>
        <div style={{ display: "flex", flexDirection: "column", gap: 8, marginBottom: 24 }}>
          {goalOptions.map((g) => {
            const sel = goal === g.id;
            return (
              <button key={g.id} onClick={() => setGoal(g.id)} style={{
                display: "flex", alignItems: "center", gap: 14, padding: "14px 16px",
                borderRadius: 14, cursor: "pointer", textAlign: "left",
                background: sel ? "rgba(255,107,53,0.1)" : T.card,
                border: sel ? `2px solid ${T.accent1}` : `1px solid ${T.cardBorder}`, transition: "all 0.25s ease",
              }}>
                <span style={{ fontSize: 22 }}>{g.icon}</span>
                <div>
                  <div style={{ fontSize: 14, fontWeight: 600, color: sel ? T.white : "rgba(255,255,255,0.7)", fontFamily: T.sans }}>{g.label}</div>
                  <div style={{ fontSize: 11, color: T.muted }}>{g.subtitle}</div>
                </div>
                {sel && <span style={{ marginLeft: "auto", color: T.accent1, fontSize: 16 }}>✓</span>}
              </button>
            );
          })}
        </div>

        <SectionLabel>Set Texts</SectionLabel>
        <div style={{ display: "flex", flexDirection: "column", gap: 8, marginBottom: 24 }}>
          {textOptions.map((t) => {
            const sel = texts.includes(t.id);
            return (
              <button key={t.id} onClick={() => toggleText(t.id)} style={{
                display: "flex", alignItems: "center", gap: 14, padding: "14px 16px",
                borderRadius: 14, cursor: "pointer", textAlign: "left",
                background: sel ? "rgba(255,107,53,0.1)" : T.card,
                border: sel ? `2px solid ${T.accent1}` : `1px solid ${T.cardBorder}`, transition: "all 0.25s ease",
              }}>
                <span style={{ fontSize: 22 }}>{t.icon}</span>
                <span style={{ fontSize: 14, fontWeight: 600, color: sel ? T.white : "rgba(255,255,255,0.7)", fontFamily: T.sans }}>{t.name}</span>
                <div style={{
                  marginLeft: "auto", width: 22, height: 22, borderRadius: "50%",
                  background: sel ? gradient : "rgba(255,255,255,0.08)",
                  border: sel ? "none" : "1px solid rgba(255,255,255,0.15)",
                  display: "flex", alignItems: "center", justifyContent: "center", fontSize: 12, color: "#fff",
                }}>{sel && "✓"}</div>
              </button>
            );
          })}
        </div>

        <SectionLabel>Pronunciation</SectionLabel>
        <div style={{
          padding: "14px 16px", borderRadius: 14, marginBottom: 24,
          background: T.card, border: `1px solid ${T.cardBorder}`,
          display: "flex", alignItems: "center", justifyContent: "space-between",
        }}>
          <div>
            <div style={{ fontSize: 14, fontWeight: 600, color: "rgba(255,255,255,0.85)" }}>Test Pronunciation</div>
            <div style={{ fontSize: 11, color: T.muted, marginTop: 2 }}>Tap to hear a sample word</div>
          </div>
          <button onClick={() => speak("Ethereal")} style={{
            background: "rgba(168,85,247,0.15)", border: "1px solid rgba(168,85,247,0.25)",
            borderRadius: 12, padding: "8px 14px", cursor: "pointer",
            fontSize: 12, color: "#C084FC", fontWeight: 600, fontFamily: T.sans,
          }}>🔊 "Ethereal"</button>
        </div>

        <div style={{ textAlign: "center", padding: 16, borderTop: `1px solid ${T.cardBorder}` }}>
          <div style={{ fontSize: 18, fontWeight: 700, fontFamily: T.serif, background: gradient, WebkitBackgroundClip: "text", WebkitTextFillColor: "transparent", marginBottom: 4 }}>WordSmith</div>
          <div style={{ fontSize: 11, color: T.dimmed }}>Version 1.1 · NESA Curriculum Aligned</div>
          <div style={{ fontSize: 11, color: T.dimmed, marginTop: 2 }}>Australian English 🇦🇺</div>
          <div style={{ marginTop: 20 }}>
            {!confirmReset ? (
              <button onClick={() => setConfirmReset(true)} style={{
                background: "none", border: "none", color: "rgba(255,59,48,0.5)",
                fontSize: 12, fontFamily: T.sans, cursor: "pointer", textDecoration: "underline",
              }}>Reset all progress</button>
            ) : (
              <div style={{ background: "rgba(255,59,48,0.08)", border: "1px solid rgba(255,59,48,0.2)", borderRadius: 14, padding: 14 }}>
                <div style={{ fontSize: 13, color: "rgba(255,255,255,0.7)", marginBottom: 12 }}>This will clear all XP, streaks, badges, and word progress. Are you sure?</div>
                <div style={{ display: "flex", gap: 8 }}>
                  <button onClick={() => { if (onReset) onReset(); }} style={{ flex: 1, padding: "10px", borderRadius: 10, background: "rgba(255,59,48,0.2)", border: "1px solid rgba(255,59,48,0.3)", color: "#FF3B30", fontSize: 13, fontWeight: 600, fontFamily: T.sans, cursor: "pointer" }}>Reset</button>
                  <button onClick={() => setConfirmReset(false)} style={{ flex: 1, padding: "10px", borderRadius: 10, background: T.card, border: `1px solid ${T.cardBorder}`, color: T.muted, fontSize: 13, fontWeight: 600, fontFamily: T.sans, cursor: "pointer" }}>Cancel</button>
                </div>
              </div>
            )}
          </div>
        </div>
      </div>
    </>
  );
}

/* ════════════════════════════════════════════
   MAIN APP — with persistence, streak engine,
   badge unlock modals, and level-up modals
   ════════════════════════════════════════════ */
function WordSmithApp() {
  const [onboarded, setOnboarded] = useState(false);
  const [screen, setScreen] = useState("home");
  const [navData, setNavData] = useState(null);
  const [userPrefs, setUserPrefs] = useState({
    name: "Student", year: "Year 10",
    texts: ["gatsby","macbeth","war","modernist"], goal: 5,
  });

  // Persistent gamification state
  const [gameState, setGameState] = useState({
    totalXP: 0,
    streak: 0,
    lastPracticeDate: null,   // ISO date, set on practice completion
    lastOpenDate: null,       // ISO date, used for streak reset check
    unlockedBadges: [],
    badgeSeenModal: [],
    wordsToday: 0,
    todayDate: null,
    practiceSessions: 0,
    quizCompleted: 0,
    perfectQuizzes: 0,
    wordleSolves: 0,
    crosswordSolves: 0,
    quizAttempts: 0,
    quizCorrect: 0,
  });

  const [wordsDB, setWordsDB] = useState(ALL_WORDS_DB);
  const [journalEntries, setJournalEntries] = useState([]);

  // Modal queue — badge IDs waiting to be shown
  const [badgeQueue, setBadgeQueue] = useState([]);
  const [levelUpData, setLevelUpData] = useState(null);

  // Guard: prevents persist effects from writing blank initial state
  // to localStorage before the load effect has merged saved data.
  // Set to true only after the load effect completes.
  const loadedRef = useRef(false);

  // ── Load from localStorage on mount ──
  useEffect(() => {
    const savedUser = Storage.get(STORAGE_KEYS.USER);
    const savedWords = Storage.get(STORAGE_KEYS.WORDS);
    const savedJournal = Storage.get(STORAGE_KEYS.JOURNAL);

    if (savedUser) {
      setUserPrefs({
        name: savedUser.name || "Student",
        year: savedUser.year || "Year 10",
        texts: savedUser.texts || ["gatsby","macbeth","war","modernist"],
        goal: savedUser.goal || 5,
      });
      // Check streak before restoring — it may have expired
      const today = todayISO();
      const restoredStreak = calcStreak(
        savedUser.lastPracticeDate,
        savedUser.streak || 0,
        today
      );
      setGameState({
        totalXP:          savedUser.totalXP          ?? 0,
        streak:           restoredStreak,
        lastPracticeDate: savedUser.lastPracticeDate ?? null,
        lastOpenDate:     today,
        unlockedBadges:   savedUser.unlockedBadges   ?? [],
        badgeSeenModal:   savedUser.badgeSeenModal   ?? [],
        wordsToday:       savedUser.todayDate === today ? (savedUser.wordsToday ?? 0) : 0,
        todayDate:        today,
        practiceSessions: savedUser.practiceSessions ?? 0,
        quizCompleted:    savedUser.quizCompleted    ?? 0,
        perfectQuizzes:   savedUser.perfectQuizzes   ?? 0,
        wordleSolves:     savedUser.wordleSolves     ?? 0,
        crosswordSolves:  savedUser.crosswordSolves  ?? 0,
        quizAttempts:     savedUser.quizAttempts     ?? 0,
        quizCorrect:      savedUser.quizCorrect      ?? 0,
      });
      setOnboarded(true);
    }

    if (savedWords && savedWords.length > 0) {
      // Merge saved progress back onto the master word list
      // (preserves new words added in updates)
      setWordsDB(prev => prev.map(w => {
        const saved = savedWords.find(sw => sw.id === w.id);
        return saved ? { ...w, ...saved } : w;
      }));
    }

    if (savedJournal) setJournalEntries(savedJournal);

    // Mark load complete — allows persist effects to begin writing
    loadedRef.current = true;
  }, []);

  // ── Persist words whenever they change ──
  useEffect(() => {
    // Guard: skip the initial render — load effect hasn't merged saved SM-2
    // data yet. Without this, blank initial state overwrites saved word
    // progress on every page load before the merge has a chance to run.
    if (!loadedRef.current) return;
    const toSave = wordsDB.map(({ id, strength, status, interval, easeFactor, repetitions, nextReview, lastReviewed }) =>
      ({ id, strength, status, interval, easeFactor, repetitions, nextReview, lastReviewed })
    );
    Storage.set(STORAGE_KEYS.WORDS, toSave);
  }, [wordsDB]);

  // ── Persist journal whenever it changes ──
  useEffect(() => {
    if (!loadedRef.current) return;
    Storage.set(STORAGE_KEYS.JOURNAL, journalEntries);
  }, [journalEntries]);

  // ── Persist game state + user prefs whenever they change ──
  const persistGameState = useCallback((gs, prefs) => {
    Storage.set(STORAGE_KEYS.USER, {
      ...prefs,
      totalXP:          gs.totalXP,
      streak:           gs.streak,
      lastPracticeDate: gs.lastPracticeDate,
      lastOpenDate:     gs.lastOpenDate,
      unlockedBadges:   gs.unlockedBadges,
      badgeSeenModal:   gs.badgeSeenModal,
      wordsToday:       gs.wordsToday,
      todayDate:        gs.todayDate,
      practiceSessions: gs.practiceSessions,
      quizCompleted:    gs.quizCompleted,
      perfectQuizzes:   gs.perfectQuizzes,
      wordleSolves:     gs.wordleSolves,
      crosswordSolves:  gs.crosswordSolves,
      quizAttempts:     gs.quizAttempts,
      quizCorrect:      gs.quizCorrect,
    });
  }, []);

  // ── Core: add XP, check level up, check badges ──
  const awardXP = useCallback((amount, extraStateUpdates = {}) => {
    setGameState(prev => {
      const prevLevel = getLevelData(prev.totalXP).level;
      const newXP = prev.totalXP + Math.max(0, amount);
      const newLevel = getLevelData(newXP).level;

      const next = {
        ...prev,
        ...extraStateUpdates,
        totalXP: newXP,
      };

      // Check for newly unlocked badges
      const newBadgeIds = checkBadges({ ...next, words: wordsDB });
      if (newBadgeIds.length > 0) {
        next.unlockedBadges = [...prev.unlockedBadges, ...newBadgeIds];
        // Queue modals for any badges not yet seen
        const unseen = newBadgeIds.filter(id => !prev.badgeSeenModal.includes(id));
        if (unseen.length > 0) setBadgeQueue(q => [...q, ...unseen]);
      }

      // Level up
      if (newLevel > prevLevel) {
        setLevelUpData(getLevelData(newXP));
      }

      persistGameState(next, userPrefs);
      return next;
    });
  }, [wordsDB, userPrefs, persistGameState]);

  // ── Update word with SM-2 result ──
  const updateWord = useCallback((id, updates) => {
    setWordsDB(prev => prev.map(w => w.id === id ? { ...w, ...updates } : w));
  }, []);

  // ── Rate a word (SM-2) and award XP ──
  const rateWord = useCallback((wordId, rating) => {
    const word = wordsDB.find(w => w.id === wordId);
    if (!word) return;
    const today = todayISO();
    const sm2Result = applySM2(word, rating, today);
    updateWord(wordId, sm2Result);
    const xpMap = { 3: XP.WORD_EASY, 2: XP.WORD_GOOD, 1: XP.WORD_HARD, 0: XP.WORD_AGAIN };
    awardXP(xpMap[rating] ?? XP.WORD_GOOD);
  }, [wordsDB, updateWord, awardXP]);

  // ── Complete a practice session ──
  const completePractice = useCallback((wordsCount, correctCount) => {
    const today = todayISO();
    const xp = (correctCount * XP.QUIZ_CORRECT) + XP.PRACTICE_COMPLETE;
    const isPerfect = wordsCount > 0 && correctCount === wordsCount;

    setGameState(prev => {
      const newStreak = (prev.lastPracticeDate === today)
        ? prev.streak
        : (prev.lastPracticeDate === addDays(today, -1) || prev.streak === 0)
          ? prev.streak + 1
          : 1;

      const prevLevel = getLevelData(prev.totalXP).level;
      const newXP = prev.totalXP + xp + (isPerfect ? XP.QUIZ_PERFECT_BONUS : 0);
      const newLevel = getLevelData(newXP).level;

      const next = {
        ...prev,
        totalXP: newXP,
        streak: newStreak,
        lastPracticeDate: today,
        todayDate: today,
        wordsToday: (prev.todayDate === today ? prev.wordsToday : 0) + wordsCount,
        practiceSessions: (prev.practiceSessions || 0) + 1,
        perfectQuizzes: isPerfect ? (prev.perfectQuizzes || 0) + 1 : (prev.perfectQuizzes || 0),
        quizAttempts: (prev.quizAttempts || 0) + wordsCount,
        quizCorrect: (prev.quizCorrect || 0) + correctCount,
      };

      const newBadgeIds = checkBadges({ ...next, words: wordsDB });
      if (newBadgeIds.length > 0) {
        next.unlockedBadges = [...prev.unlockedBadges, ...newBadgeIds];
        const unseen = newBadgeIds.filter(id => !prev.badgeSeenModal.includes(id));
        if (unseen.length > 0) setBadgeQueue(q => [...q, ...unseen]);
      }
      if (newLevel > prevLevel) setLevelUpData(getLevelData(newXP));

      persistGameState(next, userPrefs);
      return next;
    });
  }, [wordsDB, userPrefs, persistGameState]);

  // ── Record quiz completion ──
  // Uses functional updater (prev =>) to avoid stale closure on gameState counters.
  // If two quiz completions fire in the same render cycle, each reads the latest prev.
  const recordQuizComplete = useCallback((correct, total) => {
    if (total <= 0) return; // guard: no-op on empty quiz
    const safeCorrect = Math.min(Math.max(0, correct), total);
    const isPerfect = safeCorrect === total;
    const xp = safeCorrect * XP.QUIZ_CORRECT + (isPerfect ? XP.QUIZ_PERFECT_BONUS : 0);
    setGameState(prev => {
      const prevLevel = getLevelData(prev.totalXP).level;
      const newXP = prev.totalXP + Math.max(0, xp);
      const newLevel = getLevelData(newXP).level;
      const next = {
        ...prev,
        totalXP: newXP,
        quizCompleted:  (prev.quizCompleted  || 0) + 1,
        perfectQuizzes: isPerfect ? (prev.perfectQuizzes || 0) + 1 : (prev.perfectQuizzes || 0),
        quizAttempts:   (prev.quizAttempts   || 0) + total,
        quizCorrect:    (prev.quizCorrect    || 0) + safeCorrect,
      };
      const newBadgeIds = checkBadges({ ...next, words: wordsDB });
      if (newBadgeIds.length > 0) {
        next.unlockedBadges = [...prev.unlockedBadges, ...newBadgeIds];
        const unseen = newBadgeIds.filter(id => !prev.badgeSeenModal.includes(id));
        if (unseen.length > 0) setBadgeQueue(q => [...q, ...unseen]);
      }
      if (newLevel > prevLevel) setLevelUpData(getLevelData(newXP));
      persistGameState(next, userPrefs);
      return next;
    });
  }, [wordsDB, userPrefs, persistGameState]);

  // ── Record wordle solve ──
  const recordWordleSolve = useCallback((guessCount) => {
    const xpMap = { 1: XP.WORDLE_1, 2: XP.WORDLE_2, 3: XP.WORDLE_3, 4: XP.WORDLE_4, 5: XP.WORDLE_5, 6: XP.WORDLE_6 };
    const xp = xpMap[guessCount] || XP.WORDLE_6;
    setGameState(prev => {
      const prevLevel = getLevelData(prev.totalXP).level;
      const newXP = prev.totalXP + Math.max(0, xp);
      const newLevel = getLevelData(newXP).level;
      const next = { ...prev, totalXP: newXP, wordleSolves: (prev.wordleSolves || 0) + 1 };
      const newBadgeIds = checkBadges({ ...next, words: wordsDB });
      if (newBadgeIds.length > 0) {
        next.unlockedBadges = [...prev.unlockedBadges, ...newBadgeIds];
        const unseen = newBadgeIds.filter(id => !prev.badgeSeenModal.includes(id));
        if (unseen.length > 0) setBadgeQueue(q => [...q, ...unseen]);
      }
      if (newLevel > prevLevel) setLevelUpData(getLevelData(newXP));
      persistGameState(next, userPrefs);
      return next;
    });
  }, [wordsDB, userPrefs, persistGameState]);

  // ── Record crossword complete ──
  const recordCrosswordComplete = useCallback(() => {
    setGameState(prev => {
      const prevLevel = getLevelData(prev.totalXP).level;
      const newXP = prev.totalXP + XP.CROSSWORD_COMPLETE;
      const newLevel = getLevelData(newXP).level;
      const next = { ...prev, totalXP: newXP, crosswordSolves: (prev.crosswordSolves || 0) + 1 };
      const newBadgeIds = checkBadges({ ...next, words: wordsDB });
      if (newBadgeIds.length > 0) {
        next.unlockedBadges = [...prev.unlockedBadges, ...newBadgeIds];
        const unseen = newBadgeIds.filter(id => !prev.badgeSeenModal.includes(id));
        if (unseen.length > 0) setBadgeQueue(q => [...q, ...unseen]);
      }
      if (newLevel > prevLevel) setLevelUpData(getLevelData(newXP));
      persistGameState(next, userPrefs);
      return next;
    });
  }, [wordsDB, userPrefs, persistGameState]);

  // ── Record QuadWord complete ──
  // QuadWord awards XP based on guesses remaining, same pattern as other puzzles.
  // boardsCount = number of boards solved (1-4); guessesUsed = total guesses taken.
  const recordQuadWordComplete = useCallback((boardsCount, guessesUsed) => {
    const safeBoards = Math.min(Math.max(1, boardsCount || 1), 4);
    const xp = Math.max(10, safeBoards * 10 + Math.max(0, (9 - (guessesUsed || 9)) * 5));
    setGameState(prev => {
      const prevLevel = getLevelData(prev.totalXP).level;
      const newXP = prev.totalXP + xp;
      const newLevel = getLevelData(newXP).level;
      const next = { ...prev, totalXP: newXP, wordleSolves: (prev.wordleSolves || 0) + 1 };
      const newBadgeIds = checkBadges({ ...next, words: wordsDB });
      if (newBadgeIds.length > 0) {
        next.unlockedBadges = [...prev.unlockedBadges, ...newBadgeIds];
        const unseen = newBadgeIds.filter(id => !prev.badgeSeenModal.includes(id));
        if (unseen.length > 0) setBadgeQueue(q => [...q, ...unseen]);
      }
      if (newLevel > prevLevel) setLevelUpData(getLevelData(newXP));
      persistGameState(next, userPrefs);
      return next;
    });
  }, [wordsDB, userPrefs, persistGameState]);

  const handleNav = useCallback((s, data = null) => {
    setScreen(s);
    setNavData(data);
  }, []);

  return (
    <div style={{
      minHeight: "100vh", display: "flex", justifyContent: "center",
      alignItems: "flex-start", padding: "20px 0",
      background: "#08080c", fontFamily: T.sans,
    }}>
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;0,9..144,800;1,9..144,400&display=swap');
        @keyframes fadeSlideUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes pulseGlow { 0%, 100% { box-shadow: 0 0 20px rgba(255,107,53,0.3), 0 0 60px rgba(255,45,85,0.1); } 50% { box-shadow: 0 0 30px rgba(255,107,53,0.5), 0 0 80px rgba(255,45,85,0.2); } }
        @keyframes shimmer { 0% { background-position: -200% center; } 100% { background-position: 200% center; } }
        @keyframes breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
        @keyframes flameDance { 0%, 100% { transform: rotate(-2deg) scale(1); } 25% { transform: rotate(2deg) scale(1.05); } 75% { transform: rotate(1.5deg) scale(1.04); } }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 20% { transform: translateX(-6px); } 40% { transform: translateX(6px); } 60% { transform: translateX(-4px); } 80% { transform: translateX(4px); } }
        * { box-sizing: border-box; }
      `}</style>

      {/* Badge unlock modal — shows one at a time from queue */}
      {badgeQueue.length > 0 && (
        <BadgeModal
          badgeId={badgeQueue[0]}
          onDismiss={() => {
            const seen = badgeQueue[0];
            setBadgeQueue(q => q.slice(1));
            setGameState(prev => {
              const next = { ...prev, badgeSeenModal: [...prev.badgeSeenModal, seen] };
              persistGameState(next, userPrefs);
              return next;
            });
          }}
        />
      )}

      {/* Level up modal */}
      {levelUpData && badgeQueue.length === 0 && (
        <LevelUpModal levelData={levelUpData} onDismiss={() => setLevelUpData(null)} />
      )}

      {!onboarded ? (
        <OnboardingScreen onComplete={(prefs) => {
          setUserPrefs(prefs);
          setOnboarded(true);
          Storage.set(STORAGE_KEYS.USER, { ...prefs, totalXP:0, streak:0, lastPracticeDate:null, unlockedBadges:[], badgeSeenModal:[], wordsToday:0, todayDate:todayISO(), practiceSessions:0, quizCompleted:0, perfectQuizzes:0, wordleSolves:0, crosswordSolves:0, quizAttempts:0, quizCorrect:0 });
        }} />
      ) : (
        <PhoneFrame>
          {screen === "home" && (
            <HomeScreen
              onNav={handleNav}
              userPrefs={userPrefs}
              wordsDB={wordsDB}
              gameState={gameState}
              badges={BADGES}
            />
          )}
          {screen === "words" && <WordListsScreen onNav={handleNav} wordsDB={wordsDB} />}
          {screen === "cards" && (
            <WordCardsScreen
              onNav={handleNav}
              startWordId={navData?.wordId}
              wordsDB={wordsDB}
              updateWord={updateWord}
              rateWord={rateWord}
            />
          )}
          {screen === "practice" && (
            <PracticeScreen
              onNav={handleNav}
              userPrefs={userPrefs}
              wordsDB={wordsDB}
              updateWord={updateWord}
              completePractice={completePractice}
            />
          )}
          {screen === "quiz" && (
            <QuizScreen
              onNav={handleNav}
              recordQuizComplete={recordQuizComplete}
            />
          )}
          {screen === "journal" && (
            <JournalScreen
              onNav={handleNav}
              entries={journalEntries}
              setEntries={(e) => setJournalEntries(e)}
            />
          )}
          {screen === "wordle" && (
            <WordlePuzzle
              onNav={handleNav}
              recordWordleSolve={recordWordleSolve}
            />
          )}
          {screen === "crossword" && (
            <CrosswordPuzzle
              onNav={handleNav}
              recordCrosswordComplete={recordCrosswordComplete}
            />
          )}
          {screen === "quadword" && (
            <QuadWordPuzzle
              onNav={handleNav}
              onComplete={recordQuadWordComplete}
            />
          )}
          {screen === "badges" && (
            <BadgesScreen onNav={handleNav} gameState={gameState} badges={BADGES} />
          )}
          {screen === "settings" && (
            <SettingsScreen
              onNav={handleNav}
              userPrefs={userPrefs}
              setUserPrefs={(prefs) => {
                setUserPrefs(prefs);
                persistGameState(gameState, prefs);
              }}
              onReset={() => {
                Storage.clear();
                setOnboarded(false);
                setGameState({ totalXP:0, streak:0, lastPracticeDate:null, lastOpenDate:null, unlockedBadges:[], badgeSeenModal:[], wordsToday:0, todayDate:null, practiceSessions:0, quizCompleted:0, perfectQuizzes:0, wordleSolves:0, crosswordSolves:0, quizAttempts:0, quizCorrect:0 });
                setWordsDB(ALL_WORDS_DB);
                setJournalEntries([]);
              }}
            />
          )}
          <div style={{ paddingBottom: 0 }} />
          <BottomNav active={screen} onNav={handleNav} />
        </PhoneFrame>
      )}
    </div>
  );
}

    // Mount the app
    const rootEl = document.getElementById('root');
    const reactRoot = ReactDOM.createRoot(rootEl);
    reactRoot.render(React.createElement(WordSmithApp));

    // Hide loading screen once React has rendered
    // Small delay ensures first paint is complete
    setTimeout(() => {
      const loader = document.getElementById('loading');
      if (loader) {
        loader.style.transition = 'opacity 0.4s ease';
        loader.style.opacity = '0';
        setTimeout(() => loader.remove(), 400);
      }
    }, 800);

  </script>

  <!-- Service Worker registration for offline support -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js')
          .then(reg => console.log('WordSmith SW registered:', reg.scope))
          .catch(err => console.log('SW registration failed:', err));
      });
    }
  </script>

</body>
</html>
